<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obby 3D Estilo Roblox — 100 Etapas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
            background: #1d4ed8;
        }
        .roblox-title {
            font-family: 'Fredoka', 'Inter', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .roblox-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
            box-shadow: 0 4px 0 rgba(15, 23, 42, 0.35);
        }
        .roblox-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.35);
        }
        #dynamic-joy-base {
            position: fixed;
            width: 112px;
            height: 112px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.16);
            border: 2px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 25;
        }
        #dynamic-joy-knob {
            position: absolute;
            width: 48px;
            height: 48px;
            left: 50%;
            top: 50%;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.35);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- Joystick dinámico invisible hasta que se toca el lado izquierdo -->
    <div id="dynamic-joy-base">
        <div id="dynamic-joy-knob"></div>
    </div>

    <!-- Banner de notificación -->
    <div id="toast-banner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200">
        <div id="toast-text" class="bg-slate-950/90 text-amber-300 border border-amber-400/40 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold shadow-xl"></div>
    </div>

    <!-- Pantalla de Inicio / Lobby estilo Roblox -->
    <div id="lobby-screen" class="fixed inset-0 z-30 flex items-center justify-center p-4 bg-gradient-to-b from-sky-500/75 via-blue-700/75 to-slate-950/85 backdrop-blur-sm">
        <div class="w-full max-w-md bg-slate-900/90 border-2 border-white/20 rounded-3xl p-6 text-white shadow-2xl text-center">
            <div class="inline-block bg-amber-400 text-slate-950 font-black text-xs px-3 py-1 rounded-full mb-2">
                OBBY 3D • 100 ETAPAS
            </div>
            <h1 class="roblox-title text-3xl sm:text-4xl font-bold tracking-tight mb-2">
                Colorful 100-Stage Obby
            </h1>
            <p class="text-slate-300 text-xs sm:text-sm mb-5">
                Comienza en el Nivel 1, guarda checkpoints en orden, esquiva la lava y derriba enemigos voladores.
            </p>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Etapa Máxima</div>
                    <div id="lobby-max-level" class="text-lg font-black text-sky-300 mt-0.5">1 / 100</div>
                </div>
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Monedas</div>
                    <div id="lobby-coins" class="text-lg font-black text-amber-300 mt-0.5">0</div>
                </div>
            </div>

            <div class="flex flex-col gap-2.5">
                <button id="btn-play" class="roblox-btn w-full py-3.5 rounded-2xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-base tracking-wide">
                    ▶ JUGAR NIVEL 1
                </button>
                <button id="btn-open-levels" class="roblox-btn w-full py-3 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-sm">
                    🗺️ Elegir Etapa (1 - 100)
                </button>
            </div>
        </div>
    </div>

    <!-- HUD Superior y Controles en Juego -->
    <div id="hud-layer" class="fixed inset-0 pointer-events-none z-20 hidden flex-col justify-between p-3 sm:p-5">
        <div class="flex items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
                <button id="btn-hud-lobby" class="roblox-btn bg-amber-400 hover:bg-amber-300 text-slate-900 px-3 py-2 rounded-2xl border-2 border-slate-900/20 text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                    <span>🏠</span>
                    <span>Inicio</span>
                </button>
                <button id="btn-hud-levels" class="roblox-btn bg-sky-400 hover:bg-sky-300 text-slate-950 px-3 py-2 rounded-2xl border-2 border-slate-900/20 text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                    <span>🗺️</span>
                    <span>Etapas</span>
                </button>
            </div>

            <!-- Barra central estilo Roblox -->
            <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto bg-indigo-950/65 backdrop-blur-md px-2.5 py-1.5 rounded-full border border-indigo-300/35 shadow-lg">
                <button id="btn-stage-first" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Nivel 1">«</button>
                <button id="btn-stage-prev" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Etapa anterior">‹</button>
                <div class="px-2.5 sm:px-3.5 py-0.5 rounded-full bg-indigo-600/90 border border-indigo-200/40 text-white font-black text-xs sm:text-sm tracking-wide">
                    <span id="hud-level-text" class="text-amber-300">1</span><span class="text-indigo-200/80">/100</span>
                </div>
                <button id="btn-stage-next" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Siguiente etapa">›</button>
                <button id="btn-stage-max" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Etapa máxima desbloqueada">»</button>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <div class="bg-slate-900/80 text-amber-300 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl border border-amber-400/40 font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                    <span>🪙</span>
                    <span id="hud-coins-text">0</span>
                </div>
                <button id="btn-hud-sound" class="roblox-btn bg-slate-800/85 hover:bg-slate-700 text-white p-2.5 rounded-2xl border border-white/20 text-sm font-bold" title="Sonido">
                    🔊
                </button>
            </div>
        </div>

        <!-- Zona inferior: botón de disparar cómodo en esquina inferior derecha -->
        <div class="flex items-end justify-between gap-3">
            <div class="hidden sm:block pointer-events-none">
                <span class="inline-block bg-slate-900/60 text-white/95 text-xs px-3.5 py-1 rounded-full backdrop-blur-sm">
                    Izquierda: mover • Derecha: saltar / cámara • Disparar (F)
                </span>
            </div>
            <div class="ml-auto mb-4 mr-2 sm:mb-6 sm:mr-5 pointer-events-auto flex items-center gap-2.5">
                <button id="btn-hud-shoot" class="roblox-btn w-16 h-16 sm:w-18 sm:h-18 rounded-full bg-rose-500 hover:bg-rose-400 text-white border-2 border-rose-200/70 font-black text-xs sm:text-sm flex flex-col items-center justify-center shadow-xl" title="Disparar (F)">
                    <span class="text-xl leading-none">⚡</span>
                    <span class="text-[10px] tracking-wide mt-0.5">FUEGO</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Selector de Etapas -->
    <div id="levels-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-slate-900 border-2 border-white/20 rounded-3xl p-5 sm:p-6 text-white shadow-2xl max-h-[82vh] flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="roblox-title text-xl sm:text-2xl font-bold">Seleccionar Etapa</h2>
                <button id="btn-close-levels" class="roblox-btn bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold">
                    ✕ Cerrar
                </button>
            </div>
            <div id="levels-grid" class="grid grid-cols-5 gap-2 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN Y ESTADO PERSISTENTE
        // ==========================================
        const TOTAL_LEVELS = 100;
        const STORAGE_KEY = 'obby_roblox_100_visible_v9';

        const PLAYER_GLB_URL = './character-opt%20%281%29.glb';
        const MAP_GLB_URL = './colorful_100-stage_obby.glb';
        const ANIM_IDLE_GLB_URL = './Stop%20Walking.glb';
        const ANIM_RUN_GLB_URL = './Running%20%281%29%20%281%29.glb';
        const ANIM_JUMP_GLB_URL = './Jump.glb';

        const PLAYER_TARGET_HEIGHT = 2.4;
        const MAP_TARGET_SPAN = 180;

        const state = {
            mode: 'lobby',
            currentLevel: 1,
            maxUnlockedLevel: 1,
            coins: 0,
            soundEnabled: true
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (typeof parsed.currentLevel === 'number') {
                    state.currentLevel = Math.max(1, Math.min(TOTAL_LEVELS, parsed.currentLevel));
                }
                if (typeof parsed.maxUnlockedLevel === 'number') {
                    state.maxUnlockedLevel = Math.max(1, Math.min(TOTAL_LEVELS, parsed.maxUnlockedLevel));
                }
                if (typeof parsed.coins === 'number') {
                    state.coins = Math.max(0, Math.floor(parsed.coins));
                }
                if (typeof parsed.soundEnabled === 'boolean') {
                    state.soundEnabled = parsed.soundEnabled;
                }
            } catch (err) {
                console.warn('Error cargando progreso:', err);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    currentLevel: state.currentLevel,
                    maxUnlockedLevel: state.maxUnlockedLevel,
                    coins: state.coins,
                    soundEnabled: state.soundEnabled
                }));
            } catch (err) {
                console.warn('Error guardando progreso:', err);
            }
        }

        // ==========================================
        // AUDIO PROCEDURAL + MÚSICA DE SUSPENSO
        // ==========================================
        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;

        function ensureAudioContext() {
            if (!state.soundEnabled) return null;
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.08, slideToFreq = null) {
            const ctx = ensureAudioContext();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideToFreq) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideToFreq), now + duration);
                }
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (err) {}
        }

        function sfxJump() { playTone(310, 0.14, 'square', 0.06, 620); }
        function sfxCoin() {
            playTone(880, 0.08, 'sine', 0.08, 1174.66);
            setTimeout(() => playTone(1318.5, 0.12, 'sine', 0.07), 65);
        }
        function sfxCheckpoint() {
            playTone(523.25, 0.09, 'triangle', 0.09, 659.25);
            setTimeout(() => playTone(783.99, 0.14, 'triangle', 0.09, 1046.5), 75);
        }
        function sfxShoot() { playTone(780, 0.08, 'square', 0.065, 240); }
        function sfxEnemyDown() {
            playTone(320, 0.12, 'sawtooth', 0.085, 110);
            setTimeout(() => playTone(660, 0.1, 'triangle', 0.07, 940), 60);
        }
        function sfxFail() { playTone(220, 0.25, 'sawtooth', 0.08, 95); }

        function startSuspenseMusic() {
            stopSuspenseMusic();
            if (!state.soundEnabled) return;
            ensureAudioContext();
            const bassNotes = [110, 110, 130.81, 123.47, 110, 110, 146.83, 138.59];
            const tensionLead = [440, 0, 466.16, 440, 392, 0, 349.23, 369.99];

            bgmTimer = setInterval(() => {
                if (!state.soundEnabled || state.mode !== 'playing') return;
                const idx = bgmStep % bassNotes.length;
                playTone(bassNotes[idx], 0.13, 'triangle', 0.045);
                if (tensionLead[idx] > 0) {
                    playTone(tensionLead[idx], 0.11, 'sawtooth', 0.025);
                }
                if (bgmStep % 2 === 0) {
                    playTone(1250, 0.025, 'sine', 0.018);
                }
                bgmStep += 1;
            }, 230);
        }

        function stopSuspenseMusic() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        // ==========================================
        // INTERFAZ (HUD, LOBBY, NIVELES, TOAST)
        // ==========================================
        let toastTimeout = null;
        function showToast(msg, duration = 2000) {
            const banner = document.getElementById('toast-banner');
            const textEl = document.getElementById('toast-text');
            if (!banner || !textEl) return;
            textEl.textContent = msg;
            banner.classList.remove('opacity-0');
            banner.classList.add('opacity-100');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                banner.classList.remove('opacity-100');
                banner.classList.add('opacity-0');
            }, duration);
        }

        function updateHud() {
            document.getElementById('hud-level-text').textContent = String(state.currentLevel);
            document.getElementById('hud-coins-text').textContent = String(state.coins);
            document.getElementById('lobby-max-level').textContent = `${state.maxUnlockedLevel} / ${TOTAL_LEVELS}`;
            document.getElementById('lobby-coins').textContent = String(state.coins);
            const soundBtn = document.getElementById('btn-hud-sound');
            if (soundBtn) {
                soundBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
            }
        }

        function setMode(newMode) {
            state.mode = newMode;
            const lobbyEl = document.getElementById('lobby-screen');
            const hudEl = document.getElementById('hud-layer');
            const joyEl = document.getElementById('dynamic-joy-base');

            if (newMode === 'playing') {
                lobbyEl.classList.add('hidden');
                hudEl.classList.remove('hidden');
                hudEl.classList.add('flex');
                snapCameraToPlayer();
                startSuspenseMusic();
            } else {
                lobbyEl.classList.remove('hidden');
                hudEl.classList.add('hidden');
                hudEl.classList.remove('flex');
                if (joyEl) joyEl.style.display = 'none';
                stopSuspenseMusic();
            }
            updateHud();
        }

        function openLevelsModal() {
            const modal = document.getElementById('levels-modal');
            const grid = document.getElementById('levels-grid');
            if (!modal || !grid) return;
            grid.innerHTML = '';

            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const unlocked = i <= state.maxUnlockedLevel;
                const isCurrent = i === state.currentLevel;
                const btn = document.createElement('button');
                btn.className = `roblox-btn py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border ${
                    !unlocked
                        ? 'bg-slate-800/50 text-slate-500 border-white/5 cursor-not-allowed'
                        : isCurrent
                            ? 'bg-amber-400 text-slate-950 border-amber-200'
                            : 'bg-sky-500/90 hover:bg-sky-400 text-slate-950 border-white/20'
                }`;
                btn.textContent = unlocked ? `${i}` : `🔒${i}`;
                btn.disabled = !unlocked;
                btn.addEventListener('click', () => {
                    if (!unlocked) return;
                    state.currentLevel = i;
                    saveState();
                    teleportToStageProgress(i);
                    closeLevelsModal();
                    setMode('playing');
                    showToast(`Etapa ${i} seleccionada`);
                });
                grid.appendChild(btn);
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLevelsModal() {
            const modal = document.getElementById('levels-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ==========================================
        // ESCENA THREE.JS, MAPA PRINCIPAL Y JUGADOR
        // ==========================================
        let scene, camera, renderer, clock;
        let mapGroup, entitiesGroup, sceneryGroup;
        let lavaSeaMesh, lavaSeaMat;
        let mapLoaded = false;
        let mapMeshes = [];
        let mapBox = null;
        let lavaFloorY = -20;
        let level1Spawn = new THREE.Vector3(0, 2, 0);
        let currentSpawn = new THREE.Vector3(0, 2, 0);

        const raycaster = new THREE.Raycaster();
        const downDir = new THREE.Vector3(0, -1, 0);

        const coins = [];
        const checkpoints = [];
        const lavaSplashes = [];
        const aerialEnemies = [];
        const playerShots = [];
        const enemyFireballs = [];
        const studTextureCache = new Map();

        const player = {
            root: null,
            visualPivot: null,
            fallbackGroup: null,
            customModel: null,
            baseScale: 1,
            mixer: null,
            actions: {
                idle: null,
                run: null,
                jump: null
            },
            activeAnimKey: null,
            hasCustomModel: false,
            leftLeg: null,
            rightLeg: null,
            leftArm: null,
            rightArm: null,
            pos: new THREE.Vector3(0, 2, 0),
            vel: new THREE.Vector3(0, 0, 0),
            yaw: 0,
            onGround: false,
            jumpsUsed: 0,
            maxJumps: 2,
            walkCycle: 0,
            animBlend: 0
        };

        const camCtrl = {
            yaw: 0,
            pitch: 0.42,
            distance: 13.0
        };

        function computeCameraDesiredPos(target) {
            const horizDist = Math.cos(camCtrl.pitch) * camCtrl.distance;
            const vertDist = Math.sin(camCtrl.pitch) * camCtrl.distance;

            const desiredPos = new THREE.Vector3(
                target.x + Math.sin(camCtrl.yaw) * horizDist,
                target.y + vertDist,
                target.z + Math.cos(camCtrl.yaw) * horizDist
            );

            if (mapLoaded && mapMeshes.length > 0) {
                const dir = desiredPos.clone().sub(target);
                const maxDist = dir.length();
                if (maxDist > 0.5) {
                    dir.normalize();
                    const camRay = new THREE.Raycaster(target, dir, 0.3, maxDist);
                    const hits = camRay.intersectObjects(mapMeshes, true);
                    if (hits.length > 0) {
                        const safeDist = Math.max(6.0, hits[0].distance - 0.75);
                        desiredPos.copy(target).addScaledVector(dir, safeDist);
                    }
                }
            }

            return desiredPos;
        }

        function snapCameraToPlayer() {
            if (!camera || !player.pos) return;
            const target = new THREE.Vector3(player.pos.x, player.pos.y + 2.1, player.pos.z);
            const desiredPos = computeCameraDesiredPos(target);
            camera.position.copy(desiredPos);
            camera.lookAt(target);
        }

        function getStuddedMaterial(hexColor, roughness = 0.55) {
            const key = `${hexColor}_${roughness}`;
            let tex = studTextureCache.get(key);
            if (!tex) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const base = new THREE.Color(hexColor);
                const r = Math.round(base.r * 255);
                const g = Math.round(base.g * 255);
                const b = Math.round(base.b * 255);

                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(0, 0, 128, 128);

                ctx.strokeStyle = 'rgba(15, 23, 42, 0.22)';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, 124, 124);

                const coords = [32, 96];
                for (const cx of coords) {
                    for (const cy of coords) {
                        ctx.beginPath();
                        ctx.arc(cx, cy, 13, 0, Math.PI * 2);
                        ctx.fillStyle = `rgb(${Math.min(255, r + 28)},${Math.min(255, g + 28)},${Math.min(255, b + 28)})`;
                        ctx.fill();
                        ctx.lineWidth = 2.5;
                        ctx.strokeStyle = 'rgba(15, 23, 42, 0.28)';
                        ctx.stroke();
                    }
                }

                tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.encoding = THREE.sRGBEncoding;
                studTextureCache.set(key, tex);
            }

            const mat = new THREE.MeshStandardMaterial({
                map: tex.clone(),
                roughness,
                metalness: 0.08
            });
            mat.map.needsUpdate = true;
            return mat;
        }

        function createLiquidLavaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, '#ea580c');
            grad.addColorStop(0.5, '#f97316');
            grad.addColorStop(1, '#dc2626');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                const yBase = (i / 18) * 256;
                for (let x = 0; x <= 256; x += 16) {
                    const y = yBase + Math.sin((x / 256) * Math.PI * 4 + i) * 9;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(254, 240, 138, 0.42)' : 'rgba(153, 27, 27, 0.45)';
                ctx.lineWidth = 6;
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(28, 28);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function buildLavaSea() {
            const lavaTex = createLiquidLavaTexture();
            lavaSeaMat = new THREE.MeshStandardMaterial({
                map: lavaTex,
                emissive: new THREE.Color(0xea580c),
                emissiveMap: lavaTex,
                emissiveIntensity: 0.75,
                roughness: 0.2,
                metalness: 0.1
            });

            const seaGeo = new THREE.PlaneGeometry(750, 750, 24, 24);
            seaGeo.rotateX(-Math.PI / 2);
            lavaSeaMesh = new THREE.Mesh(seaGeo, lavaSeaMat);
            lavaSeaMesh.position.set(0, lavaFloorY, 0);
            sceneryGroup.add(lavaSeaMesh);
        }

        function initLavaSplashPool() {
            const geo = new THREE.SphereGeometry(0.24, 8, 8);
            for (let i = 0; i < 42; i++) {
                const isSpark = i % 3 === 0;
                const mat = new THREE.MeshBasicMaterial({
                    color: isSpark ? 0xfef08a : 0xf97316
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.visible = false;
                sceneryGroup.add(mesh);
                lavaSplashes.push({
                    mesh,
                    active: false,
                    vel: new THREE.Vector3(),
                    life: 0
                });
            }
        }

        function spawnLavaSplashDroplet(x, y, z) {
            const slot = lavaSplashes.find(s => !s.active);
            if (!slot) return;
            slot.active = true;
            slot.mesh.visible = true;
            slot.mesh.position.set(x, y, z);
            slot.vel.set(
                (Math.random() - 0.5) * 5.0,
                6.0 + Math.random() * 7.0,
                (Math.random() - 0.5) * 5.0
            );
            slot.life = 0.85 + Math.random() * 0.45;
        }

        function updateLavaSplashes(dt) {
            if (lavaSeaMat && lavaSeaMat.map) {
                lavaSeaMat.map.offset.x += dt * 0.055;
                lavaSeaMat.map.offset.y += dt * 0.04;
            }

            if (Math.random() < dt * 20 && player.pos) {
                const sx = player.pos.x + (Math.random() - 0.5) * 40;
                const sz = player.pos.z + (Math.random() - 0.5) * 40;
                spawnLavaSplashDroplet(sx, lavaFloorY + 0.3, sz);
            }

            for (const s of lavaSplashes) {
                if (!s.active) continue;
                s.life -= dt;
                s.vel.y -= 16.5 * dt;
                s.mesh.position.addScaledVector(s.vel, dt);
                if (s.life <= 0 || s.mesh.position.y < lavaFloorY - 0.5) {
                    s.active = false;
                    s.mesh.visible = false;
                }
            }
        }

        function findSurfaceHeightAt(x, z, startY = 120) {
            if (!mapLoaded || mapMeshes.length === 0) return null;
            raycaster.set(new THREE.Vector3(x, startY, z), downDir);
            raycaster.far = 300;
            const hits = raycaster.intersectObjects(mapMeshes, true);
            if (hits.length > 0) {
                return hits[0].point.y;
            }
            return null;
        }

        }

        function populateMapEntities() {
            clearEntities();
            if (!mapBox) return;

            const spanX = mapBox.max.x - mapBox.min.x;
            const searchTopY = mapBox.max.y + 30;

            let bestStart = null;
            const candidateCoords = [
                [0, mapBox.max.z * 0.25],
                [0, 0],
                [mapBox.min.x * 0.2, mapBox.max.z * 0.2],
                [mapBox.max.x * 0.2, mapBox.max.z * 0.2],
                [0, mapBox.min.z * 0.2]
            ];

            for (const [cx, cz] of candidateCoords) {
                const sy = findSurfaceHeightAt(cx, cz, searchTopY);
                if (typeof sy === 'number' && Number.isFinite(sy)) {
                    bestStart = new THREE.Vector3(cx, sy + 0.15, cz);
                    break;
                }
            }

            if (!bestStart) {
                const center = new THREE.Vector3();
                mapBox.getCenter(center);
                const sy = findSurfaceHeightAt(center.x, center.z, searchTopY);
                bestStart = new THREE.Vector3(
                    center.x,
                    typeof sy === 'number' ? sy + 0.15 : 1.0,
                    center.z
                );
            }

            level1Spawn.copy(bestStart);
            currentSpawn.copy(level1Spawn);

            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;
            if (player.root) {
                player.root.position.copy(player.pos);
            }
            snapCameraToPlayer();

            let nextStageNumber = 2;
            for (let step = 1; step <= 20; step++) {
                const frac = step / 21;
                const px = THREE.MathUtils.lerp(bestStart.x, Math.sin(step * 1.1) * (spanX * 0.24), frac);
                const pz = THREE.MathUtils.lerp(bestStart.z, mapBox.min.z * 0.72, frac);
                const surfY = findSurfaceHeightAt(px, pz, searchTopY);
                if (typeof surfY === 'number') {
                    addCoin(px, surfY + 1.2, pz);
                    if (step % 3 === 0 && nextStageNumber <= TOTAL_LEVELS) {
                        addCheckpoint(px, surfY, pz, nextStageNumber);
                        nextStageNumber += 1;
                    }
                    if (step % 4 === 0) {
                        const kind = step % 8 === 0 ? 'dragon' : (step % 2 === 0 ? 'eagle' : 'bird');
                        addAerialEnemy(kind, px, surfY + 4.2, pz, 5.0, 1.9);
                    }
                }
            }
        }

        function teleportToStageProgress(stageNum) {
            if (!mapLoaded || !mapBox) return;
            if (stageNum <= 1) {
                currentSpawn.copy(level1Spawn);
                player.pos.copy(currentSpawn);
                player.vel.set(0, 0, 0);
                player.jumpsUsed = 0;
                if (player.root) player.root.position.copy(player.pos);
                snapCameraToPlayer();
                return;
            }

            const frac = Math.max(0, Math.min(1, (stageNum - 1) / (TOTAL_LEVELS - 1)));
            const spanX = mapBox.max.x - mapBox.min.x;
            const targetX = Math.sin(stageNum * 0.85) * (spanX * 0.22);
            const targetZ = THREE.MathUtils.lerp(level1Spawn.z, mapBox.min.z * 0.75, frac);
            const surfY = findSurfaceHeightAt(targetX, targetZ, mapBox.max.y + 30);
            const destY = typeof surfY === 'number' ? surfY + 0.15 : level1Spawn.y;

            currentSpawn.set(targetX, destY, targetZ);
            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;
            if (player.root) player.root.position.copy(player.pos);
            snapCameraToPlayer();
        }

        function loadMainObbyMapGLB() {
            if (typeof THREE.GLTFLoader !== 'function') {
                showToast('Error: GLTFLoader no disponible', 2200);
                return;
            }

            const loader = new THREE.GLTFLoader();
            loader.load(
                MAP_GLB_URL,
                (gltf) => {
                    if (!gltf || !gltf.scene || !mapGroup) return;

                    while (mapGroup.children.length > 0) {
                        mapGroup.remove(mapGroup.children[0]);
                    }
                    mapMeshes = [];

                    const model = gltf.scene;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.side = THREE.DoubleSide;
                                if (child.material.map) {
                                    child.material.map.encoding = THREE.sRGBEncoding;
                                    child.material.needsUpdate = true;
                                }
                            }
                            mapMeshes.push(child);
                        }
                    });

                    model.updateMatrixWorld(true);
                    let box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.z, 1);
                    const scale = MAP_TARGET_SPAN / maxDim;
                    model.scale.setScalar(scale);

                    model.updateMatrixWorld(true);
                    box = new THREE.Box3().setFromObject(model);
                    const center = new THREE.Vector3();
                    box.getCenter(center);

                    model.position.x -= center.x;
                    model.position.z -= center.z;
                    model.position.y -= box.min.y;

                    model.updateMatrixWorld(true);
                    mapBox = new THREE.Box3().setFromObject(model);

                    lavaFloorY = Math.min(-18, mapBox.min.y - 16);
                    if (lavaSeaMesh) {
                        lavaSeaMesh.position.y = lavaFloorY;
                    }

                    mapGroup.add(model);
                    mapLoaded = true;
                    populateMapEntities();
                    showToast('¡Nivel 1 listo en el mapa Obby!', 1800);
                },
                undefined,
                (err) => {
                    console.warn('Error cargando mapa GLB:', err);
                    showToast('No se pudo cargar el mapa .glb', 2200);
                }
            );
        }

        function loadExternalAnimationClip(url, key, loopMode = THREE.LoopRepeat) {
            if (!player.mixer || typeof THREE.GLTFLoader !== 'function') return;
            const loader = new THREE.GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    if (!gltf || !Array.isArray(gltf.animations) || gltf.animations.length === 0) return;
                    try {
                        const action = player.mixer.clipAction(gltf.animations[0]);
                        action.setLoop(loopMode, Infinity);
                        if (loopMode === THREE.LoopOnce) {
                            action.clampWhenFinished = true;
                        }
                        player.actions[key] = action;
                        if (key === 'idle' && !player.activeAnimKey) {
                            setPlayerAnimation('idle');
                        }
                    } catch (err) {
                        console.warn(`No se pudo enlazar animación ${key}:`, err);
                    }
                },
                undefined,
                (err) => {
                    console.warn(`Error cargando animación ${url}:`, err);
                }
            );
        }

        function setPlayerAnimation(nextKey) {
            if (!player.mixer || !player.hasCustomModel) return;
            const nextAction = player.actions[nextKey];
            if (!nextAction) return;

            if (player.activeAnimKey === nextKey && nextAction.isRunning()) {
                return;
            }

            const prevAction = player.activeAnimKey ? player.actions[player.activeAnimKey] : null;
            nextAction.reset();
            nextAction.setEffectiveTimeScale(1);
            nextAction.setEffectiveWeight(1);
            nextAction.play();

            if (prevAction && prevAction !== nextAction) {
                prevAction.crossFadeTo(nextAction, 0.16, true);
            }
            player.activeAnimKey = nextKey;
        }

        function loadCustomPlayerGLB() {
            if (typeof THREE.GLTFLoader !== 'function') return;

            const loader = new THREE.GLTFLoader();
            loader.load(
                PLAYER_GLB_URL,
                (gltf) => {
                    if (!gltf || !gltf.scene || !player.visualPivot) return;

                    const model = gltf.scene;
                    let meshCount = 0;

                    const visibleFallbackMat = new THREE.MeshStandardMaterial({
                        color: 0x3b82f6,
                        emissive: 0x1d4ed8,
                        emissiveIntensity: 0.25,
                        roughness: 0.4,
                        metalness: 0.1,
                        side: THREE.DoubleSide
                    });

                    model.traverse((child) => {
                        child.visible = true;
                        if (child.isMesh) {
                            meshCount += 1;
                            child.visible = true;
                            child.castShadow = true;
                            child.receiveShadow = true;
                            child.frustumCulled = false;

                            const hasValidTexture = Boolean(
                                child.material &&
                                (Array.isArray(child.material)
                                    ? child.material.some(m => m && m.map)
                                    : child.material.map)
                            );

                            if (!child.material || !hasValidTexture) {
                                child.material = visibleFallbackMat;
                            } else {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach((m) => {
                                    m.visible = true;
                                    m.opacity = 1;
                                    m.transparent = false;
                                    m.side = THREE.DoubleSide;
                                    if (m.map) {
                                        m.map.encoding = THREE.sRGBEncoding;
                                        m.needsUpdate = true;
                                    }
                                    m.needsUpdate = true;
                                });
                            }
                        }
                    });

                    if (meshCount === 0) return;

                    model.position.set(0, 0, 0);
                    model.rotation.set(0, 0, 0);
                    model.scale.set(1, 1, 1);
                    model.updateMatrixWorld(true);

                    let box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);

                    const scale = size.y > 0.0001 ? PLAYER_TARGET_HEIGHT / size.y : 1;
                    player.baseScale = scale;
                    model.scale.setScalar(scale);
                    model.updateMatrixWorld(true);
                    box = new THREE.Box3().setFromObject(model);

                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    model.position.x = -center.x;
                    model.position.z = -center.z;
                    model.position.y = -box.min.y;
                    model.updateMatrixWorld(true);

                    if (player.customModel) {
                        player.visualPivot.remove(player.customModel);
                    }

                    player.customModel = model;
                    player.hasCustomModel = true;
                    player.visualPivot.add(model);

                    // Se mantiene oculto solo si la malla cargó con volumen visible
                    if (player.fallbackGroup) {
                        player.fallbackGroup.visible = false;
                    }

                    player.mixer = new THREE.AnimationMixer(model);

                    if (Array.isArray(gltf.animations) && gltf.animations.length > 0) {
                        player.actions.idle = player.mixer.clipAction(gltf.animations[0]);
                        player.actions.idle.play();
                        player.activeAnimKey = 'idle';
                    }

                    loadExternalAnimationClip(ANIM_IDLE_GLB_URL, 'idle', THREE.LoopRepeat);
                    loadExternalAnimationClip(ANIM_RUN_GLB_URL, 'run', THREE.LoopRepeat);
                    loadExternalAnimationClip(ANIM_JUMP_GLB_URL, 'jump', THREE.LoopRepeat);

                    showToast(`Personaje GLB listo (${meshCount} mallas)`, 1600);
                },
                undefined,
                (err) => {
                    console.warn('No se pudo cargar personaje GLB, se mantiene respaldo:', err);
                    if (player.fallbackGroup) {
                        player.fallbackGroup.visible = true;
                    }
                    showToast('Usando personaje de respaldo', 1600);
                }
            );
        }

        function spawnPlayerShot() {
            if (state.mode !== 'playing' || !player.pos) return;
            sfxShoot();

            const dir = new THREE.Vector3(
                -Math.sin(player.yaw),
                0.08,
                -Math.cos(player.yaw)
            ).normalize();

            let bestEnemy = null;
            let bestDist = 30;
            for (const en of aerialEnemies) {
                if (!en.alive) continue;
                const d = player.pos.distanceTo(en.group.position);
                if (d < bestDist) {
                    bestDist = d;
                    bestEnemy = en;
                }
            }
            if (bestEnemy) {
                dir.copy(bestEnemy.group.position)
                    .sub(new THREE.Vector3(player.pos.x, player.pos.y + 1.1, player.pos.z))
                    .normalize();
            }

            const shotMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.28, 0.28, 0.75),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
            );
            shotMesh.position.set(player.pos.x, player.pos.y + 1.1, player.pos.z);
            shotMesh.lookAt(shotMesh.position.clone().add(dir));
            entitiesGroup.add(shotMesh);

            playerShots.push({
                mesh: shotMesh,
                vel: dir.multiplyScalar(28),
                life: 1.2
            });
        }

        function spawnEnemyFireball(fromPos, targetPos) {
            const dir = targetPos.clone().sub(fromPos).normalize();
            const ball = new THREE.Mesh(
                new THREE.SphereGeometry(0.36, 10, 10),
                new THREE.MeshBasicMaterial({ color: 0xf97316 })
            );
            ball.position.copy(fromPos);
            entitiesGroup.add(ball);

            enemyFireballs.push({
                mesh: ball,
                vel: dir.multiplyScalar(11.5),
                life: 3.0
            });
        }

        function respawnPlayer(byHazard = false) {
            if (byHazard) sfxFail();
            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;
            if (player.root) player.root.position.copy(player.pos);
            snapCameraToPlayer();
            if (byHazard) {
                showToast('¡Caíste en la lava! Regresaste al punto seguro', 1400);
            }
        }

        const input = {
            keys: {},
            joyActive: false,
            joyTouchId: null,
            joyOriginX: 0,
            joyOriginY: 0,
            joyVecX: 0,
            joyVecY: 0,
            camTouchId: null,
            camLastX: 0,
            camLastY: 0,
            camMoved: false
        };

        function updateDynamicJoystickVisual(visible, ox = 0, oy = 0, kx = 0, ky = 0) {
            const base = document.getElementById('dynamic-joy-base');
            const knob = document.getElementById('dynamic-joy-knob');
            if (!base || !knob) return;
            if (!visible) {
                base.style.display = 'none';
                return;
            }
            base.style.display = 'block';
            base.style.left = `${ox}px`;
            base.style.top = `${oy}px`;
            knob.style.left = `calc(50% + ${kx}px)`;
            knob.style.top = `calc(50% + ${ky}px)`;
        }

        function triggerJump() {
            if (state.mode !== 'playing') return;
            if (player.onGround || player.jumpsUsed < player.maxJumps) {
                player.vel.y = player.onGround ? 12.6 : 11.2;
                player.onGround = false;
                player.jumpsUsed += 1;
                sfxJump();
            }
        }

        function bindControls() {
            window.addEventListener('keydown', (e) => {
                input.keys[e.code] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    triggerJump();
                } else if (e.code === 'KeyF' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                    e.preventDefault();
                    spawnPlayerShot();
                }
            });

            window.addEventListener('keyup', (e) => {
                input.keys[e.code] = false;
            });

            const canvas = document.getElementById('game-canvas');
            const maxRadius = 42;

            canvas.addEventListener('touchstart', (e) => {
                if (state.mode !== 'playing') return;
                const halfW = window.innerWidth * 0.5;

                for (const t of e.changedTouches) {
                    if (t.clientX < halfW && !input.joyActive) {
                        input.joyActive = true;
                        input.joyTouchId = t.identifier;
                        input.joyOriginX = t.clientX;
                        input.joyOriginY = t.clientY;
                        input.joyVecX = 0;
                        input.joyVecY = 0;
                        updateDynamicJoystickVisual(true, t.clientX, t.clientY, 0, 0);
                    } else if (t.clientX >= halfW && input.camTouchId === null) {
                        input.camTouchId = t.identifier;
                        input.camLastX = t.clientX;
                        input.camLastY = t.clientY;
                        input.camMoved = false;
                    }
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (state.mode !== 'playing') return;
                for (const t of e.changedTouches) {
                    if (input.joyActive && t.identifier === input.joyTouchId) {
                        let dx = t.clientX - input.joyOriginX;
                        let dy = t.clientY - input.joyOriginY;
                        const dist = Math.hypot(dx, dy);
                        if (dist > maxRadius) {
                            dx = (dx / dist) * maxRadius;
                            dy = (dy / dist) * maxRadius;
                        }
                        input.joyVecX = dx / maxRadius;
                        input.joyVecY = dy / maxRadius;
                        updateDynamicJoystickVisual(true, input.joyOriginX, input.joyOriginY, dx, dy);
                    } else if (input.camTouchId === t.identifier) {
                        const dx = t.clientX - input.camLastX;
                        const dy = t.clientY - input.camLastY;
                        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                            input.camMoved = true;
                        }
                        camCtrl.yaw -= dx * 0.0065;
                        camCtrl.pitch = Math.max(0.2, Math.min(1.05, camCtrl.pitch + dy * 0.005));
                        input.camLastX = t.clientX;
                        input.camLastY = t.clientY;
                    }
                }
            }, { passive: true });

            const onTouchEnd = (e) => {
                for (const t of e.changedTouches) {
                    if (input.joyActive && t.identifier === input.joyTouchId) {
                        input.joyActive = false;
                        input.joyTouchId = null;
                        input.joyVecX = 0;
                        input.joyVecY = 0;
                        updateDynamicJoystickVisual(false);
                    } else if (input.camTouchId === t.identifier) {
                        if (!input.camMoved && state.mode === 'playing') {
                            triggerJump();
                        }
                        input.camTouchId = null;
                    }
                }
            };

            canvas.addEventListener('touchend', onTouchEnd, { passive: true });
            canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

            let mouseDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            canvas.addEventListener('mousedown', (e) => {
                mouseDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!mouseDragging || state.mode !== 'playing') return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                camCtrl.yaw -= dx * 0.0055;
                camCtrl.pitch = Math.max(0.2, Math.min(1.05, camCtrl.pitch + dy * 0.0045));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => {
                mouseDragging = false;
            });

            document.getElementById('btn-play')?.addEventListener('click', () => {
                ensureAudioContext();
                state.currentLevel = 1;
                saveState();
                teleportToStageProgress(1);
                setMode('playing');
            });
            document.getElementById('btn-open-levels')?.addEventListener('click', openLevelsModal);
            document.getElementById('btn-close-levels')?.addEventListener('click', closeLevelsModal);
            document.getElementById('btn-hud-lobby')?.addEventListener('click', () => setMode('lobby'));
            document.getElementById('btn-hud-levels')?.addEventListener('click', openLevelsModal);
            document.getElementById('btn-hud-shoot')?.addEventListener('click', spawnPlayerShot);

            const jumpToStage = (targetLvl) => {
                const clamped = Math.max(1, Math.min(state.maxUnlockedLevel, targetLvl));
                if (clamped === state.currentLevel) return;
                state.currentLevel = clamped;
                saveState();
                teleportToStageProgress(clamped);
                updateHud();
                showToast(`Etapa ${clamped}`, 1100);
            };
            document.getElementById('btn-stage-first')?.addEventListener('click', () => jumpToStage(1));
            document.getElementById('btn-stage-prev')?.addEventListener('click', () => jumpToStage(state.currentLevel - 1));
            document.getElementById('btn-stage-next')?.addEventListener('click', () => jumpToStage(state.currentLevel + 1));
            document.getElementById('btn-stage-max')?.addEventListener('click', () => jumpToStage(state.maxUnlockedLevel));

            document.getElementById('btn-hud-sound')?.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                saveState();
                updateHud();
                if (state.soundEnabled && state.mode === 'playing') {
                    startSuspenseMusic();
                } else {
                    stopSuspenseMusic();
                }
            });
        }

        // ==========================================
        // ANIMACIÓN GLB + PROCEDURAL (CAMINAR, CORRER, SALTAR)
        // ==========================================
        function updateProceduralMovementAnimation(dt, horizSpeed) {
            if (!player.visualPivot) return;

            const isMoving = horizSpeed > 0.35;
            const runRatio = Math.max(0, Math.min(1, (horizSpeed - 1.5) / 6.5));
            const targetBlend = isMoving ? 1 : 0;
            player.animBlend = THREE.MathUtils.lerp(player.animBlend, targetBlend, Math.min(1, dt * 12));

            if (player.hasCustomModel && player.mixer) {
                if (!player.onGround && player.actions.jump) {
                    setPlayerAnimation('jump');
                } else if (isMoving && player.actions.run) {
                    const runAction = player.actions.run;
                    runAction.setEffectiveTimeScale(THREE.MathUtils.clamp(0.85 + runRatio * 0.55, 0.85, 1.45));
                    setPlayerAnimation('run');
                } else if (player.actions.idle) {
                    setPlayerAnimation('idle');
                }
            }

            if (isMoving) {
                const cadence = 9.5 + runRatio * 6.5;
                player.walkCycle += dt * cadence;
            }

            const strideWave = Math.sin(player.walkCycle);
            const bounceWave = Math.abs(Math.cos(player.walkCycle));

            let targetPivotY = 0;
            let targetPitchX = 0;
            let targetRollZ = 0;

            if (!player.onGround) {
                const airTilt = THREE.MathUtils.clamp(-player.vel.y * 0.014, -0.24, 0.22);
                targetPitchX = airTilt;
                targetPivotY = player.vel.y > 0 ? 0.14 : 0.04;
            } else {
                const hopHeight = (0.07 + runRatio * 0.11) * bounceWave * player.animBlend;
                const leanForward = -(0.06 + runRatio * 0.14) * player.animBlend;
                targetPivotY = hopHeight;
                targetPitchX = leanForward;
                targetRollZ = strideWave * (0.03 + runRatio * 0.04) * player.animBlend;
            }

            player.visualPivot.position.y = THREE.MathUtils.lerp(
                player.visualPivot.position.y,
                targetPivotY,
                Math.min(1, dt * 16)
            );
            player.visualPivot.rotation.x = THREE.MathUtils.lerp(
                player.visualPivot.rotation.x,
                targetPitchX,
                Math.min(1, dt * 14)
            );
            player.visualPivot.rotation.z = THREE.MathUtils.lerp(
                player.visualPivot.rotation.z,
                targetRollZ,
                Math.min(1, dt * 14)
            );

            if (!player.hasCustomModel && player.leftLeg && player.rightLeg && player.leftArm && player.rightArm) {
                if (!player.onGround) {
                    player.leftLeg.rotation.x = THREE.MathUtils.lerp(player.leftLeg.rotation.x, 0.45, Math.min(1, dt * 14));
                    player.rightLeg.rotation.x = THREE.MathUtils.lerp(player.rightLeg.rotation.x, -0.35, Math.min(1, dt * 14));
                    player.leftArm.rotation.x = THREE.MathUtils.lerp(player.leftArm.rotation.x, -0.65, Math.min(1, dt * 14));
                    player.rightArm.rotation.x = THREE.MathUtils.lerp(player.rightArm.rotation.x, -0.65, Math.min(1, dt * 14));
                } else if (isMoving) {
                    const swingAmp = 0.55 + runRatio * 0.45;
                    const swing = strideWave * swingAmp;
                    player.leftLeg.rotation.x = swing;
                    player.rightLeg.rotation.x = -swing;
                    player.leftArm.rotation.x = -swing * 0.75;
                    player.rightArm.rotation.x = swing * 0.75;
                } else {
                    player.leftLeg.rotation.x = THREE.MathUtils.lerp(player.leftLeg.rotation.x, 0, Math.min(1, dt * 12));
                    player.rightLeg.rotation.x = THREE.MathUtils.lerp(player.rightLeg.rotation.x, 0, Math.min(1, dt * 12));
                    player.leftArm.rotation.x = THREE.MathUtils.lerp(player.leftArm.rotation.x, 0, Math.min(1, dt * 12));
                    player.rightArm.rotation.x = THREE.MathUtils.lerp(player.rightArm.rotation.x, 0, Math.min(1, dt * 12));
                }
            }
        }

        // ==========================================
        // SIMULACIÓN DEL MUNDO, JUGADOR Y CÁMARA
        // ==========================================
        function updateWorld(dt, elapsed) {
            for (const c of coins) {
                if (c.collected) continue;
                c.mesh.rotation.z += 2.6 * dt;
                c.mesh.position.y = c.y + Math.sin(elapsed * 3.5 + c.x) * 0.2;
            }

            for (const en of aerialEnemies) {
                if (!en.alive) {
                    en.respawnTimer -= dt;
                    if (en.respawnTimer <= 0) {
                        en.alive = true;
                        en.hp = en.kind === 'dragon' ? 2 : 1;
                        en.group.visible = true;
                    }
                    continue;
                }

                const t = elapsed * en.speed + en.phase;
                const nextX = en.baseX + Math.cos(t) * en.patrolRadius;
                const diveY = en.kind === 'eagle' ? Math.sin(t * 2) * 1.15 : Math.sin(t * 1.5) * 0.55;
                const nextY = en.baseY + diveY;
                const nextZ = en.baseZ + Math.sin(t) * (en.patrolRadius * 0.55);

                en.group.lookAt(nextX, nextY, nextZ);
                en.group.position.set(nextX, nextY, nextZ);

                const flap = Math.sin(elapsed * 14 + en.phase) * 0.65;
                en.leftWing.rotation.z = flap;
                en.rightWing.rotation.z = -flap;

                if (en.kind === 'dragon' && state.mode === 'playing') {
                    const distToPlayer = en.group.position.distanceTo(player.pos);
                    if (distToPlayer < 26) {
                        en.fireCooldown -= dt;
                        if (en.fireCooldown <= 0) {
                            en.fireCooldown = 2.3;
                            spawnEnemyFireball(
                                en.group.position.clone(),
                                new THREE.Vector3(player.pos.x, player.pos.y + 1.0, player.pos.z)
                            );
                        }
                    }
                }
            }

            for (let i = playerShots.length - 1; i >= 0; i--) {
                const shot = playerShots[i];
                shot.life -= dt;
                shot.mesh.position.addScaledVector(shot.vel, dt);

                let hit = false;
                for (const en of aerialEnemies) {
                    if (!en.alive) continue;
                    if (shot.mesh.position.distanceTo(en.group.position) < 1.55) {
                        en.hp -= 1;
                        hit = true;
                        if (en.hp <= 0) {
                            en.alive = false;
                            en.group.visible = false;
                            en.respawnTimer = 6.5;
                            state.coins += 2;
                            saveState();
                            updateHud();
                            sfxEnemyDown();
                            showToast(en.kind === 'dragon' ? '🐉 ¡Dragón derribado! +2 monedas' : '🦅 ¡Ave derribada! +2 monedas', 1400);
                        } else {
                            sfxShoot();
                        }
                        break;
                    }
                }

                if (hit || shot.life <= 0) {
                    entitiesGroup.remove(shot.mesh);
                    playerShots.splice(i, 1);
                }
            }

            for (let i = enemyFireballs.length - 1; i >= 0; i--) {
                const ball = enemyFireballs[i];
                ball.life -= dt;
                ball.mesh.position.addScaledVector(ball.vel, dt);

                if (state.mode === 'playing') {
                    const pCenter = new THREE.Vector3(player.pos.x, player.pos.y + 0.95, player.pos.z);
                    if (ball.mesh.position.distanceTo(pCenter) < 1.05) {
                        entitiesGroup.remove(ball.mesh);
                        enemyFireballs.splice(i, 1);
                        respawnPlayer(true);
                        continue;
                    }
                }

                if (ball.life <= 0) {
                    entitiesGroup.remove(ball.mesh);
                    enemyFireballs.splice(i, 1);
                }
            }
        }

        function updatePlayer(dt, elapsed) {
            if (!player.root) return;

            if (player.mixer) {
                player.mixer.update(dt);
            }

            if (state.mode !== 'playing') {
                player.root.position.copy(player.pos);
                player.root.rotation.y = elapsed * 0.45;
                updateProceduralMovementAnimation(dt, 0);
                return;
            }

            let moveX = input.joyActive ? input.joyVecX : 0;
            let moveZ = input.joyActive ? input.joyVecY : 0;

            if (input.keys['KeyA'] || input.keys['ArrowLeft']) moveX -= 1;
            if (input.keys['KeyD'] || input.keys['ArrowRight']) moveX += 1;
            if (input.keys['KeyW'] || input.keys['ArrowUp']) moveZ -= 1;
            if (input.keys['KeyS'] || input.keys['ArrowDown']) moveZ += 1;

            const len = Math.hypot(moveX, moveZ);
            if (len > 1) {
                moveX /= len;
                moveZ /= len;
            }

            const forward = new THREE.Vector3(-Math.sin(camCtrl.yaw), 0, -Math.cos(camCtrl.yaw));
            const right = new THREE.Vector3(Math.cos(camCtrl.yaw), 0, -Math.sin(camCtrl.yaw));

            const wishDir = new THREE.Vector3()
                .addScaledVector(right, moveX)
                .addScaledVector(forward, -moveZ);

            const moveSpeed = 8.2;
            player.vel.x = wishDir.x * moveSpeed;
            player.vel.z = wishDir.z * moveSpeed;
            player.vel.y -= 24.0 * dt;

            const prevY = player.pos.y;
            const nextX = player.pos.x + player.vel.x * dt;
            const nextZ = player.pos.z + player.vel.z * dt;
            const nextY = player.pos.y + player.vel.y * dt;

            if (wishDir.lengthSq() > 0.001) {
                const targetYaw = Math.atan2(-wishDir.x, -wishDir.z);
                player.yaw = targetYaw;
                player.root.rotation.y = targetYaw;

                if (mapLoaded && mapMeshes.length > 0 && wishDir.lengthSq() > 0.01) {
                    const wallRay = new THREE.Raycaster(
                        new THREE.Vector3(player.pos.x, player.pos.y + 1.45, player.pos.z),
                        wishDir.clone().normalize()
                    );
                    wallRay.far = 0.45;
                    const wallHits = wallRay.intersectObjects(mapMeshes, true);
                    const blockingWall = wallHits.find(h => Math.abs(h.face.normal.y) < 0.08);
                    if (!blockingWall) {
                        player.pos.x = nextX;
                        player.pos.z = nextZ;
                    }
                } else {
                    player.pos.x = nextX;
                    player.pos.z = nextZ;
                }
            }

            player.pos.y = nextY;
            player.onGround = false;

            if (mapLoaded && mapMeshes.length > 0 && player.vel.y <= 1.5) {
                const sampleOffsets = [
                    [0, 0],
                    [-0.45, -0.45],
                    [0.45, -0.45],
                    [-0.45, 0.45],
                    [0.45, 0.45]
                ];
                let bestFloorY = null;
                for (const [ox, oz] of sampleOffsets) {
                    const rayStartY = prevY + 1.6;
                    raycaster.set(
                        new THREE.Vector3(player.pos.x + ox, rayStartY, player.pos.z + oz),
                        downDir
                    );
                    raycaster.far = Math.max(1.8, (rayStartY - player.pos.y) + 0.8);
                    const hits = raycaster.intersectObjects(mapMeshes, true);
                    for (const h of hits) {
                        if (h.point.y <= prevY + 1.1) {
                            if (bestFloorY === null || h.point.y > bestFloorY) {
                                bestFloorY = h.point.y;
                            }
                        }
                    }
                }

                if (bestFloorY !== null && player.pos.y <= bestFloorY + 0.25) {
                    player.pos.y = bestFloorY;
                    player.vel.y = 0;
                    player.onGround = true;
                    player.jumpsUsed = 0;
                }
            }

            if (player.pos.y <= lavaFloorY + 0.45) {
                respawnPlayer(true);
                return;
            }

            for (const en of aerialEnemies) {
                if (!en.alive) continue;
                const pCenter = new THREE.Vector3(player.pos.x, player.pos.y + 0.95, player.pos.z);
                if (pCenter.distanceTo(en.group.position) < 1.35) {
                    respawnPlayer(true);
                    return;
                }
            }

            for (const cp of checkpoints) {
                if (cp.activated) continue;
                if (player.pos.distanceTo(new THREE.Vector3(cp.x, cp.y, cp.z)) < 2.8) {
                    cp.activated = true;
                    currentSpawn.set(cp.x, cp.y + 0.25, cp.z);
                    cp.pad.material.color.setHex(0xfacc15);
                    if (cp.stageNum > state.currentLevel) {
                        state.currentLevel = cp.stageNum;
                        if (cp.stageNum > state.maxUnlockedLevel) {
                            state.maxUnlockedLevel = cp.stageNum;
                        }
                        saveState();
                        updateHud();
                    }
                    sfxCheckpoint();
                    showToast(`¡Checkpoint Etapa ${cp.stageNum}!`, 1400);
                }
            }

            for (const c of coins) {
                if (c.collected) continue;
                if (player.pos.distanceTo(new THREE.Vector3(c.x, c.y, c.z)) < 1.75) {
                    c.collected = true;
                    c.mesh.visible = false;
                    state.coins += 1;
                    saveState();
                    updateHud();
                    sfxCoin();
                }
            }

            const horizSpeed = Math.hypot(player.vel.x, player.vel.z);
            updateProceduralMovementAnimation(dt, horizSpeed);

            if (player.customModel && player.baseScale) {
                player.customModel.visible = true;
                player.customModel.scale.setScalar(player.baseScale);
            }

            player.root.position.copy(player.pos);
        }

        function updateCamera() {
            if (!camera) return;
            const target = new THREE.Vector3(player.pos.x, player.pos.y + 2.1, player.pos.z);
            const desiredPos = computeCameraDesiredPos(target);
            camera.position.lerp(desiredPos, 0.16);
            camera.lookAt(target);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            updateLavaSplashes(dt);
            updateWorld(dt, elapsed);
            updatePlayer(dt, elapsed);
            updateCamera();

            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => {
            loadState();
            initThree();
            bindControls();
            updateHud();
            animate();
        });
    </script>
</body>
