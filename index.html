<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obby 3D Estilo Roblox — Aventura Aérea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
            background: #1d4ed8;
        }
        .roblox-title {
            font-family: 'Fredoka', 'Inter', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .roblox-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
            box-shadow: 0 4px 0 rgba(15, 23, 42, 0.35);
        }
        .roblox-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.35);
        }
        #dynamic-joy-base {
            position: fixed;
            width: 112px;
            height: 112px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.16);
            border: 2px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 25;
        }
        #dynamic-joy-knob {
            position: absolute;
            width: 48px;
            height: 48px;
            left: 50%;
            top: 50%;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.35);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- Joystick dinámico invisible hasta que se toca el lado izquierdo -->
    <div id="dynamic-joy-base">
        <div id="dynamic-joy-knob"></div>
    </div>

    <!-- Banner de notificación -->
    <div id="toast-banner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200">
        <div id="toast-text" class="bg-slate-950/90 text-amber-300 border border-amber-400/40 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold shadow-xl"></div>
    </div>

    <!-- Pantalla de Inicio / Lobby estilo Roblox -->
    <div id="lobby-screen" class="fixed inset-0 z-30 flex items-center justify-center p-4 bg-gradient-to-b from-sky-500/75 via-blue-700/75 to-slate-950/85 backdrop-blur-sm">
        <div class="w-full max-w-md bg-slate-900/90 border-2 border-white/20 rounded-3xl p-6 text-white shadow-2xl text-center">
            <div class="inline-block bg-amber-400 text-slate-950 font-black text-xs px-3 py-1 rounded-full mb-2">
                OBBY 3D • AVENTURA AÉREA
            </div>
            <h1 class="roblox-title text-3xl sm:text-4xl font-bold tracking-tight mb-2">
                Obby Aéreo Roblox
            </h1>
            <p class="text-slate-300 text-xs sm:text-sm mb-5">
                Salta entre pisos, descansa en zonas seguras, esquiva la lava y derriba aves, águilas y dragones.
            </p>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Etapa Máxima</div>
                    <div id="lobby-max-level" class="text-lg font-black text-sky-300 mt-0.5">1 / 30</div>
                </div>
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Monedas</div>
                    <div id="lobby-coins" class="text-lg font-black text-amber-300 mt-0.5">0</div>
                </div>
            </div>

            <div class="flex flex-col gap-2.5">
                <button id="btn-play" class="roblox-btn w-full py-3.5 rounded-2xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-base tracking-wide">
                    ▶ JUGAR AHORA
                </button>
                <button id="btn-open-levels" class="roblox-btn w-full py-3 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-sm">
                    🗺️ Elegir Etapa (1 - 30)
                </button>
            </div>
        </div>
    </div>

    <!-- HUD Superior y Controles en Juego -->
    <div id="hud-layer" class="fixed inset-0 pointer-events-none z-20 hidden flex-col justify-between p-3 sm:p-5">
        <div class="flex items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
                <button id="btn-hud-lobby" class="roblox-btn bg-amber-400 hover:bg-amber-300 text-slate-900 px-3 py-2 rounded-2xl border-2 border-slate-900/20 text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                    <span>🏠</span>
                    <span>Inicio</span>
                </button>
                <button id="btn-hud-levels" class="roblox-btn bg-sky-400 hover:bg-sky-300 text-slate-950 px-3 py-2 rounded-2xl border-2 border-slate-900/20 text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                    <span>🗺️</span>
                    <span>Etapas</span>
                </button>
            </div>

            <!-- Barra central estilo Roblox (1/30) -->
            <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto bg-indigo-950/65 backdrop-blur-md px-2.5 py-1.5 rounded-full border border-indigo-300/35 shadow-lg">
                <button id="btn-stage-first" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Primera etapa">«</button>
                <button id="btn-stage-prev" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Etapa anterior">‹</button>
                <div class="px-2.5 sm:px-3.5 py-0.5 rounded-full bg-indigo-600/90 border border-indigo-200/40 text-white font-black text-xs sm:text-sm tracking-wide">
                    <span id="hud-level-text" class="text-amber-300">1</span><span class="text-indigo-200/80">/30</span>
                </div>
                <button id="btn-stage-next" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Siguiente etapa">›</button>
                <button id="btn-stage-max" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Etapa máxima desbloqueada">»</button>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <div class="bg-slate-900/80 text-amber-300 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl border border-amber-400/40 font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                    <span>🪙</span>
                    <span id="hud-coins-text">0</span>
                </div>
                <button id="btn-hud-sound" class="roblox-btn bg-slate-800/85 hover:bg-slate-700 text-white p-2.5 rounded-2xl border border-white/20 text-sm font-bold" title="Sonido">
                    🔊
                </button>
            </div>
        </div>

        <!-- Zona inferior: botón de disparar cómodo en esquina inferior derecha -->
        <div class="flex items-end justify-between gap-3">
            <div class="hidden sm:block pointer-events-none">
                <span class="inline-block bg-slate-900/60 text-white/95 text-xs px-3.5 py-1 rounded-full backdrop-blur-sm">
                    Izquierda: mover • Derecha: saltar / cámara • Disparar (F)
                </span>
            </div>
            <div class="ml-auto mb-4 mr-2 sm:mb-6 sm:mr-5 pointer-events-auto flex items-center gap-2.5">
                <button id="btn-hud-shoot" class="roblox-btn w-16 h-16 sm:w-18 sm:h-18 rounded-full bg-rose-500 hover:bg-rose-400 text-white border-2 border-rose-200/70 font-black text-xs sm:text-sm flex flex-col items-center justify-center shadow-xl" title="Disparar (F)">
                    <span class="text-xl leading-none">⚡</span>
                    <span class="text-[10px] tracking-wide mt-0.5">FUEGO</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Selector de Etapas -->
    <div id="levels-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-slate-900 border-2 border-white/20 rounded-3xl p-5 sm:p-6 text-white shadow-2xl max-h-[82vh] flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="roblox-title text-xl sm:text-2xl font-bold">Seleccionar Etapa</h2>
                <button id="btn-close-levels" class="roblox-btn bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold">
                    ✕ Cerrar
                </button>
            </div>
            <div id="levels-grid" class="grid grid-cols-5 gap-2 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE PERSONAJE 3D (GLB / FBX)
        // ==========================================
        // Cambia esta ruta por la de tu modelo en GitHub (ej. './assets/personaje.glb' o './assets/personaje.fbx')
        const CHARACTER_MODEL_URL = './assets/personaje.glb';
        const CHARACTER_SCALE = 1.15;

        // ==========================================
        // CONFIGURACIÓN Y ESTADO PERSISTENTE
        // ==========================================
        const TOTAL_LEVELS = 30;
        const STORAGE_KEY = 'obby_roblox_aereo_v1';

        const state = {
            mode: 'lobby',
            currentLevel: 1,
            maxUnlockedLevel: 1,
            coins: 0,
            soundEnabled: true
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (typeof parsed.currentLevel === 'number') {
                    state.currentLevel = Math.max(1, Math.min(TOTAL_LEVELS, parsed.currentLevel));
                }
                if (typeof parsed.maxUnlockedLevel === 'number') {
                    state.maxUnlockedLevel = Math.max(1, Math.min(TOTAL_LEVELS, parsed.maxUnlockedLevel));
                }
                if (typeof parsed.coins === 'number') {
                    state.coins = Math.max(0, Math.floor(parsed.coins));
                }
                if (typeof parsed.soundEnabled === 'boolean') {
                    state.soundEnabled = parsed.soundEnabled;
                }
            } catch (err) {
                console.warn('Error cargando progreso:', err);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    currentLevel: state.currentLevel,
                    maxUnlockedLevel: state.maxUnlockedLevel,
                    coins: state.coins,
                    soundEnabled: state.soundEnabled
                }));
            } catch (err) {
                console.warn('Error guardando progreso:', err);
            }
        }

        // ==========================================
        // AUDIO PROCEDURAL + MÚSICA DE SUSPENSO
        // ==========================================
        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;

        function ensureAudioContext() {
            if (!state.soundEnabled) return null;
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.08, slideToFreq = null) {
            const ctx = ensureAudioContext();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideToFreq) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideToFreq), now + duration);
                }
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (err) {
                // Ignorar errores de audio en navegadores restringidos
            }
        }

        function sfxJump() { playTone(310, 0.14, 'square', 0.06, 620); }
        function sfxCoin() {
            playTone(880, 0.08, 'sine', 0.08, 1174.66);
            setTimeout(() => playTone(1318.5, 0.12, 'sine', 0.07), 65);
        }
        function sfxCheckpoint() {
            playTone(523.25, 0.09, 'triangle', 0.09, 659.25);
            setTimeout(() => playTone(783.99, 0.14, 'triangle', 0.09, 1046.5), 75);
        }
        function sfxShoot() { playTone(780, 0.08, 'square', 0.065, 240); }
        function sfxEnemyDown() {
            playTone(320, 0.12, 'sawtooth', 0.085, 110);
            setTimeout(() => playTone(660, 0.1, 'triangle', 0.07, 940), 60);
        }
        function sfxPortal() {
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((n, idx) => {
                setTimeout(() => playTone(n, 0.16, 'triangle', 0.085), idx * 75);
            });
        }
        function sfxFail() { playTone(220, 0.25, 'sawtooth', 0.08, 95); }

        function startSuspenseMusic() {
            stopSuspenseMusic();
            if (!state.soundEnabled) return;
            ensureAudioContext();
            const bassNotes = [110, 110, 130.81, 123.47, 110, 110, 146.83, 138.59];
            const tensionLead = [440, 0, 466.16, 440, 392, 0, 349.23, 369.99];

            bgmTimer = setInterval(() => {
                if (!state.soundEnabled || state.mode !== 'playing') return;
                const idx = bgmStep % bassNotes.length;
                playTone(bassNotes[idx], 0.13, 'triangle', 0.045);
                if (tensionLead[idx] > 0) {
                    playTone(tensionLead[idx], 0.11, 'sawtooth', 0.025);
                }
                if (bgmStep % 2 === 0) {
                    playTone(1250, 0.025, 'sine', 0.018);
                }
                bgmStep += 1;
            }, 230);
        }

        function stopSuspenseMusic() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        // ==========================================
        // INTERFAZ (HUD, LOBBY, NIVELES, TOAST)
        // ==========================================
        let toastTimeout = null;
        function showToast(msg, duration = 1800) {
            const banner = document.getElementById('toast-banner');
            const textEl = document.getElementById('toast-text');
            if (!banner || !textEl) return;
            textEl.textContent = msg;
            banner.classList.remove('opacity-0');
            banner.classList.add('opacity-100');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                banner.classList.remove('opacity-100');
                banner.classList.add('opacity-0');
            }, duration);
        }

        function updateHud() {
            document.getElementById('hud-level-text').textContent = String(state.currentLevel);
            document.getElementById('hud-coins-text').textContent = String(state.coins);
            document.getElementById('lobby-max-level').textContent = `${state.maxUnlockedLevel} / ${TOTAL_LEVELS}`;
            document.getElementById('lobby-coins').textContent = String(state.coins);
            const soundBtn = document.getElementById('btn-hud-sound');
            if (soundBtn) {
                soundBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
            }
        }

        function setMode(newMode) {
            state.mode = newMode;
            const lobbyEl = document.getElementById('lobby-screen');
            const hudEl = document.getElementById('hud-layer');
            const joyEl = document.getElementById('dynamic-joy-base');

            if (newMode === 'playing') {
                lobbyEl.classList.add('hidden');
                hudEl.classList.remove('hidden');
                hudEl.classList.add('flex');
                startSuspenseMusic();
            } else {
                lobbyEl.classList.remove('hidden');
                hudEl.classList.add('hidden');
                hudEl.classList.remove('flex');
                if (joyEl) joyEl.style.display = 'none';
                stopSuspenseMusic();
            }
            updateHud();
        }

        function openLevelsModal() {
            const modal = document.getElementById('levels-modal');
            const grid = document.getElementById('levels-grid');
            if (!modal || !grid) return;
            grid.innerHTML = '';

            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const unlocked = i <= state.maxUnlockedLevel;
                const isCurrent = i === state.currentLevel;
                const btn = document.createElement('button');
                btn.className = `roblox-btn py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border ${
                    !unlocked
                        ? 'bg-slate-800/50 text-slate-500 border-white/5 cursor-not-allowed'
                        : isCurrent
                            ? 'bg-amber-400 text-slate-950 border-amber-200'
                            : 'bg-sky-500/90 hover:bg-sky-400 text-slate-950 border-white/20'
                }`;
                btn.textContent = unlocked ? `${i}` : `🔒${i}`;
                btn.disabled = !unlocked;
                btn.addEventListener('click', () => {
                    if (!unlocked) return;
                    state.currentLevel = i;
                    saveState();
                    buildLevel(i);
                    closeLevelsModal();
                    setMode('playing');
                    showToast(`Etapa ${i} cargada`);
                });
                grid.appendChild(btn);
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLevelsModal() {
            const modal = document.getElementById('levels-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ==========================================
        // ESCENA THREE.JS, TEXTURAS Y MUNDO ABIERTO
        // ==========================================
        let scene, camera, renderer, clock;
        let levelGroup, sceneryGroup;
        let lavaSeaMesh, lavaSeaMat;
        let portalMesh = null, portalPos = null;
        let currentSpawn = new THREE.Vector3(0, 2, 0);

        const platforms = [];
        const ladders = [];
        const lavaZones = [];
        const coins = [];
        const spinners = [];
        const checkpoints = [];
        const lavaSplashes = [];
        const aerialEnemies = [];
        const playerShots = [];
        const enemyFireballs = [];
        const studTextureCache = new Map();

        const player = {
            root: null,
            fallbackGroup: null,
            leftLeg: null,
            rightLeg: null,
            leftArm: null,
            rightArm: null,
            pos: new THREE.Vector3(0, 2, 0),
            vel: new THREE.Vector3(0, 0, 0),
            yaw: 0,
            onGround: false,
            jumpsUsed: 0,
            maxJumps: 2,
            walkCycle: 0,
            usingExternalModel: false
        };

        let playerMixer = null;
        let animIdle = null, animRun = null, animJump = null;
        let currentAnimAction = null;

        const camCtrl = {
            yaw: 0,
            pitch: 0.34,
            distance: 11.5
        };

        function getStuddedMaterial(hexColor, roughness = 0.55) {
            const key = `${hexColor}_${roughness}`;
            let tex = studTextureCache.get(key);
            if (!tex) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const base = new THREE.Color(hexColor);
                const r = Math.round(base.r * 255);
                const g = Math.round(base.g * 255);
                const b = Math.round(base.b * 255);

                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(0, 0, 128, 128);

                ctx.strokeStyle = 'rgba(15, 23, 42, 0.22)';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, 124, 124);

                const coords = [32, 96];
                for (const cx of coords) {
                    for (const cy of coords) {
                        ctx.beginPath();
                        ctx.arc(cx, cy, 13, 0, Math.PI * 2);
                        ctx.fillStyle = `rgb(${Math.min(255, r + 28)},${Math.min(255, g + 28)},${Math.min(255, b + 28)})`;
                        ctx.fill();
                        ctx.lineWidth = 2.5;
                        ctx.strokeStyle = 'rgba(15, 23, 42, 0.28)';
                        ctx.stroke();
                    }
                }

                tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.encoding = THREE.sRGBEncoding;
                studTextureCache.set(key, tex);
            }

            const mat = new THREE.MeshStandardMaterial({
                map: tex.clone(),
                roughness,
                metalness: 0.08
            });
            mat.map.needsUpdate = true;
            return mat;
        }

        function createLiquidLavaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, '#ea580c');
            grad.addColorStop(0.5, '#f97316');
            grad.addColorStop(1, '#dc2626');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                const yBase = (i / 18) * 256;
                for (let x = 0; x <= 256; x += 16) {
                    const y = yBase + Math.sin((x / 256) * Math.PI * 4 + i) * 9;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(254, 240, 138, 0.42)' : 'rgba(153, 27, 27, 0.45)';
                ctx.lineWidth = 6;
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(24, 24);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function buildOpenWorldScenery() {
            while (sceneryGroup.children.length > 0) {
                sceneryGroup.remove(sceneryGroup.children[0]);
            }

            const lavaTex = createLiquidLavaTexture();
            lavaSeaMat = new THREE.MeshStandardMaterial({
                map: lavaTex,
                emissive: new THREE.Color(0xea580c),
                emissiveMap: lavaTex,
                emissiveIntensity: 0.75,
                roughness: 0.2,
                metalness: 0.1
            });

            const seaGeo = new THREE.PlaneGeometry(360, 360, 48, 48);
            seaGeo.rotateX(-Math.PI / 2);
            lavaSeaMesh = new THREE.Mesh(seaGeo, lavaSeaMat);
            lavaSeaMesh.position.set(0, -14, -65);
            sceneryGroup.add(lavaSeaMesh);

            const islandPositions = [
                [-52, -9, -20, 22], [54, -8, -32, 24], [-64, -7, -75, 28],
                [62, -6, -85, 26], [0, -10, -125, 34], [-45, -8, -145, 24]
            ];

            islandPositions.forEach(([ix, iy, iz, radius], idx) => {
                const island = new THREE.Group();
                island.position.set(ix, iy, iz);

                const dirt = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius * 0.65, 10, 8),
                    getStuddedMaterial(0x78350f, 0.8)
                );
                dirt.position.y = -5;
                island.add(dirt);

                const grass = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius * 1.03, radius, 2.2, 8),
                    getStuddedMaterial(idx % 2 === 0 ? 0x22c55e : 0x16a34a, 0.65)
                );
                grass.position.y = 0.8;
                island.add(grass);

                for (let t = 0; t < 4; t++) {
                    const ang = (t / 4) * Math.PI * 2 + idx;
                    const tx = Math.cos(ang) * (radius * 0.48);
                    const tz = Math.sin(ang) * (radius * 0.48);
                    const trunk = new THREE.Mesh(
                        new THREE.BoxGeometry(1.4, 3.6, 1.4),
                        getStuddedMaterial(0x713f12, 0.75)
                    );
                    trunk.position.set(tx, 3.6, tz);
                    island.add(trunk);

                    const crown = new THREE.Mesh(
                        new THREE.BoxGeometry(4.4, 4.2, 4.4),
                        getStuddedMaterial(0x15803d, 0.6)
                    );
                    crown.position.set(tx, 7.2, tz);
                    island.add(crown);
                }

                sceneryGroup.add(island);
            });

            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
            for (let c = 0; c < 14; c++) {
                const cg = new THREE.Group();
                const cx = (Math.random() - 0.5) * 180;
                const cy = 22 + Math.random() * 14;
                const cz = -15 - Math.random() * 140;
                cg.position.set(cx, cy, cz);

                const p1 = new THREE.Mesh(new THREE.BoxGeometry(7, 2.2, 4.5), cloudMat);
                const p2 = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.8, 4), cloudMat);
                p2.position.set(1.5, 1.1, 0);
                cg.add(p1, p2);
                sceneryGroup.add(cg);
            }
        }

        function initLavaSplashPool() {
            const geo = new THREE.SphereGeometry(0.22, 8, 8);
            for (let i = 0; i < 42; i++) {
                const isSpark = i % 3 === 0;
                const mat = new THREE.MeshBasicMaterial({
                    color: isSpark ? 0xfef08a : 0xf97316
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.visible = false;
                sceneryGroup.add(mesh);
                lavaSplashes.push({
                    mesh,
                    active: false,
                    vel: new THREE.Vector3(),
                    life: 0
                });
            }
        }

        function spawnLavaSplashDroplet(x, y, z) {
            const slot = lavaSplashes.find(s => !s.active);
            if (!slot) return;
            slot.active = true;
            slot.mesh.visible = true;
            slot.mesh.position.set(x, y, z);
            slot.vel.set(
                (Math.random() - 0.5) * 4.5,
                5.5 + Math.random() * 6.5,
                (Math.random() - 0.5) * 4.5
            );
            slot.life = 0.85 + Math.random() * 0.45;
        }

        function updateLavaSplashes(dt) {
            if (lavaSeaMat && lavaSeaMat.map) {
                lavaSeaMat.map.offset.x += dt * 0.055;
                lavaSeaMat.map.offset.y += dt * 0.04;
            }

            if (Math.random() < dt * 22 && player.pos) {
                const sx = player.pos.x + (Math.random() - 0.5) * 34;
                const sz = player.pos.z + (Math.random() - 0.5) * 34;
                spawnLavaSplashDroplet(sx, -13.6, sz);
            }

            for (const s of lavaSplashes) {
                if (!s.active) continue;
                s.life -= dt;
                s.vel.y -= 16.5 * dt;
                s.mesh.position.addScaledVector(s.vel, dt);
                if (s.life <= 0 || s.mesh.position.y < -14.5) {
                    s.active = false;
                    s.mesh.visible = false;
                }
            }
        }

        function playPlayerAnim(action) {
            if (!action || action === currentAnimAction) return;
            action.reset().fadeIn(0.15).play();
            if (currentAnimAction) currentAnimAction.fadeOut(0.15);
            currentAnimAction = action;
        }

        function attachExternalCharacter(model, animations = []) {
            if (!player.root || !model) return;
            if (player.fallbackGroup) {
                player.fallbackGroup.visible = false;
            }

            model.scale.set(CHARACTER_SCALE, CHARACTER_SCALE, CHARACTER_SCALE);
            model.position.set(0, 0, 0);
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            player.root.add(model);
            player.usingExternalModel = true;

            if (animations && animations.length > 0) {
                playerMixer = new THREE.AnimationMixer(model);
                animIdle = playerMixer.clipAction(animations[0]);
                animRun = animations[1] ? playerMixer.clipAction(animations[1]) : animIdle;
                animJump = animations[2] ? playerMixer.clipAction(animations[2]) : animRun;
                animIdle.play();
                currentAnimAction = animIdle;
            }
        }

        function loadExternalCharacterIfConfigured() {
            if (!CHARACTER_MODEL_URL) return;
            const isFbx = CHARACTER_MODEL_URL.toLowerCase().endsWith('.fbx');

            if (isFbx && typeof THREE.FBXLoader === 'function') {
                const fbxLoader = new THREE.FBXLoader();
                fbxLoader.load(
                    CHARACTER_MODEL_URL,
                    (fbx) => attachExternalCharacter(fbx, fbx.animations || []),
                    undefined,
                    () => {}
                );
            } else if (typeof THREE.GLTFLoader === 'function') {
                const gltfLoader = new THREE.GLTFLoader();
                gltfLoader.load(
                    CHARACTER_MODEL_URL,
                    (gltf) => attachExternalCharacter(gltf.scene, gltf.animations || []),
                    undefined,
                    () => {}
                );
            }
        }

            leftLeg.position.set(-0.28, 0.52, 0);

            rightLeg.position.set(0.28, 0.52, 0);

        function initThree() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x38bdf8);
            scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0042);

            camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 450);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;

            clock = new THREE.Clock();

            const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.95);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.05);
            dirLight.position.set(28, 45, 22);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

        function clearLevel() {
            while (levelGroup.children.length > 0) {
                levelGroup.remove(levelGroup.children[0]);
            }
            platforms.length = 0;
            ladders.length = 0;
            lavaZones.length = 0;
            coins.length = 0;
            spinners.length = 0;
            checkpoints.length = 0;
            aerialEnemies.length = 0;
            playerShots.length = 0;
            enemyFireballs.length = 0;
            portalMesh = null;
            portalPos = null;
        }

        function addPlatform(x, y, z, w, h, d, colorHex = 0xe2e8f0) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                getStuddedMaterial(colorHex, 0.5)
            );
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            levelGroup.add(mesh);

            platforms.push({
                x, y, z, w, h, d,
                top: y + h / 2,
                bottom: y - h / 2,
                minX: x - w / 2,
                maxX: x + w / 2,
                minZ: z - d / 2,
                maxZ: z + d / 2
            });
            return mesh;
        }

        function addSafeRestFloor(x, y, z, w = 16, d = 14, colorHex = 0x38bdf8) {
            addPlatform(x, y, z, w, 1.4, d, colorHex);
            const railMat = getStuddedMaterial(0xf8fafc, 0.4);
            const frontRail = new THREE.Mesh(new THREE.BoxGeometry(w, 0.35, 0.35), railMat);
            frontRail.position.set(x, y + 0.85, z + d / 2 - 0.2);
            levelGroup.add(frontRail);
        }

        function addLavaBlock(x, y, z, w, d) {
            const mat = new THREE.MeshStandardMaterial({
                color: 0xff4500,
                emissive: 0xea580c,
                emissiveIntensity: 0.7,
                roughness: 0.25
            });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.55, d), mat);
            mesh.position.set(x, y, z);
            levelGroup.add(mesh);

            lavaZones.push({
                x, y, z,
                halfW: w / 2,
                halfD: d / 2,
                top: y + 0.35
            });
        }

        function addSpinner(x, y, z, length = 7.5, speed = 1.6) {
            const pivot = new THREE.Group();
            pivot.position.set(x, y, z);

            const bar = new THREE.Mesh(
                new THREE.BoxGeometry(length, 0.55, 0.65),
                new THREE.MeshStandardMaterial({
                    color: 0xef4444,
                    emissive: 0xb91c1c,
                    emissiveIntensity: 0.45
                })
            );
            pivot.add(bar);
            levelGroup.add(pivot);

            spinners.push({ pivot, x, y, z, length, speed });
        }

        function addCoin(x, y, z) {
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.55, 0.55, 0.18, 16),

                    color: 0xfacc15,
                    emissive: 0xca8a04,

                })

            mesh.position.set(x, y, z);

        function addCheckpoint(x, y, z, label = 'CP') {

                    color: 0x22c55e,

                })
            );

            checkpoints.push({

        function addPortal(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y + 2.2, z);

            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(2.1, 0.26, 12, 28),

        function addAerialEnemy(kind, x, y, z, patrolRadius = 5.5, speed = 2.0) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const isDragon = kind === 'dragon';
            const bodyMat = new THREE.MeshStandardMaterial({
                color: isDragon ? 0x991b1b : 0x78350f,
                roughness: 0.45
            });
            const accentMat = new THREE.MeshStandardMaterial({
                color: isDragon ? 0xf97316 : 0xfef08a,
                emissive: isDragon ? 0xc2410c : 0x000000,
                emissiveIntensity: isDragon ? 0.35 : 0,
                roughness: 0.4
            });

            const body = new THREE.Mesh(
                new THREE.BoxGeometry(isDragon ? 1.25 : 0.85, isDragon ? 0.95 : 0.7, isDragon ? 2.15 : 1.3),
                bodyMat
            );
            body.castShadow = true;
            group.add(body);

            const head = new THREE.Mesh(
                new THREE.BoxGeometry(isDragon ? 0.85 : 0.65, isDragon ? 0.75 : 0.6, isDragon ? 0.95 : 0.75),
                isDragon ? accentMat : bodyMat
            );
            head.position.set(0, 0.35, isDragon ? -1.35 : -0.85);
            group.add(head);

            const leftWing = new THREE.Mesh(
                new THREE.BoxGeometry(isDragon ? 2.4 : 1.9, 0.18, isDragon ? 1.1 : 0.75),
                accentMat
            );
            leftWing.position.set(isDragon ? -1.5 : -1.2, 0.15, 0);
            group.add(leftWing);

            const rightWing = new THREE.Mesh(
                new THREE.BoxGeometry(isDragon ? 2.4 : 1.9, 0.18, isDragon ? 1.1 : 0.75),
                accentMat
            );
            rightWing.position.set(isDragon ? 1.5 : 1.2, 0.15, 0);
            group.add(rightWing);

            levelGroup.add(group);
            aerialEnemies.push({
                kind,
                group,
                leftWing,
                rightWing,
                baseX: x,
                baseY: y,
                baseZ: z,
                patrolRadius,
                speed,
                hp: isDragon ? 2 : 1,
                alive: true,
                respawnTimer: 0,
                fireCooldown: 1.4 + Math.random() * 1.2,
                phase: Math.random() * Math.PI * 2
            });
        }

        function spawnPlayerShot() {
            if (state.mode !== 'playing' || !player.pos) return;
            sfxShoot();

            const dir = new THREE.Vector3(
                -Math.sin(player.yaw),
                0.1,
                -Math.cos(player.yaw)
            ).normalize();

            let bestEnemy = null;
            let bestDist = 28;
            for (const en of aerialEnemies) {
                if (!en.alive) continue;
                const d = player.pos.distanceTo(en.group.position);
                if (d < bestDist) {
                    bestDist = d;
                    bestEnemy = en;
                }
            }
            if (bestEnemy) {
                dir.copy(bestEnemy.group.position)
                    .sub(new THREE.Vector3(player.pos.x, player.pos.y + 1.1, player.pos.z))
                    .normalize();
            }

            const shotMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.28, 0.28, 0.75),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
            );
            shotMesh.position.set(player.pos.x, player.pos.y + 1.1, player.pos.z);
            shotMesh.lookAt(shotMesh.position.clone().add(dir));
            levelGroup.add(shotMesh);

            playerShots.push({
                mesh: shotMesh,
                vel: dir.multiplyScalar(28),
                life: 1.15
            });
        }

        function spawnEnemyFireball(fromPos, targetPos) {
            const dir = targetPos.clone().sub(fromPos).normalize();
            const ball = new THREE.Mesh(
                new THREE.SphereGeometry(0.36, 10, 10),
                new THREE.MeshBasicMaterial({ color: 0xf97316 })
            );
            ball.position.copy(fromPos);
            levelGroup.add(ball);

            enemyFireballs.push({
                mesh: ball,
                vel: dir.multiplyScalar(11.5),
                life: 3.0
            });
        }

        function buildLevel(levelNum) {
            clearLevel();
            const palette = [0xe2e8f0, 0x60a5fa, 0x34d399, 0xfbbf24, 0xc084fc, 0xf87171];
            const mainColor = palette[(levelNum - 1) % palette.length];
            const speedScale = 1 + (levelNum - 1) * 0.035;

            addSafeRestFloor(0, 0, 0, 16, 15, 0xe2e8f0);
            currentSpawn.set(0, 1.2, 2);
            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;

            let curX = 0;
            let curY = 0;
            let curZ = -10;
            const obstacleCount = 6 + Math.floor(levelNum * 0.35);

            for (let i = 0; i < obstacleCount; i++) {
                const zig = Math.sin(i * 1.15 + levelNum) * 3.2;
                curX = zig;
                curY = Math.max(0, curY + (i % 3 === 0 ? 0.55 : -0.25));
                curZ -= 7.5;

                const platW = Math.max(7.2, 10.5 - levelNum * 0.08);
                const platD = Math.max(6.8, 9.2 - levelNum * 0.06);
                addPlatform(curX, curY, curZ, platW, 1.2, platD, mainColor);

                if (i % 2 === 1) {
                    addSpinner(curX, curY + 1.05, curZ, Math.min(8.5, platW * 0.85), 1.45 * speedScale);
                } else {
                    addLavaBlock(curX + (i % 4 === 0 ? 1.5 : -1.5), curY + 0.65, curZ, 2.2, 2.2);
                }

                addCoin(curX, curY + 1.8, curZ);

                if (i % 2 === 0 || levelNum >= 3) {
                    const useDragon = levelNum >= 4 && (i % 3 === 1 || levelNum >= 10);
                    const kind = useDragon ? 'dragon' : (i % 2 === 0 ? 'eagle' : 'bird');
                    addAerialEnemy(
                        kind,
                        curX,
                        curY + (useDragon ? 4.6 : 3.4),
                        curZ - 1.5,
                        useDragon ? 6.5 : 4.8,
                        (useDragon ? 1.75 : 2.2) * speedScale
                    );
                }

                if (i % 2 === 1 && i < obstacleCount - 1) {
                    curZ -= 8.2;
                    addSafeRestFloor(curX, curY, curZ, 15, 13, 0x38bdf8);
                    addCheckpoint(curX, curY, curZ, `CP ${i + 1}`);
                }
            }

            curZ -= 9.0;
            addSafeRestFloor(curX, curY, curZ, 16, 15, 0x22c55e);
            addPortal(curX, curY + 0.7, curZ - 2.5);
        }

        function respawnPlayer(byHazard = false) {
            if (byHazard) sfxFail();
            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;
            if (byHazard) {
                showToast('¡Cuidado! Regresaste al último punto seguro', 1400);
            }
        }

        // ==========================================
        // CONTROLES TÁCTILES INVISIBLES + TECLADO
        // ==========================================
        const input = {
            keys: {},
            joyActive: false,
            joyTouchId: null,
            joyOriginX: 0,
            joyOriginY: 0,
            joyVecX: 0,
            joyVecY: 0,
            camTouchId: null,
            camLastX: 0,
            camLastY: 0,
            camMoved: false
        };

        function updateDynamicJoystickVisual(visible, ox = 0, oy = 0, kx = 0, ky = 0) {
            const base = document.getElementById('dynamic-joy-base');
            const knob = document.getElementById('dynamic-joy-knob');
            if (!base || !knob) return;
            if (!visible) {
                base.style.display = 'none';
                return;
            }
            base.style.display = 'block';
            base.style.left = `${ox}px`;
            base.style.top = `${oy}px`;
            knob.style.left = `calc(50% + ${kx}px)`;
            knob.style.top = `calc(50% + ${ky}px)`;
        }

        function triggerJump() {
            if (state.mode !== 'playing') return;
            if (player.onGround || player.jumpsUsed < player.maxJumps) {
                player.vel.y = player.onGround ? 11.6 : 10.4;
                player.onGround = false;
                player.jumpsUsed += 1;
                sfxJump();
            }
        }

        function bindControls() {
            window.addEventListener('keydown', (e) => {
                input.keys[e.code] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    triggerJump();
                } else if (e.code === 'KeyF' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                    e.preventDefault();
                    spawnPlayerShot();
                }
            });

            window.addEventListener('keyup', (e) => {
                input.keys[e.code] = false;
            });

            const canvas = document.getElementById('game-canvas');
            const maxRadius = 42;

            canvas.addEventListener('touchstart', (e) => {
                if (state.mode !== 'playing') return;
                const halfW = window.innerWidth * 0.5;

                for (const t of e.changedTouches) {
                    if (t.clientX < halfW && !input.joyActive) {
                        input.joyActive = true;
                        input.joyTouchId = t.identifier;
                        input.joyOriginX = t.clientX;
                        input.joyOriginY = t.clientY;
                        input.joyVecX = 0;
                        input.joyVecY = 0;
                        updateDynamicJoystickVisual(true, t.clientX, t.clientY, 0, 0);
                    } else if (t.clientX >= halfW && input.camTouchId === null) {
                        input.camTouchId = t.identifier;
                        input.camLastX = t.clientX;
                        input.camLastY = t.clientY;
                        input.camMoved = false;
                    }
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (state.mode !== 'playing') return;
                for (const t of e.changedTouches) {
                    if (input.joyActive && t.identifier === input.joyTouchId) {
                        let dx = t.clientX - input.joyOriginX;
                        let dy = t.clientY - input.joyOriginY;
                        const dist = Math.hypot(dx, dy);
                        if (dist > maxRadius) {
                            dx = (dx / dist) * maxRadius;
                            dy = (dy / dist) * maxRadius;
                        }
                        input.joyVecX = dx / maxRadius;
                        input.joyVecY = dy / maxRadius;
                        updateDynamicJoystickVisual(true, input.joyOriginX, input.joyOriginY, dx, dy);
                    } else if (input.camTouchId === t.identifier) {
                        const dx = t.clientX - input.camLastX;
                        const dy = t.clientY - input.camLastY;
                        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                            input.camMoved = true;
                        }
                        camCtrl.yaw -= dx * 0.0065;
                        camCtrl.pitch = Math.max(0.12, Math.min(1.05, camCtrl.pitch + dy * 0.005));
                        input.camLastX = t.clientX;
                        input.camLastY = t.clientY;
                    }
                }
            }, { passive: true });

            const onTouchEnd = (e) => {
                for (const t of e.changedTouches) {
                    if (input.joyActive && t.identifier === input.joyTouchId) {
                        input.joyActive = false;
                        input.joyTouchId = null;
                        input.joyVecX = 0;
                        input.joyVecY = 0;
                        updateDynamicJoystickVisual(false);
                    } else if (input.camTouchId === t.identifier) {
                        if (!input.camMoved && state.mode === 'playing') {
                            triggerJump();
                        }
                        input.camTouchId = null;
                    }
                }
            };

            canvas.addEventListener('touchend', onTouchEnd, { passive: true });
            canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

            let mouseDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            canvas.addEventListener('mousedown', (e) => {
                mouseDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!mouseDragging || state.mode !== 'playing') return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                camCtrl.yaw -= dx * 0.0055;
                camCtrl.pitch = Math.max(0.12, Math.min(1.05, camCtrl.pitch + dy * 0.0045));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => {
                mouseDragging = false;
            });

            document.getElementById('btn-play')?.addEventListener('click', () => {
                ensureAudioContext();
                buildLevel(state.currentLevel);
                setMode('playing');
            });
            document.getElementById('btn-open-levels')?.addEventListener('click', openLevelsModal);
            document.getElementById('btn-close-levels')?.addEventListener('click', closeLevelsModal);
            document.getElementById('btn-hud-lobby')?.addEventListener('click', () => setMode('lobby'));
            document.getElementById('btn-hud-levels')?.addEventListener('click', openLevelsModal);
            document.getElementById('btn-hud-shoot')?.addEventListener('click', spawnPlayerShot);

            const jumpToStage = (targetLvl) => {
                const clamped = Math.max(1, Math.min(state.maxUnlockedLevel, targetLvl));
                if (clamped === state.currentLevel) return;
                state.currentLevel = clamped;
                saveState();
                buildLevel(clamped);
                updateHud();
                showToast(`Etapa ${clamped}`, 1100);
            };
            document.getElementById('btn-stage-first')?.addEventListener('click', () => jumpToStage(1));
            document.getElementById('btn-stage-prev')?.addEventListener('click', () => jumpToStage(state.currentLevel - 1));
            document.getElementById('btn-stage-next')?.addEventListener('click', () => jumpToStage(state.currentLevel + 1));
            document.getElementById('btn-stage-max')?.addEventListener('click', () => jumpToStage(state.maxUnlockedLevel));

            document.getElementById('btn-hud-sound')?.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                saveState();
                updateHud();
                if (state.soundEnabled && state.mode === 'playing') {
                    startSuspenseMusic();
                } else {
                    stopSuspenseMusic();
                }
            });
        }

        // ==========================================
        // SIMULACIÓN DEL MUNDO, JUGADOR Y CÁMARA
        // ==========================================
        function updateWorld(dt, elapsed) {
            for (const sp of spinners) {
                sp.pivot.rotation.y += sp.speed * dt;
            }

            for (const c of coins) {
                if (c.collected) continue;
                c.mesh.rotation.z += 2.6 * dt;
                c.mesh.position.y = c.y + Math.sin(elapsed * 3.5 + c.x) * 0.2;
            }

            if (portalMesh) {
                portalMesh.material.opacity = 0.62 + Math.sin(elapsed * 4.2) * 0.22;
            }

            for (const en of aerialEnemies) {
                if (!en.alive) {
                    en.respawnTimer -= dt;
                    if (en.respawnTimer <= 0) {
                        en.alive = true;
                        en.hp = en.kind === 'dragon' ? 2 : 1;
                        en.group.visible = true;
                    }
                    continue;
                }

                const t = elapsed * en.speed + en.phase;
                const nextX = en.baseX + Math.cos(t) * en.patrolRadius;
                const diveY = en.kind === 'eagle' ? Math.sin(t * 2) * 1.15 : Math.sin(t * 1.5) * 0.55;
                const nextY = en.baseY + diveY;
                const nextZ = en.baseZ + Math.sin(t) * (en.patrolRadius * 0.55);

                en.group.lookAt(nextX, nextY, nextZ);
                en.group.position.set(nextX, nextY, nextZ);

                const flap = Math.sin(elapsed * 14 + en.phase) * 0.65;
                en.leftWing.rotation.z = flap;
                en.rightWing.rotation.z = -flap;

                if (en.kind === 'dragon' && state.mode === 'playing') {
                    const distToPlayer = en.group.position.distanceTo(player.pos);
                    if (distToPlayer < 24) {
                        en.fireCooldown -= dt;
                        if (en.fireCooldown <= 0) {
                            en.fireCooldown = 2.3;
                            spawnEnemyFireball(
                                en.group.position.clone(),
                                new THREE.Vector3(player.pos.x, player.pos.y + 1.0, player.pos.z)
                            );
                        }
                    }
                }
            }

            for (let i = playerShots.length - 1; i >= 0; i--) {
                const shot = playerShots[i];
                shot.life -= dt;
                shot.mesh.position.addScaledVector(shot.vel, dt);

                let hit = false;
                for (const en of aerialEnemies) {
                    if (!en.alive) continue;
                    if (shot.mesh.position.distanceTo(en.group.position) < 1.55) {
                        en.hp -= 1;
                        hit = true;
                        if (en.hp <= 0) {
                            en.alive = false;
                            en.group.visible = false;
                            en.respawnTimer = 6.5;
                            state.coins += 2;
                            saveState();
                            updateHud();
                            sfxEnemyDown();
                            showToast(en.kind === 'dragon' ? '🐉 ¡Dragón derribado! +2 monedas' : '🦅 ¡Ave derribada! +2 monedas', 1400);
                        } else {
                            sfxShoot();
                        }
                        break;
                    }
                }

                if (hit || shot.life <= 0) {
                    levelGroup.remove(shot.mesh);
                    playerShots.splice(i, 1);
                }
            }

            for (let i = enemyFireballs.length - 1; i >= 0; i--) {
                const ball = enemyFireballs[i];
                ball.life -= dt;
                ball.mesh.position.addScaledVector(ball.vel, dt);

                if (state.mode === 'playing') {
                    const pCenter = new THREE.Vector3(player.pos.x, player.pos.y + 0.95, player.pos.z);
                    if (ball.mesh.position.distanceTo(pCenter) < 1.05) {
                        levelGroup.remove(ball.mesh);
                        enemyFireballs.splice(i, 1);
                        respawnPlayer(true);
                        continue;
                    }
                }

                if (ball.life <= 0) {
                    levelGroup.remove(ball.mesh);
                    enemyFireballs.splice(i, 1);
                }
            }
        }

        function updatePlayer(dt, elapsed) {
            if (!player.root) return;

            if (state.mode !== 'playing') {
                player.root.position.copy(player.pos);
                player.root.rotation.y = elapsed * 0.5;
                return;
            }

            let moveX = input.joyActive ? input.joyVecX : 0;
            let moveZ = input.joyActive ? input.joyVecY : 0;

            if (input.keys['KeyA'] || input.keys['ArrowLeft']) moveX -= 1;
            if (input.keys['KeyD'] || input.keys['ArrowRight']) moveX += 1;
            if (input.keys['KeyW'] || input.keys['ArrowUp']) moveZ -= 1;
            if (input.keys['KeyS'] || input.keys['ArrowDown']) moveZ += 1;

            const len = Math.hypot(moveX, moveZ);
            if (len > 1) {
                moveX /= len;
                moveZ /= len;
            }

            const forward = new THREE.Vector3(-Math.sin(camCtrl.yaw), 0, -Math.cos(camCtrl.yaw));
            const right = new THREE.Vector3(Math.cos(camCtrl.yaw), 0, -Math.sin(camCtrl.yaw));

            const wishDir = new THREE.Vector3()
                .addScaledVector(right, moveX)
                .addScaledVector(forward, -moveZ);

            const moveSpeed = 8.4;
            player.vel.x = wishDir.x * moveSpeed;
            player.vel.z = wishDir.z * moveSpeed;
            player.vel.y -= 26.5 * dt;

            const prevY = player.pos.y;
            player.pos.addScaledVector(player.vel, dt);

            if (wishDir.lengthSq() > 0.001) {
                const targetYaw = Math.atan2(-wishDir.x, -wishDir.z);
                player.yaw = targetYaw;
                player.root.rotation.y = targetYaw;
            }

            player.onGround = false;
            for (const p of platforms) {
                const withinXZ =
                    player.pos.x + 0.42 >= p.minX &&
                    player.pos.x - 0.42 <= p.maxX &&
                    player.pos.z + 0.42 >= p.minZ &&
                    player.pos.z - 0.42 <= p.maxZ;

                if (withinXZ && player.vel.y <= 0 && prevY >= p.top - 0.25 && player.pos.y <= p.top) {
                    player.pos.y = p.top;
                    player.vel.y = 0;
                    player.onGround = true;
                    player.jumpsUsed = 0;
                }
            }

            if (player.pos.y < -12.5) {
                respawnPlayer(true);
                return;
            }

            for (const lz of lavaZones) {
                if (
                    Math.abs(player.pos.x - lz.x) <= lz.halfW + 0.3 &&
                    Math.abs(player.pos.z - lz.z) <= lz.halfD + 0.3 &&
                    player.pos.y <= lz.top &&
                    player.pos.y >= lz.top - 1.1
                ) {
                    respawnPlayer(true);
                    return;
                }
            }

            for (const sp of spinners) {
                if (Math.abs(player.pos.y - sp.y) < 1.2) {
                    const angle = sp.pivot.rotation.y;
                    const cosA = Math.cos(-angle);
                    const sinA = Math.sin(-angle);
                    const relX = player.pos.x - sp.x;
                    const relZ = player.pos.z - sp.z;
                    const localX = relX * cosA - relZ * sinA;
                    const localZ = relX * sinA + relZ * cosA;
                    if (Math.abs(localX) <= sp.length / 2 + 0.25 && Math.abs(localZ) <= 0.48) {
                        respawnPlayer(true);
                        return;
                    }
                }
            }

            for (const en of aerialEnemies) {
                if (!en.alive) continue;
                const pCenter = new THREE.Vector3(player.pos.x, player.pos.y + 0.95, player.pos.z);
                if (pCenter.distanceTo(en.group.position) < 1.35) {
                    respawnPlayer(true);
                    return;
                }
            }

            for (const cp of checkpoints) {
                if (cp.activated) continue;
                if (player.pos.distanceTo(new THREE.Vector3(cp.x, cp.y, cp.z)) < 2.6) {
                    cp.activated = true;
                    currentSpawn.set(cp.x, cp.y + 0.4, cp.z);
                    cp.pad.material.color.setHex(0xfacc15);
                    sfxCheckpoint();
                    showToast(`¡${cp.label} activado!`, 1300);
                }
            }

            for (const c of coins) {
                if (c.collected) continue;
                if (player.pos.distanceTo(new THREE.Vector3(c.x, c.y, c.z)) < 1.65) {
                    c.collected = true;
                    c.mesh.visible = false;
                    state.coins += 1;
                    saveState();
                    updateHud();
                    sfxCoin();
                }
            }

            if (portalPos && player.pos.distanceTo(portalPos) < 2.6) {
                sfxPortal();
                if (state.currentLevel < TOTAL_LEVELS) {
                    const nextLvl = state.currentLevel + 1;
                    state.currentLevel = nextLvl;
                    if (nextLvl > state.maxUnlockedLevel) {
                        state.maxUnlockedLevel = nextLvl;
                    }
                    saveState();
                    updateHud();
                    buildLevel(nextLvl);
                    showToast(`¡Etapa superada! Pasaste a la Etapa ${nextLvl}`, 2000);
                } else {
                    showToast('🏆 ¡Completaste las 30 etapas del Obby Aéreo!', 2600);
                    state.currentLevel = 1;
                    saveState();
                    buildLevel(1);
                }
                return;
            }

            const horizSpeed = Math.hypot(player.vel.x, player.vel.z);
            if (!player.usingExternalModel) {
                if (player.onGround && horizSpeed > 0.6) {
                    player.walkCycle += dt * 11;
                    const swing = Math.sin(player.walkCycle) * 0.65;
                    player.leftLeg.rotation.x = swing;
                    player.rightLeg.rotation.x = -swing;
                    player.leftArm.rotation.x = -swing * 0.7;
                    player.rightArm.rotation.x = swing * 0.7;
                } else {
                    player.leftLeg.rotation.x = 0;
                    player.rightLeg.rotation.x = 0;
                    player.leftArm.rotation.x = player.onGround ? 0 : -0.45;
                    player.rightArm.rotation.x = player.onGround ? 0 : -0.45;
                }
            } else if (playerMixer) {
                playerMixer.update(dt);
                if (!player.onGround && animJump) {
                    playPlayerAnim(animJump);
                } else if (horizSpeed > 0.6 && animRun) {
                    playPlayerAnim(animRun);
                } else if (animIdle) {
                    playPlayerAnim(animIdle);
                }
            }

            player.root.position.copy(player.pos);
        }

        function updateCamera() {
            if (!camera) return;
            const target = new THREE.Vector3(player.pos.x, player.pos.y + 2.1, player.pos.z);
            const horizDist = Math.cos(camCtrl.pitch) * camCtrl.distance;
            const vertDist = Math.sin(camCtrl.pitch) * camCtrl.distance;

            const desiredPos = new THREE.Vector3(
                target.x + Math.sin(camCtrl.yaw) * horizDist,
                target.y + vertDist,
                target.z + Math.cos(camCtrl.yaw) * horizDist
            );

            camera.position.lerp(desiredPos, 0.14);
            camera.lookAt(target);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            updateLavaSplashes(dt);
            updateWorld(dt, elapsed);
            updatePlayer(dt, elapsed);
            updateCamera();

            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => {
            loadState();
            initThree();
            bindControls();
            buildLevel(state.currentLevel);
            updateHud();
            animate();
        });
    </script>
</body>
