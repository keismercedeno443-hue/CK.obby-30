        const input = {
            keys: {},
            joyActive: false,
            joyTouchId: null,
            joyOriginX: 0,
            joyOriginY: 0,
            joyVecX: 0,
            joyVecY: 0,
            camTouchId: null,
            camLastX: 0,
            camLastY: 0,
            camMoved: false,
            camStartTime: 0,
            pinchActive: false,
            pinchStartDist: 0,
            pinchStartCamDist: 8.2
        };

        function getTouchDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        function updateDynamicJoystickVisual(visible, ox = 0, oy = 0, kx = 0, ky = 0) {
            const base = document.getElementById('dynamic-joy-base');
            const knob = document.getElementById('dynamic-joy-knob');
            if (!base || !knob) return;
            if (!visible) {
                base.style.display = 'none';
                return;
            }
            base.style.display = 'block';
            base.style.left = `${ox}px`;
            base.style.top = `${oy}px`;
            knob.style.left = `calc(50% + ${kx}px)`;
            knob.style.top = `calc(50% + ${ky}px)`;
        }

        function triggerJump() {
            if (state.mode !== 'playing') return;
            if (player.onGround || player.jumpsUsed < player.maxJumps) {
                player.vel.y = player.onGround ? 12.6 : 11.2;
                player.onGround = false;
                player.jumpsUsed += 1;
                setPlayerAnimation('jump', true);
                sfxJump();
            }
        }

        function findTouchById(touchList, id) {
            if (id === null || id === undefined || !touchList) return null;
            for (let i = 0; i < touchList.length; i++) {
                if (touchList[i].identifier === id) return touchList[i];
            }
            return null;
        }

        function bindControls() {
            window.addEventListener('keydown', (e) => {
                input.keys[e.code] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    triggerJump();
                }
            });
            window.addEventListener('keyup', (e) => { input.keys[e.code] = false; });

            const canvas = document.getElementById('game-canvas');
            const maxRadius = 42;

            canvas.addEventListener('touchstart', (e) => {
                if (state.mode !== 'playing') return;

                const halfW = window.innerWidth * 0.5;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.clientX < halfW && !input.joyActive) {
                        input.joyActive = true;
                        input.joyTouchId = t.identifier;
                        input.joyOriginX = t.clientX;
                        input.joyOriginY = t.clientY;
                        input.joyVecX = 0;
                        input.joyVecY = 0;
                        updateDynamicJoystickVisual(true, t.clientX, t.clientY, 0, 0);
                    } else if (t.clientX >= halfW && input.camTouchId === null) {
                        input.camTouchId = t.identifier;
                        input.camLastX = t.clientX;
                        input.camLastY = t.clientY;
                        input.camMoved = false;
                        input.camStartTime = performance.now();
                    }
                }

                if (e.touches.length === 2 && !input.joyActive) {
                    input.pinchStartDist = Math.max(10, getTouchDistance(e.touches[0], e.touches[1]));
                    input.pinchStartCamDist = camCtrl.distance;
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (state.mode !== 'playing') return;

                if (input.joyActive && input.joyTouchId !== null) {
                    const jt = findTouchById(e.touches, input.joyTouchId);
                    if (jt) {
                        let dx = jt.clientX - input.joyOriginX;
                        let dy = jt.clientY - input.joyOriginY;
                        const dist = Math.hypot(dx, dy);
                        if (dist > maxRadius) {
                            dx = (dx / dist) * maxRadius;
                            dy = (dy / dist) * maxRadius;
                        }
                        input.joyVecX = dx / maxRadius;
                        input.joyVecY = dy / maxRadius;
                        updateDynamicJoystickVisual(true, input.joyOriginX, input.joyOriginY, dx, dy);
                    }
                }

                if (input.camTouchId !== null) {
                    const ct = findTouchById(e.touches, input.camTouchId);
                    if (ct) {
                        const dx = ct.clientX - input.camLastX;
                        const dy = ct.clientY - input.camLastY;
                        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) input.camMoved = true;
                        camCtrl.yaw -= dx * 0.0065;
                        camCtrl.pitch = Math.max(MIN_CAM_PITCH, Math.min(MAX_CAM_PITCH, camCtrl.pitch + dy * 0.0055));
                        input.camLastX = ct.clientX;
                        input.camLastY = ct.clientY;
                    }
                }

                if (!input.joyActive && e.touches.length === 2) {
                    const currentDist = Math.max(10, getTouchDistance(e.touches[0], e.touches[1]));
                    if (!input.pinchActive && Math.abs(currentDist - input.pinchStartDist) > 22) {
                        input.pinchActive = true;
                        input.pinchStartDist = currentDist;
                        input.pinchStartCamDist = camCtrl.distance;
                    }
                    if (input.pinchActive) {
                        const deltaPx = input.pinchStartDist - currentDist;
                        const nextDist = input.pinchStartCamDist + deltaPx * 0.025;
                        camCtrl.distance = Math.max(MIN_CAM_DIST, Math.min(MAX_CAM_DIST, nextDist));
                    }
                }
            }, { passive: true });

            const onTouchEnd = (e) => {
                if (e.touches.length < 2) {
                    input.pinchActive = false;
                }

                if (input.joyActive && input.joyTouchId !== null && !findTouchById(e.touches, input.joyTouchId)) {
                    input.joyActive = false;
                    input.joyTouchId = null;
                    input.joyVecX = 0;
                    input.joyVecY = 0;
                    updateDynamicJoystickVisual(false);
                }

                if (input.camTouchId !== null && !findTouchById(e.touches, input.camTouchId)) {
                    const elapsedTap = performance.now() - input.camStartTime;
                    if (!input.camMoved && !input.pinchActive && elapsedTap < 340 && state.mode === 'playing') {
                        triggerJump();
                    }
                    input.camTouchId = null;
                    input.camMoved = false;
                }
            };

            canvas.addEventListener('touchend', onTouchEnd, { passive: true });
            canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

            canvas.addEventListener('wheel', (e) => {
                if (state.mode !== 'playing') return;
                e.preventDefault();
                camCtrl.distance = Math.max(MIN_CAM_DIST, Math.min(MAX_CAM_DIST, camCtrl.distance + e.deltaY * 0.006));
            }, { passive: false });

            let mouseDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            canvas.addEventListener('mousedown', (e) => {
                mouseDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!mouseDragging || state.mode !== 'playing') return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                camCtrl.yaw -= dx * 0.0055;
                camCtrl.pitch = Math.max(MIN_CAM_PITCH, Math.min(MAX_CAM_PITCH, camCtrl.pitch + dy * 0.005));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => { mouseDragging = false; });

            document.getElementById('btn-play')?.addEventListener('click', () => {
                ensureAudioContext();
                requestImmersiveFullscreen();
                state.currentLevel = 1;
                saveState();
                teleportToStageProgress(1);
                setMode('playing');
            });
            document.getElementById('btn-hud-fullscreen')?.addEventListener('click', () => {
                requestImmersiveFullscreen();
            });
            document.getElementById('btn-open-levels')?.addEventListener('click', openLevelsModal);
            document.getElementById('btn-close-levels')?.addEventListener('click', closeLevelsModal);
            document.getElementById('btn-hud-lobby')?.addEventListener('click', () => setMode('lobby'));
            document.getElementById('btn-hud-levels')?.addEventListener('click', openLevelsModal);

            const jumpToStage = (targetLvl) => {
                const clamped = Math.max(1, Math.min(state.maxUnlockedLevel, targetLvl));
                if (clamped === state.currentLevel) return;
                state.currentLevel = clamped;
                saveState();
                teleportToStageProgress(clamped);
                updateHud();
                showToast(`Etapa ${clamped}`, 1100);
            };
            document.getElementById('btn-stage-first')?.addEventListener('click', () => jumpToStage(1));
            document.getElementById('btn-stage-prev')?.addEventListener('click', () => jumpToStage(state.currentLevel - 1));
            document.getElementById('btn-stage-next')?.addEventListener('click', () => jumpToStage(state.currentLevel + 1));
            document.getElementById('btn-stage-max')?.addEventListener('click', () => jumpToStage(state.maxUnlockedLevel));

            document.getElementById('btn-hud-sound')?.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                saveState();
                updateHud();
                if (state.soundEnabled && state.mode === 'playing') startSuspenseMusic();
                else stopSuspenseMusic();
            });
        }

        function updateProceduralMovementAnimation(dt, horizSpeed) {
            if (!player.visualPivot) return;
            const isMoving = horizSpeed > 0.35;
            const runRatio = Math.max(0, Math.min(1, (horizSpeed - 1.5) / 6.5));
            const targetBlend = isMoving ? 1 : 0;
            player.animBlend = THREE.MathUtils.lerp(player.animBlend, targetBlend, Math.min(1, dt * 14));

            if (player.hasCustomModel && player.mixer) {
                if (!player.onGround && player.actions.jump) {
                    player.mixer.timeScale = 1;
                    setPlayerAnimation('jump');
                } else if (isMoving && player.actions.run) {
                    player.mixer.timeScale = 1;
                    const runAction = player.actions.run;
                    runAction.setEffectiveTimeScale(THREE.MathUtils.clamp(0.9 + runRatio * 0.5, 0.9, 1.45));
                    setPlayerAnimation('run');
                } else if (USE_STOP_WALKING_GLB && player.actions.idle) {
                    player.mixer.timeScale = 1;
                    setPlayerAnimation('idle');
                } else {
                    if (player.activeAnimKey && player.actions[player.activeAnimKey]) {
                        player.actions[player.activeAnimKey].stop();
                        player.activeAnimKey = null;
                    }
                    player.mixer.timeScale = 0;
                }
            }

            if (isMoving) {
                const cadence = 9.5 + runRatio * 6.5;
                player.walkCycle += dt * cadence;
            }

            const strideWave = Math.sin(player.walkCycle);
            const bounceWave = Math.abs(Math.cos(player.walkCycle));

            let targetPivotY = 0;
            let targetPitchX = 0;
            let targetRollZ = 0;

            if (!player.onGround) {
                targetPitchX = THREE.MathUtils.clamp(-player.vel.y * 0.012, -0.18, 0.18);
                targetPivotY = player.vel.y > 0 ? 0.12 : 0.04;
            } else if (isMoving) {
                targetPivotY = (0.06 + runRatio * 0.09) * bounceWave * player.animBlend;
                targetPitchX = -(0.04 + runRatio * 0.08) * player.animBlend;
                targetRollZ = strideWave * (0.025 + runRatio * 0.03) * player.animBlend;
            }

            player.visualPivot.position.y = THREE.MathUtils.lerp(player.visualPivot.position.y, targetPivotY, Math.min(1, dt * 18));
            player.visualPivot.rotation.x = THREE.MathUtils.lerp(player.visualPivot.rotation.x, targetPitchX, Math.min(1, dt * 18));
            player.visualPivot.rotation.z = THREE.MathUtils.lerp(player.visualPivot.rotation.z, targetRollZ, Math.min(1, dt * 18));

            if (!player.hasCustomModel && player.leftLeg && player.rightLeg && player.leftArm && player.rightArm) {
                if (!player.onGround) {
                    player.leftLeg.rotation.x = THREE.MathUtils.lerp(player.leftLeg.rotation.x, 0.45, Math.min(1, dt * 14));
                    player.rightLeg.rotation.x = THREE.MathUtils.lerp(player.rightLeg.rotation.x, -0.35, Math.min(1, dt * 14));
                    player.leftArm.rotation.x = THREE.MathUtils.lerp(player.leftArm.rotation.x, -0.65, Math.min(1, dt * 14));
                    player.rightArm.rotation.x = THREE.MathUtils.lerp(player.rightArm.rotation.x, -0.65, Math.min(1, dt * 14));
                } else if (isMoving) {
                    const swing = strideWave * (0.55 + runRatio * 0.45);
                    player.leftLeg.rotation.x = swing;
                    player.rightLeg.rotation.x = -swing;
                    player.leftArm.rotation.x = -swing * 0.75;
                    player.rightArm.rotation.x = swing * 0.75;
                } else {
                    player.leftLeg.rotation.x = 0;
                    player.rightLeg.rotation.x = 0;
                    player.leftArm.rotation.x = 0;
                    player.rightArm.rotation.x = 0;
                }
            }
        }

        function updateWorld(dt, elapsed) {
            for (const cl of skyClouds) {
                cl.angle += cl.speed * dt;
                cl.mesh.position.x = Math.cos(cl.angle) * cl.radius;
                cl.mesh.position.z = Math.sin(cl.angle) * cl.radius;
                cl.mesh.position.y = cl.baseY + Math.sin(elapsed * 0.65 + cl.phase) * 0.55;
                cl.mesh.rotation.y = -cl.angle + Math.PI / 2;
            }

            for (const d of ambientDragons) {
                d.angle += d.speed * dt;
                const x = Math.cos(d.angle) * d.radius;
                const z = Math.sin(d.angle) * d.radius;
                const y = Math.max(16, lavaFloorY + d.baseY) + Math.sin(elapsed * 1.4 + d.phase) * d.bobAmp;

                d.wrapper.position.set(x, y, z);
                const tangentYaw = -d.angle + (d.speed >= 0 ? Math.PI : 0);
                d.wrapper.rotation.y = tangentYaw;

                if (d.mixer) {
                    d.mixer.update(dt);
                } else {
                    const flap = Math.sin(elapsed * 5.2 + d.phase);
                    d.bodyPivot.rotation.z = flap * 0.06;
                    d.bodyPivot.rotation.x = Math.cos(elapsed * 2.6 + d.phase) * 0.05;
                    for (const lw of d.wingParts.leftWingParts) {
                        lw.rotation.z = flap * 0.42;
                    }
                    for (const rw of d.wingParts.rightWingParts) {
                        rw.rotation.z = -flap * 0.42;
                    }
                }
            }

            for (const c of coins) {
                if (c.collected) continue;
                c.mesh.rotation.z += 2.6 * dt;
                c.mesh.position.y = c.y + Math.sin(elapsed * 3.5 + c.x) * 0.2;
            }
        }

        function updatePlayer(dt, elapsed) {
            if (!player.root) return;
            player.root.visible = true;
            if (player.visualPivot) player.visualPivot.visible = true;
            if (player.mixer) player.mixer.update(dt);

            if (state.mode !== 'playing') {
                player.root.position.copy(player.pos);
                player.root.rotation.y = player.yaw;
                updateProceduralMovementAnimation(dt, 0);
                return;
            }

            let moveX = input.joyActive ? input.joyVecX : 0;
            let moveZ = input.joyActive ? input.joyVecY : 0;
            if (input.keys['KeyA'] || input.keys['ArrowLeft']) moveX -= 1;
            if (input.keys['KeyD'] || input.keys['ArrowRight']) moveX += 1;
            if (input.keys['KeyW'] || input.keys['ArrowUp']) moveZ -= 1;
            if (input.keys['KeyS'] || input.keys['ArrowDown']) moveZ += 1;

            const len = Math.hypot(moveX, moveZ);
            if (len > 1) {
                moveX /= len;
                moveZ /= len;
            }

            const forward = new THREE.Vector3(-Math.sin(camCtrl.yaw), 0, -Math.cos(camCtrl.yaw));
            const right = new THREE.Vector3(Math.cos(camCtrl.yaw), 0, -Math.sin(camCtrl.yaw));
            const wishDir = new THREE.Vector3().addScaledVector(right, moveX).addScaledVector(forward, -moveZ);

            const moveSpeed = 8.2;
            player.vel.x = wishDir.x * moveSpeed;
            player.vel.z = wishDir.z * moveSpeed;
            player.vel.y -= 24.0 * dt;

            const prevY = player.pos.y;
            const nextX = player.pos.x + player.vel.x * dt;
            const nextZ = player.pos.z + player.vel.z * dt;
            const nextY = player.pos.y + player.vel.y * dt;

            if (wishDir.lengthSq() > 0.001) {
                const targetYaw = Math.atan2(-wishDir.x, -wishDir.z);
                player.yaw = targetYaw;
                player.root.rotation.y = targetYaw;

                if (mapLoaded && mapMeshes.length > 0 && wishDir.lengthSq() > 0.01) {
                    const wallRay = new THREE.Raycaster(
                        new THREE.Vector3(player.pos.x, player.pos.y + 1.45, player.pos.z),
                        wishDir.clone().normalize()
                    );
                    wallRay.far = 0.45;
                    const wallHits = wallRay.intersectObjects(mapMeshes, true);
                    const blockingWall = wallHits.find(h => Math.abs(h.face.normal.y) < 0.08);
                    if (!blockingWall) {
                        player.pos.x = nextX;
                        player.pos.z = nextZ;
                    }
                } else {
                    player.pos.x = nextX;
                    player.pos.z = nextZ;
                }
            }

            player.pos.y = nextY;
            player.onGround = false;

            if (mapLoaded && mapMeshes.length > 0 && player.vel.y <= 1.5) {
                const sampleOffsets = [[0, 0], [-0.45, -0.45], [0.45, -0.45], [-0.45, 0.45], [0.45, 0.45]];
                let bestFloorY = null;
                for (const [ox, oz] of sampleOffsets) {
                    const rayStartY = prevY + 1.6;
                    raycaster.set(new THREE.Vector3(player.pos.x + ox, rayStartY, player.pos.z + oz), downDir);
                    raycaster.far = Math.max(1.8, (rayStartY - player.pos.y) + 0.8);
                    const hits = raycaster.intersectObjects(mapMeshes, true);
                    for (const h of hits) {
                        if (h.point.y <= prevY + 1.1 && (bestFloorY === null || h.point.y > bestFloorY)) {
                            bestFloorY = h.point.y;
                        }
                    }
                }
                if (bestFloorY !== null && player.pos.y <= bestFloorY + 0.25) {
                    player.pos.y = bestFloorY;
                    player.vel.y = 0;
                    player.onGround = true;
                    player.jumpsUsed = 0;
                }
            }

            if (player.pos.y <= lavaFloorY + 0.45) {
                respawnPlayer(true);
                return;
            }

            for (const cp of checkpoints) {
                if (cp.activated) continue;
                if (player.pos.distanceTo(new THREE.Vector3(cp.x, cp.y, cp.z)) < 2.8) {
                    cp.activated = true;
                    currentSpawn.set(cp.x, cp.y + 0.25, cp.z);
                    cp.pad.material.color.setHex(0xfacc15);
                    if (cp.stageNum > state.currentLevel) {
                        state.currentLevel = cp.stageNum;
                        if (cp.stageNum > state.maxUnlockedLevel) state.maxUnlockedLevel = cp.stageNum;
                        saveState();
                        updateHud();
                    }
                    sfxCheckpoint();
                    showToast(`¡Checkpoint Etapa ${cp.stageNum}!`, 1400);
                }
            }

            for (const c of coins) {
                if (c.collected) continue;
                if (player.pos.distanceTo(new THREE.Vector3(c.x, c.y, c.z)) < 1.75) {
                    c.collected = true;
                    c.mesh.visible = false;
                    state.coins += 1;
                    saveState();
                    updateHud();
                    sfxCoin();
                }
            }

            updateProceduralMovementAnimation(dt, Math.hypot(player.vel.x, player.vel.z));
            if (player.customModel) {
                player.customModel.visible = true;
                player.customModel.scale.setScalar(AMY_DIRECT_SCALE);
                if (player.fallbackGroup) player.fallbackGroup.visible = false;
            }
            player.root.position.copy(player.pos);
        }

        function updateCamera() {
            if (!camera) return;
            const target = new THREE.Vector3(player.pos.x, player.pos.y + 1.5, player.pos.z);
            camera.position.lerp(computeCameraDesiredPos(target), 0.16);
            camera.lookAt(target);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();
            updateLavaSplashes(dt);
            updateWorld(dt, elapsed);
            updatePlayer(dt, elapsed);
            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => {
            loadState();
            initThree();
            bindControls();
            updateHud();
            animate();
        });
    </script>
</body>
</html>
