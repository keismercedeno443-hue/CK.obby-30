<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obby 3D - 30 Niveles Largos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="handleThreeFallback()"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #38bdf8;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #joystick-zone {
            position: fixed;
            left: 24px;
            bottom: 24px;
            width: 132px;
            height: 132px;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
            z-index: 20;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 54px;
            height: 54px;
            margin-left: -27px;
            margin-top: -27px;
            border-radius: 9999px;
            background: linear-gradient(145deg, #38bdf8, #2563eb);
            border: 2px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.55);
            pointer-events: none;
        }
        #jump-btn {
            position: fixed;
            right: 28px;
            bottom: 28px;
            width: 88px;
            height: 88px;
            border-radius: 9999px;
            background: linear-gradient(145deg, #fbbf24, #d97706);
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.5);
            z-index: 20;
            touch-action: none;
        }
        #jump-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body>
    <!-- Lienzo principal 3D -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD Superior del Juego -->
    <div id="game-hud" class="hidden fixed top-3 left-3 right-3 z-20 flex items-center justify-between gap-2 pointer-events-none">
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="btn-hud-back" title="Volver al Lobby" class="bg-slate-900/85 hover:bg-slate-800 text-white w-9 h-9 rounded-full border border-white/15 text-sm font-black shadow-lg active:scale-95 transition flex items-center justify-center">
                ✕
            </button>
            <div class="bg-slate-900/80 text-white px-3.5 py-2 rounded-2xl border border-white/15 backdrop-blur-md shadow-lg">
                <span class="text-xs uppercase tracking-wider text-sky-300 font-bold">Nivel</span>
                <span id="hud-level" class="text-base font-black ml-1">1 / 30</span>
            </div>
            <div class="bg-slate-900/80 text-amber-300 px-3.5 py-2 rounded-2xl border border-white/15 backdrop-blur-md shadow-lg font-extrabold text-sm">
                🪙 <span id="hud-coins">0</span>
            </div>
            <div class="hidden sm:flex bg-slate-900/80 text-emerald-300 px-3 py-2 rounded-2xl border border-white/15 backdrop-blur-md shadow-lg font-bold text-xs">
                Meta: <span id="hud-distance" class="ml-1 font-black">0m</span>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="btn-hud-levels" class="bg-slate-900/85 hover:bg-slate-800 text-white px-3 py-2 rounded-2xl border border-white/15 text-xs font-extrabold shadow-lg active:scale-95 transition">
                Niveles
            </button>
            <button id="btn-hud-sound" class="bg-slate-900/85 hover:bg-slate-800 text-white px-3 py-2 rounded-2xl border border-white/15 text-xs font-extrabold shadow-lg active:scale-95 transition">
                🔊
            </button>
            <button id="btn-hud-lobby" class="bg-rose-600/90 hover:bg-rose-500 text-white px-3 py-2 rounded-2xl border border-white/20 text-xs font-extrabold shadow-lg active:scale-95 transition">
                Lobby
            </button>
        </div>
    </div>

    <!-- Mensaje flotante en pantalla -->
    <div id="toast-banner" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 text-white px-4 py-2 rounded-2xl border border-sky-400/40 text-xs sm:text-sm font-bold shadow-xl pointer-events-none text-center max-w-[90vw]">
    </div>

    <!-- Controles táctiles para móvil -->
    <div id="joystick-zone" class="hidden">
        <div id="joystick-knob"></div>
    </div>
    <button id="jump-btn" class="hidden flex flex-col items-center justify-center text-slate-950 font-black">
        <span class="text-xl leading-none">▲</span>
        <span class="text-[11px] tracking-wide mt-0.5">SALTAR</span>
    </button>

    <!-- Lobby Principal -->
    <div id="lobby-screen" class="fixed inset-0 z-30 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm">
        <div class="w-full max-w-md bg-slate-900/95 border border-white/15 rounded-3xl p-6 text-white shadow-2xl">
            <div class="text-center mb-5">
                <span class="inline-block px-3 py-1 rounded-full bg-sky-500/20 border border-sky-400/40 text-sky-300 text-xs font-extrabold uppercase tracking-wider mb-2">
                    30 Niveles Largos 3D
                </span>
                <h1 class="text-3xl font-black tracking-tight">Obby 3D</h1>
                <p class="text-slate-300 text-xs sm:text-sm mt-1">
                    Recorridos largos de 12 a 16 etapas: caminos angostos, escaleras, lava 3D, rodillos y portales.
                </p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3 text-center">
                    <div class="text-[11px] uppercase text-slate-400 font-bold">Nivel Actual</div>
                    <div id="lobby-unlocked" class="text-xl font-black text-sky-400 mt-0.5">1 / 30</div>
                </div>
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3 text-center">
                    <div class="text-[11px] uppercase text-slate-400 font-bold">Monedas</div>
                    <div id="lobby-coins" class="text-xl font-black text-amber-400 mt-0.5">🪙 0</div>
                </div>
            </div>

            <div class="space-y-2.5">
                <button id="btn-play" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-base shadow-lg active:scale-[0.99] transition">
                    ▶ Jugar
                </button>
                <button id="btn-select-level" class="w-full py-3 rounded-2xl bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-400 hover:to-blue-500 text-white font-extrabold text-sm shadow-lg active:scale-[0.99] transition">
                    🗺️ Elegir Nivel
                </button>
                <button id="btn-toggle-sound" class="w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-slate-100 font-bold text-sm active:scale-[0.99] transition">
                    🔊 Sonido y Música: Activado
                </button>
            </div>
        </div>
    </div>

    <!-- Selector de Niveles -->
    <div id="level-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-slate-900 border border-white/15 rounded-3xl p-5 text-white shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-black">Seleccionar Nivel (1 - 30)</h2>
                <button id="btn-close-levels" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold">
                    Cerrar
                </button>
            </div>
            <div id="levels-grid" class="grid grid-cols-5 gap-2 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <script>
        // =========================================================================
        // RESPUESTA DE RESPALDO DE THREE.JS CDN
        // =========================================================================
        function handleThreeFallback() {
            const s = document.createElement('script');
            s.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
            document.head.appendChild(s);
        }

        // =========================================================================
        // ESTADO GLOBAL Y PERSISTENCIA
        // =========================================================================
        const TOTAL_LEVELS = 30;
        const STORAGE_KEY = 'obby3d_estado_limpio_v1';

        const state = {
            mode: 'lobby', // 'lobby' | 'playing'
            currentLevel: 1,
            unlockedLevel: 1,
            coins: 0,
            soundEnabled: true
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (typeof parsed.currentLevel === 'number') {
                    state.currentLevel = Math.min(TOTAL_LEVELS, Math.max(1, parsed.currentLevel));
                }
                if (typeof parsed.unlockedLevel === 'number') {
                    state.unlockedLevel = Math.min(TOTAL_LEVELS, Math.max(1, parsed.unlockedLevel));
                }
                if (typeof parsed.coins === 'number') {
                    state.coins = Math.max(0, Math.floor(parsed.coins));
                }
                if (typeof parsed.soundEnabled === 'boolean') {
                    state.soundEnabled = parsed.soundEnabled;
                }
            } catch (e) {
                console.warn('Error cargando estado:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    currentLevel: state.currentLevel,
                    unlockedLevel: state.unlockedLevel,
                    coins: state.coins,
                    soundEnabled: state.soundEnabled
                }));
            } catch (e) {
                console.warn('Error guardando estado:', e);
            }
        }

        let toastTimeout = null;
        function showToast(msg, duration = 2200) {
            const el = document.getElementById('toast-banner');
            if (!el) return;
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.add('hidden');
            }, duration);
        }

        // =========================================================================
        // AUDIO Y MÚSICA PROCEDURAL (WEB AUDIO API)
        // =========================================================================
        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;
        const melodyNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 349.23];
        const bassNotes = [130.81, 130.81, 196.00, 196.00, 146.83, 146.83, 174.61, 196.00];

        function getAudioCtx() {
            if (!state.soundEnabled) return null;
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) audioCtx = new Ctx();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            } catch (e) {
                return null;
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.08, endFreq = null) {
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (endFreq !== null) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
                }
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (e) {
                // Ignorar restricciones de audio del navegador
            }
        }

        function sfxJump() { playTone(230, 0.16, 'triangle', 0.11, 520); }
        function sfxCoin() { playTone(784, 0.09, 'sine', 0.09, 1046.5); }
        function sfxCheckpoint() { playTone(440, 0.11, 'sine', 0.09, 659.25); }
        function sfxPortal() {
            playTone(523.25, 0.14, 'triangle', 0.11, 783.99);
            setTimeout(() => playTone(783.99, 0.22, 'triangle', 0.11, 1046.5), 110);
        }
        function sfxLava() { playTone(190, 0.24, 'sawtooth', 0.09, 75); }

        function startBgm() {
            if (bgmTimer) return;
            bgmTimer = setInterval(() => {
                if (!state.soundEnabled || state.mode !== 'playing') return;
                const idx = bgmStep % melodyNotes.length;
                bgmStep += 1;
                playTone(melodyNotes[idx], 0.22, 'triangle', 0.045);
                if (idx % 2 === 0) {
                    playTone(bassNotes[idx], 0.32, 'sine', 0.045);
                }
            }, 340);
        }

        ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
            window.addEventListener(evt, () => {
                getAudioCtx();
                if (state.soundEnabled) startBgm();
            }, { passive: true });
        });

        // =========================================================================
        // MOTOR THREE.JS, PERSONAJE Y NIVELES DE 12 A 16 ETAPAS
        // =========================================================================
        let scene, camera, renderer;
        let levelGroup, wallGroup, sceneryGroup;
        let playerGroup, headMesh, torsoMesh, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot;

        const platforms = [];
        const ladders = [];
        const lavaZones = [];
        const coins = [];
        const spinners = [];
        const checkpoints = [];
        const wallMeshes = [];
        const lavaSplashes = [];
        let lavaFloorMesh = null;
        let lavaCrustMesh = null;
        let lavaSurfaceY = -8.5;
        let portalMesh = null;
        let portalPos = null;
        const studTextureCache = new Map();
        let lavaWaveGeo = null;
        let lavaWaveBasePos = null;
        let splashSpawnTimer = 0;
        const player = {
            pos: null,
            vel: null,
            spawn: null,
            radius: 0.42,
            height: 1.85,
            onGround: false,
            yaw: 0,
            walkCycle: 0
        };

        const camCtrl = {
            yaw: 0,
            pitch: 0.34,
            distance: 9.5,
            minDist: 4.5,
            maxDist: 18.0
        };

        function createRobloxFaceTexture() {
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const g = c.getContext('2d');
            g.fillStyle = '#fde047';
            g.fillRect(0, 0, 128, 128);
            g.fillStyle = '#0f172a';
            g.beginPath();
            g.ellipse(42, 54, 8, 12, 0, 0, Math.PI * 2);
            g.ellipse(86, 54, 8, 12, 0, 0, Math.PI * 2);
            g.fill();
            g.fillStyle = '#ffffff';
            g.beginPath();
            g.arc(44, 50, 3, 0, Math.PI * 2);
            g.arc(88, 50, 3, 0, Math.PI * 2);
            g.fill();
            g.strokeStyle = '#0f172a';
            g.lineWidth = 6;
            g.lineCap = 'round';
            g.beginPath();
            g.arc(64, 72, 22, 0.15 * Math.PI, 0.85 * Math.PI);
            g.stroke();
            const tex = new THREE.CanvasTexture(c);
            tex.needsUpdate = true;
            return tex;
        }

        function createLavaTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const g = c.getContext('2d');

            const grad = g.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, '#fffbeb');
            grad.addColorStop(0.24, '#facc15');
            grad.addColorStop(0.55, '#f97316');
            grad.addColorStop(0.85, '#dc2626');
            grad.addColorStop(1, '#7f1d1d');
            g.fillStyle = grad;
            g.fillRect(0, 0, 512, 512);

            // Bandas fluidas y remolinos de lava líquida
            for (let b = 0; b < 18; b++) {
                const y0 = (b / 18) * 512;
                const bGrad = g.createLinearGradient(0, y0 - 18, 0, y0 + 22);
                bGrad.addColorStop(0, 'rgba(220, 38, 38, 0)');
                bGrad.addColorStop(0.5, b % 2 === 0 ? 'rgba(254, 240, 138, 0.58)' : 'rgba(251, 146, 60, 0.62)');
                bGrad.addColorStop(1, 'rgba(220, 38, 38, 0)');
                g.fillStyle = bGrad;
                g.beginPath();
                g.moveTo(0, y0);
                for (let x = 0; x <= 512; x += 32) {
                    const waveY = y0 + Math.sin(x * 0.025 + b * 1.1) * 14;
                    g.lineTo(x, waveY);
                }
                for (let x = 512; x >= 0; x -= 32) {
                    const waveY = y0 + 18 + Math.cos(x * 0.02 + b * 0.9) * 14;
                    g.lineTo(x, waveY);
                }
                g.closePath();
                g.fill();
            }

            // Burbujas brillantes y núcleos calientes líquidos
            for (let i = 0; i < 54; i++) {
                const bx = ((i * 89) % 484) + 14;
                const by = ((i * 137) % 484) + 14;
                const br = 8 + (i % 6) * 6;
                const bGrad = g.createRadialGradient(bx - br * 0.25, by - br * 0.25, 1.5, bx, by, br);
                bGrad.addColorStop(0, 'rgba(255, 255, 240, 0.92)');
                bGrad.addColorStop(0.45, 'rgba(250, 204, 21, 0.68)');
                bGrad.addColorStop(0.8, 'rgba(249, 115, 22, 0.32)');
                bGrad.addColorStop(1, 'rgba(185, 28, 28, 0)');
                g.fillStyle = bGrad;
                g.beginPath();
                g.arc(bx, by, br, 0, Math.PI * 2);
                g.fill();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(22, 22);
            tex.needsUpdate = true;
            return tex;
        }

        function createRobloxStudTexture(hexColor = 0x3b82f6) {
            const key = Number(hexColor).toString(16).padStart(6, '0');
            if (studTextureCache.has(key)) {
                return studTextureCache.get(key);
            }

            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const g = c.getContext('2d');

            const baseCol = new THREE.Color(hexColor);
            const r = Math.round(baseCol.r * 255);
            const gr = Math.round(baseCol.g * 255);
            const b = Math.round(baseCol.b * 255);

            const lightR = Math.min(255, Math.round(r * 1.24 + 14));
            const lightG = Math.min(255, Math.round(gr * 1.24 + 14));
            const lightB = Math.min(255, Math.round(b * 1.24 + 14));

            const darkR = Math.max(0, Math.round(r * 0.72));
            const darkG = Math.max(0, Math.round(gr * 0.72));
            const darkB = Math.max(0, Math.round(b * 0.72));

            g.fillStyle = `rgb(${r}, ${gr}, ${b})`;
            g.fillRect(0, 0, 128, 128);

            // Sutil cuadricula tipo bloque clásico de Roblox
            g.strokeStyle = `rgba(${darkR}, ${darkG}, ${darkB}, 0.28)`;
            g.lineWidth = 2;
            g.strokeRect(1, 1, 126, 126);

            // Patrón 2x2 de studs elevados con highlight superior y sombra inferior
            const gridCount = 2;
            const cell = 128 / gridCount;
            for (let gx = 0; gx < gridCount; gx++) {
                for (let gy = 0; gy < gridCount; gy++) {
                    const cx = gx * cell + cell * 0.5;
                    const cy = gy * cell + cell * 0.5;
                    const radius = cell * 0.25;

                    g.fillStyle = `rgba(${darkR}, ${darkG}, ${darkB}, 0.45)`;
                    g.beginPath();
                    g.arc(cx + 2, cy + 3, radius, 0, Math.PI * 2);
                    g.fill();

                    const studGrad = g.createRadialGradient(
                        cx - radius * 0.3,
                        cy - radius * 0.3,
                        radius * 0.12,
                        cx,
                        cy,
                        radius
                    );
                    studGrad.addColorStop(0, `rgb(${lightR}, ${lightG}, ${lightB})`);
                    studGrad.addColorStop(0.75, `rgb(${r}, ${gr}, ${b})`);
                    studGrad.addColorStop(1, `rgb(${darkR}, ${darkG}, ${darkB})`);

                    g.fillStyle = studGrad;
                    g.beginPath();
                    g.arc(cx, cy, radius, 0, Math.PI * 2);
                    g.fill();

                    g.strokeStyle = `rgba(255, 255, 255, 0.24)`;
                    g.lineWidth = 1.5;
                    g.beginPath();
                    g.arc(cx, cy, radius * 0.86, Math.PI * 1.15, Math.PI * 1.85);
                    g.stroke();
                }
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.needsUpdate = true;
            studTextureCache.set(key, tex);
            return tex;
        }

        function createStuddedBlockMaterial(hexColor, roughness = 0.42, metalness = 0.06, repeatX = 1, repeatY = 1) {
            const baseTex = createRobloxStudTexture(hexColor).clone();
            baseTex.repeat.set(Math.max(1, repeatX), Math.max(1, repeatY));
            baseTex.needsUpdate = true;
            return new THREE.MeshStandardMaterial({
                map: baseTex,
                roughness,
                metalness
            });
        }

        function buildOpenWorldScenery(minX, maxX, minZ, maxZ, lavaFloorY) {
            if (!sceneryGroup) return;

            const centerX = (minX + maxX) * 0.5;
            const centerZ = (minZ + maxZ) * 0.5;
            const spanX = Math.max(40, maxX - minX);
            const spanZ = Math.max(40, maxZ - minZ);
            const outerRadius = Math.max(spanX, spanZ) * 0.68 + 38;

            const grassMat = createStuddedBlockMaterial(0x22c55e, 0.68, 0.03, 4, 4);
            const dirtMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.85 });
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.75 });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.8 });
            const leafMatA = createStuddedBlockMaterial(0x16a34a, 0.65, 0.02, 2, 2);
            const leafMatB = createStuddedBlockMaterial(0x15803d, 0.68, 0.02, 2, 2);

            const islandCount = 14;
            for (let i = 0; i < islandCount; i++) {
                const angle = (i / islandCount) * Math.PI * 2 + 0.22;
                const dist = outerRadius + ((i * 19) % 28);
                const ix = centerX + Math.cos(angle) * dist;
                const iz = centerZ + Math.sin(angle) * dist;

                const iw = 18 + ((i * 7) % 16);
                const id = 18 + ((i * 11) % 16);
                const ih = 14 + ((i * 5) % 18);
                const topY = lavaFloorY + ih;

                const cliff = new THREE.Mesh(new THREE.BoxGeometry(iw, ih + 8, id), i % 2 === 0 ? dirtMat : stoneMat);
                cliff.position.set(ix, lavaFloorY + (ih - 8) * 0.5, iz);
                cliff.receiveShadow = true;
                sceneryGroup.add(cliff);

                const grassCap = new THREE.Mesh(new THREE.BoxGeometry(iw + 0.6, 1.4, id + 0.6), grassMat);
                grassCap.position.set(ix, topY + 0.4, iz);
                grassCap.receiveShadow = true;
                sceneryGroup.add(grassCap);

                // Árboles estilizados en bloques tipo Roblox
                const treeCount = 3 + (i % 3);
                for (let t = 0; t < treeCount; t++) {
                    const tx = ix + Math.sin(i * 5 + t * 2.1) * (iw * 0.28);
                    const tz = iz + Math.cos(i * 3 + t * 2.4) * (id * 0.28);
                    const trunkH = 3.2 + ((t + i) % 3) * 0.9;

                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.1, trunkH, 1.1), trunkMat);
                    trunk.position.set(tx, topY + 1.1 + trunkH * 0.5, tz);
                    trunk.castShadow = true;
                    sceneryGroup.add(trunk);

                    const crownSize = 3.6 + ((t * 7 + i) % 3) * 0.7;
                    const crown = new THREE.Mesh(
                        new THREE.BoxGeometry(crownSize, crownSize * 0.85, crownSize),
                        (i + t) % 2 === 0 ? leafMatA : leafMatB
                    );
                    crown.position.set(tx, topY + 1.1 + trunkH + crownSize * 0.35, tz);
                    crown.castShadow = true;
                    sceneryGroup.add(crown);
                }
            }
        }

        function spawnLavaSplashDroplet(fromHazard = false) {
            if (!lavaSplashes.length) return;
            const slot = lavaSplashes.find((s) => !s.active);
            if (!slot) return;

            let originX = slot.cx + (Math.random() - 0.5) * slot.spanX * 0.72;
            let originZ = slot.cz + (Math.random() - 0.5) * slot.spanZ * 0.72;
            let originY = lavaSurfaceY + 0.08;

            if (fromHazard && lavaZones.length > 0) {
                const hz = lavaZones[Math.floor(Math.random() * lavaZones.length)];
                originX = hz.x + (Math.random() - 0.5) * Math.max(0.5, hz.w * 0.8);
                originZ = hz.z + (Math.random() - 0.5) * Math.max(0.5, hz.d * 0.8);
                originY = hz.y + hz.h * 0.5 + 0.06;
            } else if (player && player.pos && Math.random() < 0.45) {
                // Concentrar parte de las salpicaduras cerca del jugador para dar vida visible
                originX = player.pos.x + (Math.random() - 0.5) * 26;
                originZ = player.pos.z + (Math.random() - 0.5) * 26;
            }

            slot.active = true;
            slot.x = originX;
            slot.y = originY;
            slot.z = originZ;
            slot.vx = (Math.random() - 0.5) * 2.8;
            slot.vy = fromHazard ? (5.2 + Math.random() * 3.4) : (6.4 + Math.random() * 4.6);
            slot.vz = (Math.random() - 0.5) * 2.8;
            slot.age = 0;
            slot.maxAge = 0.75 + Math.random() * 0.65;
            slot.mesh.position.set(slot.x, slot.y, slot.z);
            slot.mesh.scale.setScalar(slot.baseScale);
            slot.mesh.visible = true;
        }

        function updateLavaSplashes(dt) {
            if (!lavaSplashes.length) return;

            splashSpawnTimer += dt;
            const spawnInterval = state.mode === 'playing' ? 0.055 : 0.09;
            while (splashSpawnTimer >= spawnInterval) {
                splashSpawnTimer -= spawnInterval;
                spawnLavaSplashDroplet(lavaZones.length > 0 && Math.random() < 0.35);
            }

            const gravity = 16.5;
            for (const s of lavaSplashes) {
                if (!s.active) continue;
                s.age += dt;
                if (s.age >= s.maxAge) {
                    s.active = false;
                    s.mesh.visible = false;
                    continue;
                }

                s.vy -= gravity * dt;
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.z += s.vz * dt;

                const lifeRatio = 1 - (s.age / s.maxAge);
                const scale = Math.max(0.12, s.baseScale * lifeRatio);
                s.mesh.position.set(s.x, s.y, s.z);
                s.mesh.scale.setScalar(scale);
                s.mesh.rotation.x += 6 * dt;
                s.mesh.rotation.y += 5 * dt;

                if (s.y < lavaSurfaceY - 0.35 && s.vy < 0) {
                    s.active = false;
                    s.mesh.visible = false;
                }
            }
        }

        function buildLevel(levelNum) {
            clearLevel();
            const clamped = Math.min(TOTAL_LEVELS, Math.max(1, levelNum));
            state.currentLevel = clamped;

            const diff = (clamped - 1) / (TOTAL_LEVELS - 1);
            const stageCount = 12 + (clamped % 5);
            const palette = [0x3b82f6, 0x8b5cf6, 0x06b6d4, 0xec4899, 0x10b981, 0xf97316];
            const baseColor = palette[clamped % palette.length];
            const accentColor = palette[(clamped + 2) % palette.length];

            let cx = 0;
            let cy = 0;
            let cz = 0;
            let minX = -6, maxX = 6, minZ = -6, maxZ = 6;
            const lavaFloorY = -8.5;

            addPlatform(cx, cy - 0.5, cz, 11.5, 1.0, 10.5, 0x475569);
            player.spawn.set(cx, cy + 0.1, cz);
            player.pos.copy(player.spawn);
            if (player.vel) player.vel.set(0, 0, 0);
            player.yaw = 0;
            camCtrl.yaw = 0;
            camCtrl.pitch = 0.34;

            for (let s = 1; s <= stageCount; s++) {
                const gap = 3.2 + diff * 1.45 + ((s % 3) * 0.32);
                const lateralShift = Math.sin(s * 1.35 + clamped * 0.7) * (1.8 + diff * 2.1);
                const stepUp = (s % 4 === 0) ? (1.05 + diff * 0.35) : ((s % 5 === 0) ? -0.45 : 0);

                cx += lateralShift;
                cy = Math.max(-1.0, cy + stepUp);
                cz -= gap;

                const pattern = (s + clamped) % 5;

                if (pattern === 0) {
                    const bridgeLen = 8.5 + diff * 2.5;
                    const bridgeW = Math.max(3.1, 4.3 - diff * 1.0);
                    addPlatform(cx, cy - 0.4, cz - bridgeLen * 0.5, bridgeW, 0.8, bridgeLen, baseColor, {
                        moveAxis: s > 2 ? 'x' : null,
                        moveAmp: s > 2 ? (1.1 + diff * 1.3) : 0,
                        moveSpeed: 1.3 + diff * 1.1,
                        phase: s * 0.9
                    });
                    if (s % 2 === 0) {
                        addLavaZone(cx, cy + 0.06, cz - bridgeLen * 0.5, Math.min(2.1, bridgeW * 0.52), 0.18, 1.6);
                    }
                    addCoin(cx, cy + 1.2, cz - bridgeLen * 0.5);
                    cz -= bridgeLen;
                } else if (pattern === 1) {
                    const stepCount = 3;
                    for (let k = 0; k < stepCount; k++) {
                        const sx = cx + Math.cos(k * 1.6 + s) * (1.5 + diff * 1.4);
                        const sy = cy + k * 0.65;
                        const sz = cz - (k + 1) * (3.1 + diff * 0.7);
                        const sw = Math.max(2.6, 3.6 - diff * 0.8);
                        addPlatform(sx, sy - 0.35, sz, sw, 0.7, 3.0, accentColor, {
                            moveAxis: (k === 1 && s > 3) ? 'y' : null,
                            moveAmp: (k === 1 && s > 3) ? 0.65 : 0,
                            moveSpeed: 1.5 + diff,
                            phase: k + s
                        });
                        if (k === 1) addCoin(sx, sy + 1.1, sz);
                    }
                    cz -= stepCount * (3.1 + diff * 0.7);
                } else if (pattern === 2) {
                    const deckLen = 9.0;
                    const deckW = 6.2;
                    addPlatform(cx, cy - 0.45, cz - deckLen * 0.5, deckW, 0.9, deckLen, 0x334155);
                    addSpinner(cx, cy + 0.65, cz - deckLen * 0.5, Math.min(5.6, deckW - 0.5), 1.45 + diff * 1.35);
                    addCoin(cx, cy + 1.4, cz - deckLen * 0.75);
                    cz -= deckLen;
                } else if (pattern === 3) {
                    const towerH = 4.2;
                    const towerW = 5.4;
                    addPlatform(cx, cy + towerH * 0.5 - 0.5, cz - 2.6, towerW, towerH, 4.8, 0x475569);
                    addLadder(cx, cy + towerH * 0.5 - 0.4, cz - 0.12, 1.3, towerH + 0.4, 0.35, 0xf59e0b);
                    cy += towerH - 0.4;
                    addCoin(cx, cy + 1.2, cz - 2.6);
                    cz -= 4.8;
                } else {
                    const p1x = cx - 1.6;
                    const p2x = cx + 1.6;
                    const p1z = cz - 2.8;
                    const p2z = cz - 6.2;
                    addPlatform(p1x, cy - 0.35, p1z, 3.2, 0.7, 3.2, baseColor);
                    addPlatform(p2x, cy - 0.35, p2z, 3.2, 0.7, 3.2, accentColor);
                    addCoin(p1x, cy + 1.1, p1z);
                    cz -= 7.8;
                }

                // Piso ancho y tranquilo intermedio cada pocas etapas para respirar y planificar el siguiente salto
                if (s % 2 === 1 && s < stageCount) {
                    addSafeRestPlatform(cx, cy - 0.5, cz - 3.2, 11.5, 9.0, 0x334155);
                    cz -= 7.2;
                }

                minX = Math.min(minX, cx - 8);
                maxX = Math.max(maxX, cx + 8);
                minZ = Math.min(minZ, cz - 8);
                maxZ = Math.max(maxZ, cz + 8);

                if (s % 4 === 0 && s < stageCount) {
                    addSafeRestPlatform(cx, cy - 0.5, cz - 3.6, 12.5, 9.8, 0x1e293b);
                    addCheckpoint(cx, cy, cz - 3.6, Math.floor(s / 4));
                    cz -= 7.8;
                }
            }

            cz -= 3.6;
            addSafeRestPlatform(cx, cy - 0.5, cz - 4.0, 13.0, 11.0, 0x0f172a);
            addPortal(cx, cy, cz - 4.2);

            minX = Math.min(minX, cx - 10);
            maxX = Math.max(maxX, cx + 10);
            minZ = Math.min(minZ, cz - 10);
            maxZ = Math.max(maxZ, cz + 10);

            buildCircuitWall(minX, maxX, minZ, maxZ, lavaFloorY);
            buildOpenWorldScenery(minX, maxX, minZ, maxZ, lavaFloorY);
            initLavaSplashPool(minX, maxX, minZ, maxZ, lavaFloorY);
            updateHud();
            showToast(`Nivel ${clamped} (${stageCount} etapas) — ¡Llegada al portal!`, 2400);
        }

        function respawnPlayer(reasonMsg = '¡Reapareciste en el checkpoint!') {
            if (!player || !player.pos || !player.spawn) return;
            player.pos.copy(player.spawn);
            if (player.vel) player.vel.set(0, 0, 0);
            player.onGround = false;
            showToast(reasonMsg, 1600);
        }

        function completeCurrentLevel() {
            const finishedLevel = state.currentLevel;
            state.coins += 15 + finishedLevel * 2;
            if (finishedLevel >= state.unlockedLevel && finishedLevel < TOTAL_LEVELS) {
                state.unlockedLevel = finishedLevel + 1;
            }
            saveState();
            updateHud();
            sfxPortal();

            if (finishedLevel < TOTAL_LEVELS) {
                const nextLvl = finishedLevel + 1;
                showToast(`¡Nivel ${finishedLevel} completado! Pasando al nivel ${nextLvl}...`, 2200);
                setTimeout(() => {
                    if (state.mode === 'playing') {
                        buildLevel(nextLvl);
                    }
                }, 450);
            } else {
                showToast('¡Completaste los 30 niveles de Obby 3D!', 3200);
                setTimeout(() => {
                    setMode('lobby');
                }, 1400);
            }
        }

        function updateHazardsAndPickups(dt, elapsed) {
            if (!player || !player.pos) return;

            if (lavaFloorMesh && lavaFloorMesh.material && lavaFloorMesh.material.map) {
                lavaFloorMesh.material.map.offset.x = elapsed * 0.085;
                lavaFloorMesh.material.map.offset.y = Math.sin(elapsed * 0.6) * 0.04 + elapsed * 0.055;
            }

            // Ondulación fluida del mar de lava
            if (lavaWaveGeo && lavaWaveBasePos) {
                const posAttr = lavaWaveGeo.attributes.position;
                const arr = posAttr.array;
                for (let i = 0; i < arr.length; i += 3) {
                    const bx = lavaWaveBasePos[i];
                    const bz = lavaWaveBasePos[i + 2];
                    const wave =
                        Math.sin(bx * 0.075 + elapsed * 2.1) * 0.28 +
                        Math.cos(bz * 0.085 - elapsed * 1.75) * 0.24 +
                        Math.sin((bx + bz) * 0.045 + elapsed * 1.4) * 0.16;
                    arr[i + 1] = lavaWaveBasePos[i + 1] + wave;
                }
                posAttr.needsUpdate = true;
                lavaWaveGeo.computeVertexNormals();
            }

            updateLavaSplashes(dt);

            for (const lz of lavaZones) {
                if (lz.tex) {
                    lz.tex.offset.x = elapsed * 0.24;
                    lz.tex.offset.y = -elapsed * 0.19;
                }
                if (lz.mesh && typeof lz.baseY === 'number') {
                    lz.mesh.position.y = lz.baseY + Math.sin(elapsed * 3.2 + lz.x) * 0.05;
                }
                const halfW = lz.w * 0.5 + player.radius * 0.65;
                const halfD = lz.d * 0.5 + player.radius * 0.65;
                const withinX = Math.abs(player.pos.x - lz.x) <= halfW;
                const withinZ = Math.abs(player.pos.z - lz.z) <= halfD;
                const withinY = player.pos.y <= lz.y + lz.h * 0.5 + 0.35 && player.pos.y + player.height >= lz.y - lz.h * 0.5;
                if (withinX && withinZ && withinY) {
                    sfxLava();
                    respawnPlayer('¡Tocaste un bloque de lava!');
                    return;
                }
            }

            for (const sp of spinners) {
                sp.angle += sp.speed * dt;
                sp.pivot.rotation.y = sp.angle;

                const cosA = Math.cos(sp.angle);
                const sinA = Math.sin(sp.angle);
                const relX = player.pos.x - sp.x;
                const relZ = player.pos.z - sp.z;

                const localAlong = relX * cosA - relZ * sinA;
                const localPerp = relX * sinA + relZ * cosA;
                const withinY = Math.abs((player.pos.y + 0.85) - sp.y) <= 0.85;

                if (
                    withinY &&
                    Math.abs(localAlong) <= sp.length * 0.5 + player.radius * 0.5 &&
                    Math.abs(localPerp) <= sp.thickness * 0.5 + player.radius * 0.55
                ) {
                    sfxLava();
                    respawnPlayer('¡Te golpeó el rodillo giratorio!');
                    return;
                }
            }

            for (const c of coins) {
                if (c.collected) continue;
                c.mesh.rotation.y += 2.6 * dt;
                c.mesh.position.y = c.baseY + Math.sin(elapsed * 3.5 + c.phase) * 0.16;

                const dist = Math.hypot(player.pos.x - c.x, player.pos.z - c.z, (player.pos.y + 0.9) - c.mesh.position.y);
                if (dist <= 1.15) {
                    c.collected = true;
                    c.mesh.visible = false;
                    state.coins += 1;
                    saveState();
                    updateHud();
                    sfxCoin();
                }
            }

            if (portalMesh) {
                portalMesh.ring.rotation.z += 1.4 * dt;
                portalMesh.core.rotation.y -= 1.8 * dt;
            }

            if (portalPos) {
                const pDist = Math.hypot(player.pos.x - portalPos.x, player.pos.z - portalPos.z, player.pos.y - (portalPos.y - 1.4));
                if (pDist <= 2.25) {
                    completeCurrentLevel();
                }
            }
        }

        // =========================================================================
        // CONTROLES (TECLADO, JOYSTICK TÁCTIL Y CÁMARA)
        // =========================================================================
        const keys = { w: false, a: false, s: false, d: false, space: false };
        const joyVec = { x: 0, y: 0 };
        let joyPointerId = null;
        let camPointerId = null;
        let lastCamX = 0;
        let lastCamY = 0;
        let jumpPressed = false;

        function resetJoystickKnob() {
            joyPointerId = null;
            joyVec.x = 0;
            joyVec.y = 0;
            const knob = document.getElementById('joystick-knob');
            if (knob) {
                knob.style.transform = 'translate(0px, 0px)';
            }
        }

        function triggerJump() {
            if (!player || !player.vel) return;
            if (player.onGround) {
                player.vel.y = 12.2;
                player.onGround = false;
                sfxJump();
            }
        }

        function bindControls() {
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
                if (e.code === 'Space' || k === ' ') {
                    keys.space = true;
                    if (state.mode === 'playing') triggerJump();
                }
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
                if (e.code === 'Space' || k === ' ') keys.space = false;
            });

            const joyZone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxRadius = 38;

            if (joyZone) {
                joyZone.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    joyPointerId = e.pointerId;
                    joyZone.setPointerCapture(e.pointerId);
                    updateJoystickFromEvent(e);
                });

                joyZone.addEventListener('pointermove', (e) => {
                    if (e.pointerId !== joyPointerId) return;
                    e.stopPropagation();
                    updateJoystickFromEvent(e);
                });

                const endJoy = (e) => {
                    if (e.pointerId !== joyPointerId) return;
                    e.stopPropagation();
                    resetJoystickKnob();
                };
                joyZone.addEventListener('pointerup', endJoy);
                joyZone.addEventListener('pointercancel', endJoy);
            }

            function updateJoystickFromEvent(e) {
                if (!joyZone || !knob) return;
                const rect = joyZone.getBoundingClientRect();
                const cx = rect.left + rect.width * 0.5;
                const cy = rect.top + rect.height * 0.5;
                let dx = e.clientX - cx;
                let dy = e.clientY - cy;
                const dist = Math.hypot(dx, dy);
                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec.x = dx / maxRadius;
                joyVec.y = dy / maxRadius;
            }

            const jumpBtn = document.getElementById('jump-btn');
            if (jumpBtn) {
                jumpBtn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    jumpPressed = true;
                    triggerJump();
                });
                const releaseJump = (e) => {
                    e.stopPropagation();
                    jumpPressed = false;
                };
                jumpBtn.addEventListener('pointerup', releaseJump);
                jumpBtn.addEventListener('pointercancel', releaseJump);
            }

            const canvas = document.getElementById('game-canvas');
            if (canvas) {
                canvas.addEventListener('pointerdown', (e) => {
                    if (state.mode !== 'playing') return;
                    if (camPointerId !== null) return;
                    camPointerId = e.pointerId;
                    lastCamX = e.clientX;
                    lastCamY = e.clientY;
                });

                window.addEventListener('pointermove', (e) => {
                    if (e.pointerId !== camPointerId) return;
                    const dx = e.clientX - lastCamX;
                    const dy = e.clientY - lastCamY;
                    lastCamX = e.clientX;
                    lastCamY = e.clientY;

                    camCtrl.yaw -= dx * 0.0065;
                    camCtrl.pitch = Math.max(0.12, Math.min(1.15, camCtrl.pitch + dy * 0.0055));
                });

                const endCam = (e) => {
                    if (e.pointerId === camPointerId) {
                        camPointerId = null;
                    }
                };
                window.addEventListener('pointerup', endCam);
                window.addEventListener('pointercancel', endCam);
            }
        }

        function updatePlayer(dt, elapsed) {
            if (!player || !player.pos || !player.vel) return;
            if (state.mode !== 'playing') {
                if (playerGroup) {
                    playerGroup.position.copy(player.pos);
                    playerGroup.rotation.y = Math.sin(elapsed * 0.9) * 0.35;
                }
                updateHazardsAndPickups(dt, elapsed);
                return;
            }

            for (const p of platforms) {
                p.dx = 0;
                p.dy = 0;
                p.dz = 0;
                if (p.moveAxis === 'x') {
                    const nextX = p.baseX + Math.sin(elapsed * p.moveSpeed + p.phase) * p.moveAmp;
                    p.dx = nextX - p.x;
                    p.x = nextX;
                } else if (p.moveAxis === 'y') {
                    const nextY = p.baseY + Math.sin(elapsed * p.moveSpeed + p.phase) * p.moveAmp;
                    p.dy = nextY - p.y;
                    p.y = nextY;
                } else if (p.moveAxis === 'z') {
                    const nextZ = p.baseZ + Math.sin(elapsed * p.moveSpeed + p.phase) * p.moveAmp;
                    p.dz = nextZ - p.z;
                    p.z = nextZ;
                }
                p.mesh.position.set(p.x, p.y, p.z);
            }

            let moveX = joyVec.x;
            let moveZ = joyVec.y;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;
            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;

            const mag = Math.hypot(moveX, moveZ);
            if (mag > 1) {
                moveX /= mag;
                moveZ /= mag;
            }

            const sinY = Math.sin(camCtrl.yaw);
            const cosY = Math.cos(camCtrl.yaw);
            const wishX = moveX * cosY + moveZ * sinY;
            const wishZ = -moveX * sinY + moveZ * cosY;

            const speed = 7.4;
            player.vel.x = wishX * speed;
            player.vel.z = wishZ * speed;

            let onLadder = false;
            for (const ld of ladders) {
                const withinX = Math.abs(player.pos.x - ld.x) <= ld.w * 0.5 + player.radius + 0.25;
                const withinZ = Math.abs(player.pos.z - ld.z) <= ld.d * 0.5 + player.radius + 0.25;
                const withinY = player.pos.y >= ld.y - ld.h * 0.5 - 0.5 && player.pos.y <= ld.y + ld.h * 0.5 + 0.6;
                if (withinX && withinZ && withinY) {
                    onLadder = true;
                    break;
                }
            }

            if (onLadder && (mag > 0.1 || keys.space || jumpPressed)) {
                player.vel.y = 7.2;
                player.onGround = true;
            } else {
                if ((keys.space || jumpPressed) && player.onGround) {
                    triggerJump();
                }
                player.vel.y -= 28.0 * dt;
            }

            const prevY = player.pos.y;
            player.pos.x += player.vel.x * dt;
            player.pos.y += player.vel.y * dt;
            player.pos.z += player.vel.z * dt;

            let groundedNow = false;
            for (const p of platforms) {
                const topY = p.y + p.h * 0.5;
                const botY = p.y - p.h * 0.5;
                const halfW = p.w * 0.5 + player.radius * 0.75;
                const halfD = p.d * 0.5 + player.radius * 0.75;

                const withinX = Math.abs(player.pos.x - p.x) <= halfW;
                const withinZ = Math.abs(player.pos.z - p.z) <= halfD;

                if (withinX && withinZ && player.vel.y <= 0 && prevY >= topY - 0.35 && player.pos.y <= topY + 0.08) {
                    player.pos.y = topY;
                    player.pos.x += p.dx;
                    player.pos.z += p.dz;
                    player.vel.y = 0;
                    groundedNow = true;
                } else if (withinX && withinZ && player.pos.y + player.height >= botY && prevY + player.height <= botY + 0.35 && player.vel.y > 0) {
                    player.pos.y = botY - player.height;
                    player.vel.y = 0;
                }
            }

            for (const wm of wallMeshes) {
                if (
                    player.pos.x + player.radius > wm.minX &&
                    player.pos.x - player.radius < wm.maxX &&
                    player.pos.z + player.radius > wm.minZ &&
                    player.pos.z - player.radius < wm.maxZ
                ) {
                    player.pos.x -= player.vel.x * dt;
                    player.pos.z -= player.vel.z * dt;
                }
            }

            for (const cp of checkpoints) {
                if (cp.reached) continue;
                const dx = Math.abs(player.pos.x - cp.x);
                const dz = Math.abs(player.pos.z - cp.z);
                const dy = Math.abs(player.pos.y - cp.y);
                if (dx <= 1.8 && dz <= 1.8 && dy <= 1.6) {
                    cp.reached = true;
                    cp.flagMat.color.setHex(0x22c55e);
                    cp.flagMat.emissive.setHex(0x14532d);
                    if (cp.padMat) {
                        cp.padMat.color.setHex(0x4ade80);
                        cp.padMat.emissive.setHex(0x15803d);
                    }
                    player.spawn.set(cp.x, cp.y + 0.1, cp.z);
                    sfxCheckpoint();
                    showToast(`¡Checkpoint ${cp.index} guardado!`, 1500);
                }
            }

            player.onGround = groundedNow;

            if (mag > 0.08) {
                const targetYaw = Math.atan2(wishX, wishZ);
                let diffYaw = targetYaw - player.yaw;
                while (diffYaw > Math.PI) diffYaw -= Math.PI * 2;
                while (diffYaw < -Math.PI) diffYaw += Math.PI * 2;
                player.yaw += diffYaw * Math.min(1, dt * 14);
                player.walkCycle += dt * 11;
            } else {
                player.walkCycle = 0;
            }

            if (playerGroup) {
                playerGroup.position.copy(player.pos);
                playerGroup.rotation.y = player.yaw;

                const swing = player.onGround ? Math.sin(player.walkCycle) * 0.65 : 0.35;
                if (leftLegPivot) leftLegPivot.rotation.x = swing;
                if (rightLegPivot) rightLegPivot.rotation.x = -swing;
                if (leftArmPivot) leftArmPivot.rotation.x = -swing * 0.8;
                if (rightArmPivot) rightArmPivot.rotation.x = swing * 0.8;
            }

            if (player.pos.y < -8.2) {
                respawnPlayer('¡Caíste a la lava!');
                return;
            }

            updateHazardsAndPickups(dt, elapsed);
            updateHudDistance();
        }

        function updateCamera() {
            if (!camera || !player || !player.pos) return;
            const targetX = player.pos.x;
            const targetY = player.pos.y + 1.65;
            const targetZ = player.pos.z;

            const horizDist = Math.cos(camCtrl.pitch) * camCtrl.distance;
            const vertDist = Math.sin(camCtrl.pitch) * camCtrl.distance;

            const camX = targetX + Math.sin(camCtrl.yaw) * horizDist;
            const camY = targetY + vertDist;
            const camZ = targetZ + Math.cos(camCtrl.yaw) * horizDist;

            camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.22);
            camera.lookAt(targetX, targetY, targetZ);
        }

        // =========================================================================
        // INTERFAZ DE USUARIO, LOBBY Y SELECTOR DE 30 NIVELES
        // =========================================================================
        function updateHudDistance() {
            const el = document.getElementById('hud-distance');
            if (!el || !portalPos || !player || !player.pos) return;
            const dist = Math.max(0, Math.round(Math.hypot(portalPos.x - player.pos.x, portalPos.z - player.pos.z)));
            el.textContent = `${dist}m`;
        }

        function updateHud() {
            const hudLevel = document.getElementById('hud-level');
            const hudCoins = document.getElementById('hud-coins');
            const lobbyUnlocked = document.getElementById('lobby-unlocked');
            const lobbyCoins = document.getElementById('lobby-coins');
            const soundBtnLobby = document.getElementById('btn-toggle-sound');
            const soundBtnHud = document.getElementById('btn-hud-sound');

            if (hudLevel) hudLevel.textContent = `${state.currentLevel} / ${TOTAL_LEVELS}`;
            if (hudCoins) hudCoins.textContent = `${state.coins}`;
            if (lobbyUnlocked) lobbyUnlocked.textContent = `${state.currentLevel} / ${TOTAL_LEVELS}`;
            if (lobbyCoins) lobbyCoins.textContent = `🪙 ${state.coins}`;

            if (soundBtnLobby) {
                soundBtnLobby.textContent = state.soundEnabled
                    ? '🔊 Sonido y Música: Activado'
                    : '🔇 Sonido y Música: Silenciado';
            }
            if (soundBtnHud) {
                soundBtnHud.textContent = state.soundEnabled ? '🔊' : '🔇';
            }
        }

        function renderLevelsModal() {
            const grid = document.getElementById('levels-grid');
            if (!grid) return;
            grid.innerHTML = '';

            for (let lvl = 1; lvl <= TOTAL_LEVELS; lvl++) {
                const isUnlocked = lvl <= state.unlockedLevel;
                const isCurrent = lvl === state.currentLevel;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.disabled = !isUnlocked;
                btn.textContent = isUnlocked ? `${lvl}` : `🔒 ${lvl}`;
                btn.className = [
                    'py-2.5 rounded-xl font-black text-xs sm:text-sm border transition',
                    !isUnlocked
                        ? 'bg-slate-900/70 text-slate-500 border-white/5 cursor-not-allowed opacity-60'
                        : isCurrent
                            ? 'bg-emerald-500 text-slate-950 border-emerald-200 shadow-md active:scale-95'
                            : 'bg-slate-800 hover:bg-slate-700 text-white border-white/10 active:scale-95'
                ].join(' ');

                if (isUnlocked) {
                    btn.addEventListener('click', () => {
                        state.currentLevel = lvl;
                        saveState();
                        closeLevelsModal();
                        setMode('playing');
                        buildLevel(lvl);
                    });
                }
                grid.appendChild(btn);
            }
        }

        function openLevelsModal() {
            renderLevelsModal();
            const modal = document.getElementById('level-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeLevelsModal() {
            const modal = document.getElementById('level-modal');
            if (modal) modal.classList.add('hidden');
        }

        function setMode(newMode) {
            state.mode = newMode;
            const lobby = document.getElementById('lobby-screen');
            const hud = document.getElementById('game-hud');
            const joy = document.getElementById('joystick-zone');
            const jump = document.getElementById('jump-btn');

            if (newMode === 'playing') {
                if (lobby) lobby.classList.add('hidden');
                if (hud) hud.classList.remove('hidden');
                if (joy) joy.classList.remove('hidden');
                if (jump) jump.classList.remove('hidden');
                if (state.soundEnabled) startBgm();
            } else {
                resetJoystickKnob();
                jumpPressed = false;
                if (lobby) lobby.classList.remove('hidden');
                if (hud) hud.classList.add('hidden');
                if (joy) joy.classList.add('hidden');
                if (jump) jump.classList.add('hidden');
            }
            updateHud();
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            saveState();
            if (state.soundEnabled) {
                getAudioCtx();
                startBgm();
                showToast('Sonido y música activados', 1400);
            } else {
                showToast('Sonido silenciado', 1400);
            }
            updateHud();
        }

        function bindMenuEvents() {
            const btnPlay = document.getElementById('btn-play');
            const btnSelect = document.getElementById('btn-select-level');
            const btnToggleSound = document.getElementById('btn-toggle-sound');
            const btnCloseLevels = document.getElementById('btn-close-levels');
            const btnHudBack = document.getElementById('btn-hud-back');
            const btnHudLevels = document.getElementById('btn-hud-levels');
            const btnHudSound = document.getElementById('btn-hud-sound');
            const btnHudLobby = document.getElementById('btn-hud-lobby');

            if (btnPlay) {
                btnPlay.addEventListener('click', () => {
                    setMode('playing');
                    buildLevel(state.currentLevel);
                });
            }
            if (btnSelect) btnSelect.addEventListener('click', openLevelsModal);
            if (btnToggleSound) btnToggleSound.addEventListener('click', toggleSound);
            if (btnCloseLevels) btnCloseLevels.addEventListener('click', closeLevelsModal);
            if (btnHudBack) btnHudBack.addEventListener('click', () => setMode('lobby'));
            if (btnHudLevels) btnHudLevels.addEventListener('click', openLevelsModal);
            if (btnHudSound) btnHudSound.addEventListener('click', toggleSound);
            if (btnHudLobby) btnHudLobby.addEventListener('click', () => setMode('lobby'));
        }

        // =========================================================================
        // BUCLE PRINCIPAL DE ANIMACIÓN Y ARRANQUE SEGURO
        // =========================================================================
        let lastTime = performance.now();
        const startTime = lastTime;

        function animate(now) {
            requestAnimationFrame(animate);
            const currentNow = typeof now === 'number' ? now : performance.now();
            const dt = Math.min((currentNow - lastTime) / 1000, 0.05);
            const elapsed = (currentNow - startTime) / 1000;
            lastTime = currentNow;

            updatePlayer(dt, elapsed);
            updateCamera();

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function bootApp() {
            loadState();
            updateHud();
            bindMenuEvents();
            bindControls();

            const startEngine = () => {
                try {
                    if (!initThree()) {
                        setTimeout(startEngine, 120);
                        return;
                    }
                    buildLevel(state.currentLevel);
                    setMode('lobby');
                    requestAnimationFrame(animate);
                } catch (err) {
                    console.error('Error al iniciar Obby 3D:', err);
                    setMode('lobby');
                }
            };

            startEngine();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootApp);
        } else {
            bootApp();
        }
    </script>
</body>
</html>
