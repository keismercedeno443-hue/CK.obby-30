<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e293b">
    <title>Obby 3D Estilo Roblox — Amy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
            background: #1e293b;
        }
        .roblox-title {
            font-family: 'Fredoka', 'Inter', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .roblox-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
            box-shadow: 0 4px 0 rgba(15, 23, 42, 0.35);
        }
        .roblox-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.35);
        }
        #dynamic-joy-base {
            position: fixed;
            width: 112px;
            height: 112px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.16);
            border: 2px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 25;
        }
        #dynamic-joy-knob {
            position: absolute;
            width: 48px;
            height: 48px;
            left: 50%;
            top: 50%;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.35);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- Joystick dinámico -->
    <div id="dynamic-joy-base">
        <div id="dynamic-joy-knob"></div>
    </div>

    <!-- Banner de notificación -->
    <div id="toast-banner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200">
        <div id="toast-text" class="bg-slate-950/90 text-amber-300 border border-amber-400/40 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold shadow-xl text-center"></div>
    </div>

    <!-- Pantalla de Inicio / Lobby -->
    <div id="lobby-screen" class="fixed inset-0 z-30 flex items-center justify-center p-4 bg-gradient-to-b from-slate-800/75 via-slate-900/80 to-slate-950/90 backdrop-blur-sm">
        <div class="w-full max-w-md bg-slate-900/90 border-2 border-white/20 rounded-3xl p-6 text-white shadow-2xl text-center">
            <div class="inline-block bg-pink-400 text-slate-950 font-black text-xs px-3 py-1 rounded-full mb-2">
                PERSONAJE: AMY • OBBY 3D
            </div>
            <h1 class="roblox-title text-3xl sm:text-4xl font-bold tracking-tight mb-2">
                Colorful 100-Stage Obby
            </h1>
            <p class="text-slate-300 text-xs sm:text-sm mb-5">
                Muévete, salta y evita caer en el piso de lava.
            </p>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Etapa Máxima</div>
                    <div id="lobby-max-level" class="text-lg font-black text-sky-300 mt-0.5">1 / 100</div>
                </div>
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Monedas</div>
                    <div id="lobby-coins" class="text-lg font-black text-amber-300 mt-0.5">0</div>
                </div>
            </div>

            <div class="flex flex-col gap-2.5">
                <button id="btn-play" class="roblox-btn w-full py-3.5 rounded-2xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-base tracking-wide">
                    ▶ JUGAR CON AMY
                </button>
                <button id="btn-open-levels" class="roblox-btn w-full py-3 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-sm">
                    🗺️ Elegir Etapa (1 - 100)
                </button>
            </div>
        </div>
    </div>

    <!-- HUD Superior y Controles en Juego -->
    <div id="hud-layer" class="fixed inset-0 pointer-events-none z-20 hidden flex-col justify-between p-3 sm:p-5">
        <div class="flex items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
                <button id="btn-hud-lobby" class="roblox-btn bg-amber-400 hover:bg-amber-300 text-slate-900 px-3 py-2 rounded-2xl border-2 border-slate-900/20 text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                    <span>🏠</span>
                    <span>Inicio</span>
                </button>
                <button id="btn-hud-levels" class="roblox-btn bg-sky-400 hover:bg-sky-300 text-slate-950 px-3 py-2 rounded-2xl border-2 border-slate-900/20 text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                    <span>🗺️</span>
                    <span>Etapas</span>
                </button>
                <button id="btn-hud-fullscreen" class="roblox-btn bg-slate-800/85 hover:bg-slate-700 text-white px-2.5 py-2 rounded-2xl border border-white/20 text-xs font-extrabold" title="Pantalla completa">
                    ⛶
                </button>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto bg-indigo-950/65 backdrop-blur-md px-2.5 py-1.5 rounded-full border border-indigo-300/35 shadow-lg">
                <button id="btn-stage-first" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Nivel 1">«</button>
                <button id="btn-stage-prev" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Etapa anterior">‹</button>
                <div class="px-2.5 sm:px-3.5 py-0.5 rounded-full bg-indigo-600/90 border border-indigo-200/40 text-white font-black text-xs sm:text-sm tracking-wide">
                    <span id="hud-level-text" class="text-amber-300">1</span><span class="text-indigo-200/80">/100</span>
                </div>
                <button id="btn-stage-next" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Siguiente etapa">›</button>
                <button id="btn-stage-max" class="roblox-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-indigo-500/80 hover:bg-indigo-400 text-white text-xs font-black flex items-center justify-center" title="Etapa máxima desbloqueada">»</button>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <div class="bg-slate-900/80 text-amber-300 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl border border-amber-400/40 font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                    <span>🪙</span>
                    <span id="hud-coins-text">0</span>
                </div>
                <button id="btn-hud-sound" class="roblox-btn bg-slate-800/85 hover:bg-slate-700 text-white p-2.5 rounded-2xl border border-white/20 text-sm font-bold" title="Sonido">
                    🔊
                </button>
            </div>
        </div>

        <div class="flex items-end justify-between gap-3">
            <div class="hidden sm:block pointer-events-none">
                <span class="inline-block bg-slate-900/60 text-white/95 text-xs px-3.5 py-1 rounded-full backdrop-blur-sm">
                    Izquierda: mover • Derecha: girar cámara / toque rápido para saltar • Pellizco: zoom
                </span>
            </div>
        </div>
    </div>

    <!-- Modal Selector de Etapas -->
    <div id="levels-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-slate-900 border-2 border-white/20 rounded-3xl p-5 sm:p-6 text-white shadow-2xl max-h-[82vh] flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="roblox-title text-xl sm:text-2xl font-bold">Seleccionar Etapa</h2>
                <button id="btn-close-levels" class="roblox-btn bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold">
                    ✕ Cerrar
                </button>
            </div>
            <div id="levels-grid" class="grid grid-cols-5 gap-2 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <script>
        const TOTAL_LEVELS = 100;
        const STORAGE_KEY = 'obby_roblox_100_amy_v21';
        const CUSTOM_SPAWN_KEY = 'obby_roblox_100_amy_spawn_v1';

        const PLAYER_GLB_URL = './Amy.glb';
        const MAP_GLB_URL = './colorful_100-stage_obby.glb';
        const LAVA_FLOOR_GLB_URL = './lava.glb';
        const LAVA_DRAGON_GLB_URL = './lava_dragon.glb';
        const ANIM_IDLE_GLB_URL = './stop_walking.glb';
        const ANIM_RUN_GLB_URL = './Running-Amy.glb';
        const ANIM_JUMP_GLB_URL = './Jump.glb';

        const USE_STOP_WALKING_GLB = true;
        const AMY_DIRECT_SCALE = 1.40;
        const MAP_TARGET_SPAN = 180;
        const LAVA_FLOOR_SPAN = 760;
        const DRAGON_TARGET_SPAN = 9.5;
        const MIN_CAM_DIST = 5.5;
        const MAX_CAM_DIST = 13.5;
        const MIN_CAM_PITCH = -0.45;
        const MAX_CAM_PITCH = 1.05;

        const LEVEL_1_FIXED_SPAWN = { x: 52.0, y: 4.6, z: -21.5 };
        const LEVEL_1_FACING_YAW = -1.89;

        const state = {
            mode: 'lobby',
            currentLevel: 1,
            maxUnlockedLevel: 1,
            coins: 0,
            soundEnabled: true
        };

        function requestImmersiveFullscreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement && el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (!document.webkitFullscreenElement && el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                }
            } catch (e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (typeof parsed.currentLevel === 'number') state.currentLevel = Math.max(1, Math.min(TOTAL_LEVELS, parsed.currentLevel));
                if (typeof parsed.maxUnlockedLevel === 'number') state.maxUnlockedLevel = Math.max(1, Math.min(TOTAL_LEVELS, parsed.maxUnlockedLevel));
                if (typeof parsed.coins === 'number') state.coins = Math.max(0, Math.floor(parsed.coins));
                if (typeof parsed.soundEnabled === 'boolean') state.soundEnabled = parsed.soundEnabled;
            } catch (err) {
                console.warn('Error cargando progreso:', err);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    currentLevel: state.currentLevel,
                    maxUnlockedLevel: state.maxUnlockedLevel,
                    coins: state.coins,
                    soundEnabled: state.soundEnabled
                }));
            } catch (err) {
                console.warn('Error guardando progreso:', err);
            }
        }

        function loadSavedSpawn() {
            try {
                const raw = localStorage.getItem(CUSTOM_SPAWN_KEY);
                if (!raw) return null;
                const p = JSON.parse(raw);
                if (typeof p.x === 'number' && typeof p.y === 'number' && typeof p.z === 'number') {
                    return new THREE.Vector3(p.x, p.y, p.z);
                }
            } catch (e) {}
            return null;
        }

        function applyFacingAngle(yawAngle) {
            player.yaw = yawAngle;
            camCtrl.yaw = yawAngle;
            if (player.root) {
                player.root.rotation.y = yawAngle;
            }
            snapCameraToPlayer();
        }

        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;

        function ensureAudioContext() {
            if (!state.soundEnabled) return null;
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.08, slideToFreq = null) {
            const ctx = ensureAudioContext();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideToFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideToFreq), now + duration);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (err) {}
        }

        function sfxJump() { playTone(310, 0.14, 'square', 0.06, 620); }
        function sfxCoin() {
            playTone(880, 0.08, 'sine', 0.08, 1174.66);
            setTimeout(() => playTone(1318.5, 0.12, 'sine', 0.07), 65);
        }
        function sfxCheckpoint() {
            playTone(523.25, 0.09, 'triangle', 0.09, 659.25);
            setTimeout(() => playTone(783.99, 0.14, 'triangle', 0.09, 1046.5), 75);
        }
        function sfxFail() { playTone(220, 0.25, 'sawtooth', 0.08, 95); }

        function startSuspenseMusic() {
            stopSuspenseMusic();
            if (!state.soundEnabled) return;
            ensureAudioContext();
            const bassNotes = [110, 110, 130.81, 123.47, 110, 110, 146.83, 138.59];
            const tensionLead = [440, 0, 466.16, 440, 392, 0, 349.23, 369.99];
            bgmTimer = setInterval(() => {
                if (!state.soundEnabled || state.mode !== 'playing') return;
                const idx = bgmStep % bassNotes.length;
                playTone(bassNotes[idx], 0.13, 'triangle', 0.045);
                if (tensionLead[idx] > 0) playTone(tensionLead[idx], 0.11, 'sawtooth', 0.025);
                if (bgmStep % 2 === 0) playTone(1250, 0.025, 'sine', 0.018);
                bgmStep += 1;
            }, 230);
        }

        function stopSuspenseMusic() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        let toastTimeout = null;
        function showToast(msg, duration = 2000) {
            const banner = document.getElementById('toast-banner');
            const textEl = document.getElementById('toast-text');
            if (!banner || !textEl) return;
            textEl.textContent = msg;
            banner.classList.remove('opacity-0');
            banner.classList.add('opacity-100');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                banner.classList.remove('opacity-100');
                banner.classList.add('opacity-0');
            }, duration);
        }

        function updateHud() {
            document.getElementById('hud-level-text').textContent = String(state.currentLevel);
            document.getElementById('hud-coins-text').textContent = String(state.coins);
            document.getElementById('lobby-max-level').textContent = `${state.maxUnlockedLevel} / ${TOTAL_LEVELS}`;
            document.getElementById('lobby-coins').textContent = String(state.coins);
            const soundBtn = document.getElementById('btn-hud-sound');
            if (soundBtn) soundBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
        }

        function setMode(newMode) {
            state.mode = newMode;
            const lobbyEl = document.getElementById('lobby-screen');
            const hudEl = document.getElementById('hud-layer');
            const joyEl = document.getElementById('dynamic-joy-base');
            if (newMode === 'playing') {
                lobbyEl.classList.add('hidden');
                hudEl.classList.remove('hidden');
                hudEl.classList.add('flex');
                if (state.currentLevel === 1) {
                    applyFacingAngle(LEVEL_1_FACING_YAW);
                } else {
                    snapCameraToPlayer();
                }
                startSuspenseMusic();
            } else {
                lobbyEl.classList.remove('hidden');
                hudEl.classList.add('hidden');
                hudEl.classList.remove('flex');
                if (joyEl) joyEl.style.display = 'none';
                stopSuspenseMusic();
            }
            updateHud();
        }

        function openLevelsModal() {
            const modal = document.getElementById('levels-modal');
            const grid = document.getElementById('levels-grid');
            if (!modal || !grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const unlocked = i <= state.maxUnlockedLevel;
                const isCurrent = i === state.currentLevel;
                const btn = document.createElement('button');
                btn.className = `roblox-btn py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border ${
                    !unlocked
                        ? 'bg-slate-800/50 text-slate-500 border-white/5 cursor-not-allowed'
                        : isCurrent
                            ? 'bg-amber-400 text-slate-950 border-amber-200'
                            : 'bg-sky-500/90 hover:bg-sky-400 text-slate-950 border-white/20'
                }`;
                btn.textContent = unlocked ? `${i}` : `🔒${i}`;
                btn.disabled = !unlocked;
                btn.addEventListener('click', () => {
                    if (!unlocked) return;
                    state.currentLevel = i;
                    saveState();
                    teleportToStageProgress(i);
                    closeLevelsModal();
                    setMode('playing');
                    showToast(`Etapa ${i} seleccionada`);
                });
                grid.appendChild(btn);
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLevelsModal() {
            const modal = document.getElementById('levels-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        let scene, camera, renderer, clock;
        let mapGroup, entitiesGroup, sceneryGroup, environmentGroup;
        let lavaSeaMesh, lavaSeaMat, customLavaModel, customLavaOffsetY = 0;
        let mapLoaded = false;
        let mapMeshes = [];
        let mapBox = null;
        let lavaFloorY = -5.5;
        let level1Spawn = new THREE.Vector3(LEVEL_1_FIXED_SPAWN.x, LEVEL_1_FIXED_SPAWN.y, LEVEL_1_FIXED_SPAWN.z);
        let currentSpawn = new THREE.Vector3(LEVEL_1_FIXED_SPAWN.x, LEVEL_1_FIXED_SPAWN.y, LEVEL_1_FIXED_SPAWN.z);

        const raycaster = new THREE.Raycaster();
        const downDir = new THREE.Vector3(0, -1, 0);

        const coins = [];
        const checkpoints = [];
        const lavaSplashes = [];
        const skyClouds = [];
        const ambientDragons = [];
        const studTextureCache = new Map();

        const player = {
            root: null,
            visualPivot: null,
            fallbackGroup: null,
            customModel: null,
            baseScale: AMY_DIRECT_SCALE,
            mixer: null,
            actions: { idle: null, run: null, jump: null },
            activeAnimKey: null,
            hasCustomModel: false,
            boneNames: new Set(),
            leftLeg: null,
            rightLeg: null,
            leftArm: null,
            rightArm: null,
            pos: new THREE.Vector3(LEVEL_1_FIXED_SPAWN.x, LEVEL_1_FIXED_SPAWN.y, LEVEL_1_FIXED_SPAWN.z),
            vel: new THREE.Vector3(0, 0, 0),
            yaw: LEVEL_1_FACING_YAW,
            onGround: false,
            jumpsUsed: 0,
            maxJumps: 2,
            walkCycle: 0,
            animBlend: 0
        };

        const camCtrl = { yaw: LEVEL_1_FACING_YAW, pitch: 0.22, distance: 8.2 };

        function computeCameraDesiredPos(target) {
            const horizDist = Math.cos(camCtrl.pitch) * camCtrl.distance;
            const vertDist = Math.sin(camCtrl.pitch) * camCtrl.distance;
            const desiredPos = new THREE.Vector3(
                target.x + Math.sin(camCtrl.yaw) * horizDist,
                target.y + vertDist,
                target.z + Math.cos(camCtrl.yaw) * horizDist
            );
            if (mapLoaded && mapMeshes.length > 0 && camCtrl.pitch >= 0) {
                const dir = desiredPos.clone().sub(target);
                const maxDist = dir.length();
                if (maxDist > 0.5) {
                    dir.normalize();
                    const camRay = new THREE.Raycaster(target, dir, 0.3, maxDist);
                    const hits = camRay.intersectObjects(mapMeshes, true);
                    if (hits.length > 0) {
                        const safeDist = Math.max(MIN_CAM_DIST, Math.min(camCtrl.distance, hits[0].distance - 0.85));
                        desiredPos.copy(target).addScaledVector(dir, safeDist);
                    }
                }
            }
            return desiredPos;
        }

        function snapCameraToPlayer() {
            if (!camera || !player.pos) return;
            const target = new THREE.Vector3(player.pos.x, player.pos.y + 1.5, player.pos.z);
            camera.position.copy(computeCameraDesiredPos(target));
            camera.lookAt(target);
        }

        function getStuddedMaterial(hexColor, roughness = 0.55) {
            const key = `${hexColor}_${roughness}`;
            let tex = studTextureCache.get(key);
            if (!tex) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const base = new THREE.Color(hexColor);
                const r = Math.round(base.r * 255);
                const g = Math.round(base.g * 255);
                const b = Math.round(base.b * 255);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.22)';
                ctx.lineWidth = 4;
                ctx.strokeRect(2, 2, 124, 124);
                const coords = [32, 96];
                for (const cx of coords) {
                    for (const cy of coords) {
                        ctx.beginPath();
                        ctx.arc(cx, cy, 13, 0, Math.PI * 2);
                        ctx.fillStyle = `rgb(${Math.min(255, r + 28)},${Math.min(255, g + 28)},${Math.min(255, b + 28)})`;
                        ctx.fill();
                        ctx.lineWidth = 2.5;
                        ctx.strokeStyle = 'rgba(15, 23, 42, 0.28)';
                        ctx.stroke();
                    }
                }
                tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.encoding = THREE.sRGBEncoding;
                studTextureCache.set(key, tex);
            }
            const mat = new THREE.MeshStandardMaterial({ map: tex.clone(), roughness, metalness: 0.08 });
            mat.map.needsUpdate = true;
            return mat;
        }

        function createGreyishCloudCluster(x, y, z, scale = 1, tintHex = 0x94a3b8) {
            const cloud = new THREE.Group();
            const mainMat = new THREE.MeshStandardMaterial({
                color: tintHex,
                emissive: 0x475569,
                emissiveIntensity: 0.18,
                roughness: 0.92,
                metalness: 0.04,
                transparent: true,
                opacity: 0.84,
                flatShading: true
            });
            const underMat = new THREE.MeshStandardMaterial({
                color: 0x64748b,
                emissive: 0x9a3412,
                emissiveIntensity: 0.14,
                roughness: 0.95,
                transparent: true,
                opacity: 0.86,
                flatShading: true
            });

            const puffs = [
                { px: 0, py: 0.2, pz: 0, sx: 11.5, sy: 2.8, sz: 6.2, mat: mainMat },
                { px: -5.2, py: -0.2, pz: 0.8, sx: 7.4, sy: 2.2, sz: 5.0, mat: mainMat },
                { px: 5.6, py: -0.1, pz: -0.6, sx: 7.8, sy: 2.4, sz: 5.2, mat: mainMat },
                { px: 0.4, py: -1.1, pz: 0.2, sx: 13.0, sy: 1.4, sz: 6.8, mat: underMat }
            ];
            for (const p of puffs) {
                const part = new THREE.Mesh(new THREE.BoxGeometry(p.sx, p.sy, p.sz), p.mat);
                part.position.set(p.px, p.py, p.pz);
                cloud.add(part);
            }

            cloud.position.set(x, y, z);
            cloud.scale.setScalar(scale);
            return cloud;
        }

        function buildDistantDuskClouds() {
            if (!environmentGroup) return;
            const toRemove = [];
            environmentGroup.traverse((obj) => {
                if (obj.userData && obj.userData.isSkyCloud) toRemove.push(obj);
            });
            for (const obj of toRemove) {
                if (obj.parent) obj.parent.remove(obj);
            }
            skyClouds.length = 0;

            const cloudTints = [0x94a3b8, 0x78716c, 0x8b95a5, 0xa1a1aa, 0x6b7280];
            const totalClouds = 28;

            for (let i = 0; i < totalClouds; i++) {
                const angle = (i / totalClouds) * Math.PI * 2 + (i % 3) * 0.14;
                const radius = 148 + (i % 4) * 32;
                const cx = Math.cos(angle) * radius;
                const cz = Math.sin(angle) * radius;
                const cy = Math.max(14, lavaFloorY + 18 + (i % 5) * 9);

                const scale = 1.2 + (i % 4) * 0.38;
                const cloud = createGreyishCloudCluster(cx, cy, cz, scale, cloudTints[i % cloudTints.length]);
                cloud.userData.isSkyCloud = true;
                cloud.rotation.y = -angle + Math.PI / 2;
                environmentGroup.add(cloud);

                skyClouds.push({
                    mesh: cloud,
                    angle,
                    radius,
                    baseY: cy,
                    speed: 0.010 + (i % 3) * 0.004,
                    phase: i * 0.9
                });
            }
        }

        function createWingFlapParts(dragonModel) {
            const leftWingParts = [];
            const rightWingParts = [];
            const box = new THREE.Box3().setFromObject(dragonModel);
            const center = new THREE.Vector3();
            const size = new THREE.Vector3();
            box.getCenter(center);
            box.getSize(size);

            dragonModel.traverse((child) => {
                const n = (child.name || '').toLowerCase();
                if (n.includes('wing_l') || n.includes('leftwing') || n.includes('wing.l') || n.includes('ala_izq')) {
                    leftWingParts.push(child);
                } else if (n.includes('wing_r') || n.includes('rightwing') || n.includes('wing.r') || n.includes('ala_der')) {
                    rightWingParts.push(child);
                } else if (child.isMesh) {
                    const worldPos = new THREE.Vector3();
                    child.getWorldPosition(worldPos);
                    const relX = worldPos.x - center.x;
                    const relY = worldPos.y - center.y;
                    if (Math.abs(relX) > size.x * 0.18 && relY > -size.y * 0.15) {
                        if (relX < 0) leftWingParts.push(child);
                        else rightWingParts.push(child);
                    }
                }
            });

            return { leftWingParts, rightWingParts };
        }

        function loadAmbientLavaDragons() {
            if (typeof THREE.GLTFLoader !== 'function' || !environmentGroup) return;
            const loader = new THREE.GLTFLoader();
            loader.load(
                LAVA_DRAGON_GLB_URL,
                (gltf) => {
                    if (!gltf || !gltf.scene) return;
                    for (const d of ambientDragons) {
                        if (d.wrapper) environmentGroup.remove(d.wrapper);
                    }
                    ambientDragons.length = 0;

                    const configs = [
                        { radius: 64, baseY: 28, speed: 0.15, phase: 0.0, scale: 1.0, bobAmp: 2.0 },
                        { radius: 88, baseY: 38, speed: -0.11, phase: 2.1, scale: 1.2, bobAmp: 2.5 },
                        { radius: 112, baseY: 22, speed: 0.09, phase: 4.2, scale: 1.1, bobAmp: 2.2 }
                    ];

                    configs.forEach((cfg, idx) => {
                        const wrapper = new THREE.Group();
                        wrapper.userData.isAmbientDragon = true;
                        const bodyPivot = new THREE.Group();
                        const clone = gltf.scene.clone(true);

                        clone.traverse((child) => {
                            if (child.isMesh || child.isSkinnedMesh) {
                                child.visible = true;
                                child.castShadow = false;
                                child.receiveShadow = false;
                                child.frustumCulled = false;
                                if (child.material) {
                                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach((m) => {
                                        m.visible = true;
                                        m.side = THREE.DoubleSide;
                                        if (m.map) {
                                            m.map.encoding = THREE.sRGBEncoding;
                                            m.needsUpdate = true;
                                        }
                                        if (m.emissive && m.emissive.getHex() === 0x000000) {
                                            m.emissive.setHex(0x9a3412);
                                            m.emissiveIntensity = 0.28;
                                        }
                                        m.needsUpdate = true;
                                    });
                                }
                            }
                        });

                        clone.updateMatrixWorld(true);
                        const box = new THREE.Box3().setFromObject(clone);
                        const size = new THREE.Vector3();
                        const center = new THREE.Vector3();
                        box.getSize(size);
                        box.getCenter(center);
                        const span = Math.max(size.x, size.y, size.z, 1);
                        const normScale = (DRAGON_TARGET_SPAN * cfg.scale) / span;
                        clone.scale.setScalar(normScale);
                        clone.position.set(-center.x * normScale, -center.y * normScale, -center.z * normScale);
                        clone.rotation.y = Math.PI / 2;

                        bodyPivot.add(clone);
                        wrapper.add(bodyPivot);
                        environmentGroup.add(wrapper);

                        let mixer = null;
                        if (Array.isArray(gltf.animations) && gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(clone);
                            const action = mixer.clipAction(gltf.animations[0]);
                            action.setLoop(THREE.LoopRepeat, Infinity);
                            action.play();
                        }

                        const wingParts = createWingFlapParts(clone);
                        ambientDragons.push({
                            wrapper,
                            bodyPivot,
                            clone,
                            mixer,
                            wingParts,
                            angle: cfg.phase,
                            radius: cfg.radius,
                            baseY: cfg.baseY,
                            speed: cfg.speed,
                            phase: cfg.phase,
                            bobAmp: cfg.bobAmp
                        });
                    });
                },
                undefined,
                (err) => {
                    console.warn('No se pudo cargar lava_dragon.glb:', err);
                }
            );
        }

        function createLiquidLavaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, '#ea580c');
            grad.addColorStop(0.5, '#f97316');
            grad.addColorStop(1, '#dc2626');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                const yBase = (i / 18) * 256;
                for (let x = 0; x <= 256; x += 16) {
                    const y = yBase + Math.sin((x / 256) * Math.PI * 4 + i) * 9;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(254, 240, 138, 0.42)' : 'rgba(153, 27, 27, 0.45)';
                ctx.lineWidth = 6;
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(28, 28);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function syncLavaFloorHeight() {
            if (lavaSeaMesh) lavaSeaMesh.position.y = lavaFloorY - 0.35;
            if (customLavaModel) customLavaModel.position.y = lavaFloorY + customLavaOffsetY;
            buildDistantDuskClouds();
        }

        function loadCustomLavaGLB() {
            if (typeof THREE.GLTFLoader !== 'function' || !sceneryGroup) return;
            const loader = new THREE.GLTFLoader();
            loader.load(
                LAVA_FLOOR_GLB_URL,
                (gltf) => {
                    if (!gltf || !gltf.scene) return;
                    if (customLavaModel) sceneryGroup.remove(customLavaModel);
                    const model = gltf.scene;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.visible = true;
                            child.receiveShadow = true;
                            child.frustumCulled = false;
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach((m) => {
                                    m.visible = true;
                                    m.opacity = 1;
                                    m.transparent = false;
                                    m.side = THREE.DoubleSide;
                                    if (m.emissive) {
                                        if (m.emissive.getHex() === 0x000000) m.emissive.setHex(0xea580c);
                                        m.emissiveIntensity = Math.max(m.emissiveIntensity || 0, 0.7);
                                    }
                                    if (m.map) {
                                        m.map.encoding = THREE.sRGBEncoding;
                                        m.needsUpdate = true;
                                    }
                                    if (m.emissiveMap) {
                                        m.emissiveMap.encoding = THREE.sRGBEncoding;
                                        m.needsUpdate = true;
                                    }
                                    m.needsUpdate = true;
                                });
                            }
                        }
                    });
                    model.updateMatrixWorld(true);
                    const box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const span = Math.max(size.x, size.z, 1);
                    model.scale.setScalar(LAVA_FLOOR_SPAN / span);
                    model.updateMatrixWorld(true);
                    const scaledBox = new THREE.Box3().setFromObject(model);
                    const center = new THREE.Vector3();
                    scaledBox.getCenter(center);
                    customLavaOffsetY = -scaledBox.max.y + 0.25;
                    model.position.set(-center.x, lavaFloorY + customLavaOffsetY, -center.z);
                    customLavaModel = model;
                    sceneryGroup.add(customLavaModel);
                },
                undefined,
                (err) => {
                    console.warn('No se pudo cargar lava.glb:', err);
                }
            );
        }

        function buildLavaSea() {
            const lavaTex = createLiquidLavaTexture();
            lavaSeaMat = new THREE.MeshStandardMaterial({
                map: lavaTex,
                emissive: new THREE.Color(0xea580c),
                emissiveMap: lavaTex,
                emissiveIntensity: 0.75,
                roughness: 0.2,
                metalness: 0.1
            });
            const seaGeo = new THREE.PlaneGeometry(LAVA_FLOOR_SPAN, LAVA_FLOOR_SPAN, 24, 24);
            seaGeo.rotateX(-Math.PI / 2);
            lavaSeaMesh = new THREE.Mesh(seaGeo, lavaSeaMat);
            lavaSeaMesh.position.set(0, lavaFloorY - 0.35, 0);
            lavaSeaMesh.visible = false;
            sceneryGroup.add(lavaSeaMesh);
            loadCustomLavaGLB();
        }

        function initLavaSplashPool() {
            const geo = new THREE.SphereGeometry(0.24, 8, 8);
            for (let i = 0; i < 42; i++) {
                const isSpark = i % 3 === 0;
                const mat = new THREE.MeshBasicMaterial({ color: isSpark ? 0xfef08a : 0xf97316 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.visible = false;
                sceneryGroup.add(mesh);
                lavaSplashes.push({ mesh, active: false, vel: new THREE.Vector3(), life: 0 });
            }
        }

        function spawnLavaSplashDroplet(x, y, z) {
            const slot = lavaSplashes.find(s => !s.active);
            if (!slot) return;
            slot.active = true;
            slot.mesh.visible = true;
            slot.mesh.position.set(x, y, z);
            slot.vel.set((Math.random() - 0.5) * 5.0, 6.0 + Math.random() * 7.0, (Math.random() - 0.5) * 5.0);
            slot.life = 0.85 + Math.random() * 0.45;
        }

        function updateLavaSplashes(dt) {
            if (lavaSeaMat && lavaSeaMat.map) {
                lavaSeaMat.map.offset.x += dt * 0.055;
                lavaSeaMat.map.offset.y += dt * 0.04;
            }
            if (customLavaModel) {
                customLavaModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach((m) => {
                            if (m.map) {
                                m.map.offset.x += dt * 0.035;
                                m.map.offset.y += dt * 0.025;
                            }
                            if (m.emissiveMap) {
                                m.emissiveMap.offset.x += dt * 0.035;
                                m.emissiveMap.offset.y += dt * 0.025;
                            }
                        });
                    }
                });
            }
            if (Math.random() < dt * 20 && player.pos) {
                spawnLavaSplashDroplet(
                    player.pos.x + (Math.random() - 0.5) * 40,
                    lavaFloorY + 0.3,
                    player.pos.z + (Math.random() - 0.5) * 40
                );
            }
            for (const s of lavaSplashes) {
                if (!s.active) continue;
                s.life -= dt;
                s.vel.y -= 16.5 * dt;
                s.mesh.position.addScaledVector(s.vel, dt);
                if (s.life <= 0 || s.mesh.position.y < lavaFloorY - 0.5) {
                    s.active = false;
                    s.mesh.visible = false;
                }
            }
        }

        function findSurfaceHeightAt(x, z, startY = 120, preferLowest = false) {
            if (!mapLoaded || mapMeshes.length === 0) return null;
            raycaster.set(new THREE.Vector3(x, startY, z), downDir);
            raycaster.far = 350;
            const hits = raycaster.intersectObjects(mapMeshes, true);
            if (hits.length === 0) return null;
            if (!preferLowest) return hits[0].point.y;
            let lowestY = hits[0].point.y;
            for (const h of hits) {
                if (h.point.y < lowestY) lowestY = h.point.y;
            }
            return lowestY;
        }

        function clearEntities() {
            while (entitiesGroup.children.length > 0) entitiesGroup.remove(entitiesGroup.children[0]);
            coins.length = 0;
            checkpoints.length = 0;
        }

        function addCoin(x, y, z) {
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.55, 0.55, 0.18, 16),
                new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.35, metalness: 0.5, roughness: 0.25 })
            );
            mesh.rotation.x = Math.PI / 2;
            mesh.position.set(x, y, z);
            entitiesGroup.add(mesh);
            coins.push({ mesh, x, y, z, collected: false });
        }

        function addCheckpoint(x, y, z, stageNum) {
            const pad = new THREE.Mesh(
                new THREE.BoxGeometry(2.8, 0.22, 2.8),
                new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, emissiveIntensity: 0.4 })
            );
            pad.position.set(x, y + 0.11, z);
            entitiesGroup.add(pad);
            checkpoints.push({ x, y: y + 0.25, z, stageNum, activated: false, pad });
        }

        function populateMapEntities() {
            clearEntities();
            if (!mapBox) return;
            const spanX = mapBox.max.x - mapBox.min.x;
            const searchTopY = mapBox.max.y + 40;
            const savedSpawn = loadSavedSpawn();

            const fixedSpawn = new THREE.Vector3(
                LEVEL_1_FIXED_SPAWN.x,
                LEVEL_1_FIXED_SPAWN.y,
                LEVEL_1_FIXED_SPAWN.z
            );
            const bestStart = savedSpawn || fixedSpawn;

            level1Spawn.copy(bestStart);
            currentSpawn.copy(level1Spawn);
            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;
            if (player.root) player.root.position.copy(player.pos);
            applyFacingAngle(LEVEL_1_FACING_YAW);

            let nextStageNumber = 2;
            for (let step = 1; step <= 20; step++) {
                const frac = step / 21;
                const px = THREE.MathUtils.lerp(bestStart.x, Math.sin(step * 1.1) * (spanX * 0.24), frac);
                const pz = THREE.MathUtils.lerp(bestStart.z, mapBox.min.z * 0.72, frac);
                const surfY = findSurfaceHeightAt(px, pz, searchTopY, false);
                if (typeof surfY === 'number') {
                    addCoin(px, surfY + 1.2, pz);
                    if (step % 3 === 0 && nextStageNumber <= TOTAL_LEVELS) {
                        addCheckpoint(px, surfY, pz, nextStageNumber);
                        nextStageNumber += 1;
                    }
                }
            }
        }

        function teleportToStageProgress(stageNum) {
            if (!mapLoaded || !mapBox) return;
            if (stageNum <= 1) {
                currentSpawn.copy(level1Spawn);
                player.pos.copy(currentSpawn);
                player.vel.set(0, 0, 0);
                player.jumpsUsed = 0;
                if (player.root) player.root.position.copy(player.pos);
                applyFacingAngle(LEVEL_1_FACING_YAW);
                return;
            }
            const frac = Math.max(0, Math.min(1, (stageNum - 1) / (TOTAL_LEVELS - 1)));
            const spanX = mapBox.max.x - mapBox.min.x;
            const targetX = Math.sin(stageNum * 0.85) * (spanX * 0.22);
            const targetZ = THREE.MathUtils.lerp(level1Spawn.z, mapBox.min.z * 0.75, frac);
            const surfY = findSurfaceHeightAt(targetX, targetZ, mapBox.max.y + 40, false);
            const destY = typeof surfY === 'number' ? surfY + 0.35 : level1Spawn.y;
            currentSpawn.set(targetX, destY, targetZ);
            player.pos.copy(currentSpawn);
            player.vel.set(0, 0, 0);
            player.jumpsUsed = 0;
            if (player.root) player.root.position.copy(player.pos);
            snapCameraToPlayer();
        }

        function loadMainObbyMapGLB() {
            if (typeof THREE.GLTFLoader !== 'function') {
                showToast('Error: GLTFLoader no disponible', 2200);
                return;
            }
            const loader = new THREE.GLTFLoader();
            loader.load(
                MAP_GLB_URL,
                (gltf) => {
                    if (!gltf || !gltf.scene || !mapGroup) return;
                    while (mapGroup.children.length > 0) mapGroup.remove(mapGroup.children[0]);
                    mapMeshes = [];

                    const model = gltf.scene;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.side = THREE.DoubleSide;
                                if (child.material.map) {
                                    child.material.map.encoding = THREE.sRGBEncoding;
                                    child.material.needsUpdate = true;
                                }
                            }
                            mapMeshes.push(child);
                        }
                    });

                    model.updateMatrixWorld(true);
                    let box = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.z, 1);
                    model.scale.setScalar(MAP_TARGET_SPAN / maxDim);

                    model.updateMatrixWorld(true);
                    box = new THREE.Box3().setFromObject(model);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    model.position.x -= center.x;
                    model.position.z -= center.z;
                    model.position.y -= box.min.y;

                    model.updateMatrixWorld(true);
                    mapBox = new THREE.Box3().setFromObject(model);
                    lavaFloorY = Math.max(-10, mapBox.min.y - 4.5);
                    syncLavaFloorHeight();

                    mapGroup.add(model);
                    mapLoaded = true;
                    populateMapEntities();
                },
                undefined,
                (err) => {
                    console.warn('Error cargando mapa GLB:', err);
                    showToast('No se pudo cargar el mapa .glb', 2200);
                }
            );
        }

        function sanitizeAnimationClipForModel(clip) {
            if (!clip || !Array.isArray(clip.tracks)) return clip;
            const cloned = clip.clone();
            const validTracks = [];
            for (const track of cloned.tracks) {
                if (track.name.endsWith('.scale')) continue;
                const dotIdx = track.name.indexOf('.');
                if (dotIdx === -1) {
                    validTracks.push(track);
                    continue;
                }
                const nodePath = track.name.slice(0, dotIdx);
                const prop = track.name.slice(dotIdx);
                const rawName = nodePath.split('|').pop().split(':').pop().toLowerCase();

                const isRootOrHips =
                    rawName === 'armature' ||
                    rawName === 'root' ||
                    rawName === 'rootnode' ||
                    rawName.includes('hips');

                if (isRootOrHips && (prop === '.quaternion' || prop === '.position')) {
                    continue;
                }

                if (player.boneNames.size === 0 || player.boneNames.has(rawName) || player.boneNames.has(nodePath)) {
                    validTracks.push(track);
                }
            }
            if (validTracks.length > 0) {
                cloned.tracks = validTracks;
                cloned.resetDuration();
                return cloned;
            }
            return clip;
        }

        function loadExternalAnimationClip(url, key, loopMode = THREE.LoopRepeat) {
            if (!player.mixer || typeof THREE.GLTFLoader !== 'function') return;
            const loader = new THREE.GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    if (!gltf || !Array.isArray(gltf.animations) || gltf.animations.length === 0) return;
                    try {
                        const cleanClip = sanitizeAnimationClipForModel(gltf.animations[0]);
                        const action = player.mixer.clipAction(cleanClip);
                        action.setLoop(loopMode, Infinity);
                        if (loopMode === THREE.LoopOnce) action.clampWhenFinished = true;
                        player.actions[key] = action;
                        if (key === 'idle' && !player.activeAnimKey && Math.hypot(player.vel.x, player.vel.z) <= 0.35 && player.onGround) {
                            setPlayerAnimation('idle');
                        }
                    } catch (err) {
                        console.warn(`No se pudo enlazar animación ${key} desde ${url}:`, err);
                    }
                },
                undefined,
                () => {
                    console.warn(`Archivo de animación no encontrado o inválido: ${url}`);
                }
            );
        }

        function setPlayerAnimation(nextKey, forceRestart = false) {
            if (!player.mixer || !player.hasCustomModel) return;
            const nextAction = player.actions[nextKey];
            if (!nextAction) return;
            if (!forceRestart && player.activeAnimKey === nextKey && nextAction.isRunning()) return;
            const prevAction = player.activeAnimKey ? player.actions[player.activeAnimKey] : null;
            nextAction.reset();
            nextAction.setEffectiveTimeScale(1);
            nextAction.setEffectiveWeight(1);
            nextAction.play();
            if (prevAction && prevAction !== nextAction) {
                prevAction.crossFadeTo(nextAction, 0.14, true);
            }
            player.activeAnimKey = nextKey;
        }

        function loadAmyPlayerGLB() {
            if (typeof THREE.GLTFLoader !== 'function') return;

            const loader = new THREE.GLTFLoader();
            loader.load(
                PLAYER_GLB_URL,
                (gltf) => {
                    if (!gltf || !gltf.scene || !player.visualPivot) return;

                    const model = gltf.scene;
                    let meshCount = 0;
                    player.boneNames.clear();

                    const amyFallbackMat = new THREE.MeshStandardMaterial({
                        color: 0xf472b6,
                        emissive: 0xdb2777,
                        emissiveIntensity: 0.25,
                        roughness: 0.35,
                        metalness: 0.08,
                        side: THREE.DoubleSide
                    });

                    model.traverse((child) => {
                        child.visible = true;
                        if (child.name) {
                            player.boneNames.add(child.name);
                            player.boneNames.add(child.name.split('|').pop().split(':').pop());
                        }
                        if (child.isMesh || child.isSkinnedMesh) {
                            meshCount += 1;
                            child.visible = true;
                            child.castShadow = true;
                            child.receiveShadow = true;
                            child.frustumCulled = false;

                            const hasValidTexture = Boolean(
                                child.material &&
                                (Array.isArray(child.material)
                                    ? child.material.some(m => m && m.map)
                                    : child.material.map)
                            );

                            if (!child.material || !hasValidTexture) {
                                child.material = amyFallbackMat;
                            } else {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach((m) => {
                                    m.visible = true;
                                    m.opacity = 1;
                                    m.transparent = false;
                                    m.side = THREE.DoubleSide;
                                    if (m.map) {
                                        m.map.encoding = THREE.sRGBEncoding;
                                        m.needsUpdate = true;
                                    }
                                    m.needsUpdate = true;
                                });
                            }
                        }
                    });

                    if (meshCount === 0) return;

                    model.position.set(0, 0, 0);
                    model.rotation.set(0, Math.PI, 0);
                    model.scale.setScalar(AMY_DIRECT_SCALE);
                    model.updateMatrixWorld(true);

                    player.baseScale = AMY_DIRECT_SCALE;
                    if (player.customModel) player.visualPivot.remove(player.customModel);

                    player.customModel = model;
                    player.hasCustomModel = true;
                    player.visualPivot.add(model);

                    if (player.fallbackGroup) {
                        player.fallbackGroup.visible = false;
                        player.fallbackGroup.traverse(c => { c.visible = false; });
                    }

                    player.mixer = new THREE.AnimationMixer(model);

                    if (USE_STOP_WALKING_GLB) {
                        loadExternalAnimationClip(ANIM_IDLE_GLB_URL, 'idle', THREE.LoopRepeat);
                    }
                    loadExternalAnimationClip(ANIM_RUN_GLB_URL, 'run', THREE.LoopRepeat);
                    loadExternalAnimationClip(ANIM_JUMP_GLB_URL, 'jump', THREE.LoopRepeat);
                },
                undefined,
                (err) => {
                    console.warn('No se pudo cargar Amy.glb:', err);
                    if (player.fallbackGroup) {
                        player.fallbackGroup.visible = true;
                        player.fallbackGroup.traverse(c => { c.visible = true; });
                        player.fallbackGroup.scale.setScalar(AMY_DIRECT_SCALE);
                    }
                }
            );
        }
