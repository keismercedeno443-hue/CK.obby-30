<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obby 3D - 30 Niveles Largos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="handleThreeFallback()"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #joystick-zone {
            position: fixed;
            left: 24px;
            bottom: 24px;
            width: 132px;
            height: 132px;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
            z-index: 20;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 54px;
            height: 54px;
            margin-left: -27px;
            margin-top: -27px;
            border-radius: 9999px;
            background: linear-gradient(145deg, #38bdf8, #2563eb);
            border: 2px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.55);
            pointer-events: none;
        }
        #jump-btn {
            position: fixed;
            right: 28px;
            bottom: 28px;
            width: 88px;
            height: 88px;
            border-radius: 9999px;
            background: linear-gradient(145deg, #fbbf24, #d97706);
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.5);
            z-index: 20;
            touch-action: none;
        }
        #jump-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body>
    <!-- Lienzo principal 3D -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD Superior del Juego -->
    <div id="game-hud" class="hidden fixed top-3 left-3 right-3 z-20 flex items-center justify-between gap-2 pointer-events-none">
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="btn-hud-back" title="Volver al Lobby" class="bg-slate-900/85 hover:bg-slate-800 text-white w-9 h-9 rounded-full border border-white/15 text-sm font-black shadow-lg active:scale-95 transition flex items-center justify-center">
                ✕
            </button>
            <div class="bg-slate-900/80 text-white px-3.5 py-2 rounded-2xl border border-white/15 backdrop-blur-md shadow-lg">
                <span class="text-xs uppercase tracking-wider text-sky-300 font-bold">Nivel</span>
                <span id="hud-level" class="text-base font-black ml-1">1 / 30</span>
            </div>
            <div class="bg-slate-900/80 text-amber-300 px-3.5 py-2 rounded-2xl border border-white/15 backdrop-blur-md shadow-lg font-extrabold text-sm">
                🪙 <span id="hud-coins">0</span>
            </div>
            <div class="hidden sm:flex bg-slate-900/80 text-emerald-300 px-3 py-2 rounded-2xl border border-white/15 backdrop-blur-md shadow-lg font-bold text-xs">
                Meta: <span id="hud-distance" class="ml-1 font-black">0m</span>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="btn-hud-levels" class="bg-slate-900/85 hover:bg-slate-800 text-white px-3 py-2 rounded-2xl border border-white/15 text-xs font-extrabold shadow-lg active:scale-95 transition">
                Niveles
            </button>
            <button id="btn-hud-sound" class="bg-slate-900/85 hover:bg-slate-800 text-white px-3 py-2 rounded-2xl border border-white/15 text-xs font-extrabold shadow-lg active:scale-95 transition">
                🔊
            </button>
            <button id="btn-hud-lobby" class="bg-rose-600/90 hover:bg-rose-500 text-white px-3 py-2 rounded-2xl border border-white/20 text-xs font-extrabold shadow-lg active:scale-95 transition">
                Lobby
            </button>
        </div>
    </div>

    <!-- Mensaje flotante en pantalla -->
    <div id="toast-banner" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 text-white px-4 py-2 rounded-2xl border border-sky-400/40 text-xs sm:text-sm font-bold shadow-xl pointer-events-none text-center max-w-[90vw]">
    </div>

    <!-- Controles táctiles para móvil -->
    <div id="joystick-zone" class="hidden">
        <div id="joystick-knob"></div>
    </div>
    <button id="jump-btn" class="hidden flex flex-col items-center justify-center text-slate-950 font-black">
        <span class="text-xl leading-none">▲</span>
        <span class="text-[11px] tracking-wide mt-0.5">SALTAR</span>
    </button>

    <!-- Lobby Principal -->
    <div id="lobby-screen" class="fixed inset-0 z-30 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm">
        <div class="w-full max-w-md bg-slate-900/95 border border-white/15 rounded-3xl p-6 text-white shadow-2xl">
            <div class="text-center mb-5">
                <span class="inline-block px-3 py-1 rounded-full bg-sky-500/20 border border-sky-400/40 text-sky-300 text-xs font-extrabold uppercase tracking-wider mb-2">
                    30 Niveles Largos 3D
                </span>
                <h1 class="text-3xl font-black tracking-tight">Obby 3D</h1>
                <p class="text-slate-300 text-xs sm:text-sm mt-1">
                    Recorridos largos de 12 a 16 etapas: caminos angostos, escaleras, lava 3D, rodillos y portales.
                </p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3 text-center">
                    <div class="text-[11px] uppercase text-slate-400 font-bold">Nivel Actual</div>
                    <div id="lobby-unlocked" class="text-xl font-black text-sky-400 mt-0.5">1 / 30</div>
                </div>
                <div class="bg-slate-800/90 border border-white/10 rounded-2xl p-3 text-center">
                    <div class="text-[11px] uppercase text-slate-400 font-bold">Monedas</div>
                    <div id="lobby-coins" class="text-xl font-black text-amber-400 mt-0.5">🪙 0</div>
                </div>
            </div>

            <div class="space-y-2.5">
                <button id="btn-play" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-base shadow-lg active:scale-[0.99] transition">
                    ▶ Jugar
                </button>
                <button id="btn-select-level" class="w-full py-3 rounded-2xl bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-400 hover:to-blue-500 text-white font-extrabold text-sm shadow-lg active:scale-[0.99] transition">
                    🗺️ Elegir Nivel
                </button>
                <button id="btn-toggle-sound" class="w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-slate-100 font-bold text-sm active:scale-[0.99] transition">
                    🔊 Sonido y Música: Activado
                </button>
            </div>
        </div>
    </div>

    <!-- Selector de Niveles -->
    <div id="level-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-slate-900 border border-white/15 rounded-3xl p-5 text-white shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-black">Seleccionar Nivel (1 - 30)</h2>
                <button id="btn-close-levels" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold">
                    Cerrar
                </button>
            </div>
            <div id="levels-grid" class="grid grid-cols-5 gap-2 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <script>
        // =========================================================================
        // RESPUESTA DE RESPALDO DE THREE.JS CDN
        // =========================================================================
        function handleThreeFallback() {
            const s = document.createElement('script');
            s.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
            document.head.appendChild(s);
        }

        // =========================================================================
        // ESTADO GLOBAL Y PERSISTENCIA
        // =========================================================================
        const TOTAL_LEVELS = 30;
        const STORAGE_KEY = 'obby3d_estado_limpio_v1';

        const state = {
            mode: 'lobby', // 'lobby' | 'playing'
            currentLevel: 1,
            unlockedLevel: 1,
            coins: 0,
            soundEnabled: true
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (typeof parsed.currentLevel === 'number') {
                    state.currentLevel = Math.min(TOTAL_LEVELS, Math.max(1, parsed.currentLevel));
                }
                if (typeof parsed.unlockedLevel === 'number') {
                    state.unlockedLevel = Math.min(TOTAL_LEVELS, Math.max(1, parsed.unlockedLevel));
                }
                if (typeof parsed.coins === 'number') {
                    state.coins = Math.max(0, Math.floor(parsed.coins));
                }
                if (typeof parsed.soundEnabled === 'boolean') {
                    state.soundEnabled = parsed.soundEnabled;
                }
            } catch (e) {
                console.warn('Error cargando estado:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    currentLevel: state.currentLevel,
                    unlockedLevel: state.unlockedLevel,
                    coins: state.coins,
                    soundEnabled: state.soundEnabled
                }));
            } catch (e) {
                console.warn('Error guardando estado:', e);
            }
        }

        let toastTimeout = null;
        function showToast(msg, duration = 2200) {
            const el = document.getElementById('toast-banner');
            if (!el) return;
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.add('hidden');
            }, duration);
        }

        // =========================================================================
        // AUDIO Y MÚSICA PROCEDURAL (WEB AUDIO API)
        // =========================================================================
        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;
        const melodyNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 349.23];
        const bassNotes = [130.81, 130.81, 196.00, 196.00, 146.83, 146.83, 174.61, 196.00];

        function getAudioCtx() {
            if (!state.soundEnabled) return null;
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) audioCtx = new Ctx();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            } catch (e) {
                return null;
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.08, endFreq = null) {
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (endFreq !== null) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
                }
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (e) {
                // Ignorar restricciones de audio del navegador
            }
        }

        function sfxJump() { playTone(230, 0.16, 'triangle', 0.11, 520); }
        function sfxCoin() { playTone(784, 0.09, 'sine', 0.09, 1046.5); }
        function sfxCheckpoint() { playTone(440, 0.11, 'sine', 0.09, 659.25); }
        function sfxPortal() {
            playTone(523.25, 0.14, 'triangle', 0.11, 783.99);
            setTimeout(() => playTone(783.99, 0.22, 'triangle', 0.11, 1046.5), 110);
        }
        function sfxLava() { playTone(190, 0.24, 'sawtooth', 0.09, 75); }

        function startBgm() {
            if (bgmTimer) return;
            bgmTimer = setInterval(() => {
                if (!state.soundEnabled || state.mode !== 'playing') return;
                const idx = bgmStep % melodyNotes.length;
                bgmStep += 1;
                playTone(melodyNotes[idx], 0.22, 'triangle', 0.045);
                if (idx % 2 === 0) {
                    playTone(bassNotes[idx], 0.32, 'sine', 0.045);
                }
            }, 340);
        }

        ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
            window.addEventListener(evt, () => {
                getAudioCtx();
                if (state.soundEnabled) startBgm();
            }, { passive: true });
        });

        // =========================================================================
        // MOTOR THREE.JS, PERSONAJE Y NIVELES DE 12 A 16 ETAPAS
        // =========================================================================
        let scene, camera, renderer;
        let levelGroup, wallGroup;
        let playerGroup, headMesh, torsoMesh, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot;

        const platforms = [];
        const ladders = [];
        const lavaZones = [];
        const coins = [];
        const spinners = [];
        const checkpoints = [];
        const wallMeshes = [];
        let lavaFloorMesh = null;
        let lavaCrustMesh = null;
        let portalMesh = null;
        let portalPos = null;

        const player = {
            pos: null,
            vel: null,
            spawn: null,
            radius: 0.42,
            height: 1.85,
            onGround: false,
            yaw: 0,
            walkCycle: 0
        };

        const camCtrl = {
            yaw: 0,
            pitch: 0.34,
            distance: 9.5,
            minDist: 4.5,
            maxDist: 18.0
        };

        function createRobloxFaceTexture() {
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const g = c.getContext('2d');
            g.fillStyle = '#fde047';
            g.fillRect(0, 0, 128, 128);
            g.fillStyle = '#0f172a';
            g.beginPath();
            g.ellipse(42, 54, 8, 12, 0, 0, Math.PI * 2);
            g.ellipse(86, 54, 8, 12, 0, 0, Math.PI * 2);
            g.fill();
            g.fillStyle = '#ffffff';
            g.beginPath();
            g.arc(44, 50, 3, 0, Math.PI * 2);
            g.arc(88, 50, 3, 0, Math.PI * 2);
            g.fill();
            g.strokeStyle = '#0f172a';
            g.lineWidth = 6;
            g.lineCap = 'round';
            g.beginPath();
            g.arc(64, 72, 22, 0.15 * Math.PI, 0.85 * Math.PI);
            g.stroke();
            const tex = new THREE.CanvasTexture(c);
            tex.needsUpdate = true;
            return tex;
        }

        function createLavaTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const g = c.getContext('2d');

            const grad = g.createRadialGradient(256, 256, 30, 256, 256, 340);
            grad.addColorStop(0, '#fef08a');
            grad.addColorStop(0.28, '#f97316');
            grad.addColorStop(0.68, '#dc2626');
            grad.addColorStop(1, '#450a0a');
            g.fillStyle = grad;
            g.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 42; i++) {
                const bx = ((i * 97) % 480) + 16;
                const by = ((i * 151) % 480) + 16;
                const br = 12 + (i % 5) * 8;
                const bGrad = g.createRadialGradient(bx, by, 2, bx, by, br);
                bGrad.addColorStop(0, 'rgba(254, 249, 195, 0.85)');
                bGrad.addColorStop(0.55, 'rgba(251, 146, 60, 0.55)');
                bGrad.addColorStop(1, 'rgba(153, 27, 27, 0)');
                g.fillStyle = bGrad;
                g.beginPath();
                g.arc(bx, by, br, 0, Math.PI * 2);
                g.fill();
            }

            g.strokeStyle = 'rgba(255, 237, 213, 0.35)';
            g.lineWidth = 4;
            for (let k = 0; k < 14; k++) {
                const sx = ((k * 73) % 460) + 20;
                const sy = ((k * 113) % 460) + 20;
                g.beginPath();
                g.moveTo(sx, sy);
                g.bezierCurveTo(sx + 28, sy - 18, sx + 45, sy + 24, sx + 76, sy + 6);
                g.stroke();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(18, 18);
            tex.needsUpdate = true;
            return tex;
        }

        function buildRobloxPlayer() {
            playerGroup = new THREE.Group();

            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.45 });
            torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.05, 0.52), torsoMat);
            torsoMesh.position.y = 1.25;
            torsoMesh.castShadow = true;
            playerGroup.add(torsoMesh);

            const faceTex = createRobloxFaceTexture();
            const headMats = [
                new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.35 }),
                new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 })
            ];
            headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.68, 0.68), headMats);
            headMesh.position.y = 2.13;
            headMesh.castShadow = true;
            playerGroup.add(headMesh);

            const limbMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.45 });
            const legMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.5 });

            leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.68, 1.72, 0);
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.98, 0.36), limbMat);
            lArm.position.y = -0.42;
            lArm.castShadow = true;
            leftArmPivot.add(lArm);
            playerGroup.add(leftArmPivot);

            rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.68, 1.72, 0);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.98, 0.36), limbMat);
            rArm.position.y = -0.42;
            rArm.castShadow = true;
            rightArmPivot.add(rArm);
            playerGroup.add(rightArmPivot);

            leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(-0.24, 0.72, 0);
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.42), legMat);
            lLeg.position.y = -0.36;
            lLeg.castShadow = true;
            leftLegPivot.add(lLeg);
            playerGroup.add(leftLegPivot);

            rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.24, 0.72, 0);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.42), legMat);
            rLeg.position.y = -0.36;
            rLeg.castShadow = true;
            rightLegPivot.add(rLeg);
            playerGroup.add(rightLegPivot);

            scene.add(playerGroup);
        }

        function initThree() {
            const canvas = document.getElementById('game-canvas');
            if (!canvas || typeof THREE === 'undefined') return false;

            player.pos = new THREE.Vector3(0, 0.1, 0);
            player.vel = new THREE.Vector3(0, 0, 0);
            player.spawn = new THREE.Vector3(0, 0.1, 0);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1224);
            scene.fog = new THREE.FogExp2(0x0b1224, 0.0085);

            camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 320);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 0.95);
            hemiLight.position.set(0, 60, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
            dirLight.position.set(28, 48, 22);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 5;
            dirLight.shadow.camera.far = 160;
            const d = 45;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            levelGroup = new THREE.Group();
            wallGroup = new THREE.Group();
            scene.add(levelGroup);
            scene.add(wallGroup);

            buildRobloxPlayer();

            window.addEventListener('resize', () => {
                if (!camera || !renderer) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            return true;
        }

        function clearLevel() {
            if (!scene) return;
            if (levelGroup) scene.remove(levelGroup);
            if (wallGroup) scene.remove(wallGroup);

            levelGroup = new THREE.Group();
            wallGroup = new THREE.Group();
            scene.add(levelGroup);
            scene.add(wallGroup);

            platforms.length = 0;
            ladders.length = 0;
            lavaZones.length = 0;
            coins.length = 0;
            spinners.length = 0;
            checkpoints.length = 0;
            wallMeshes.length = 0;
            lavaFloorMesh = null;
            lavaCrustMesh = null;
            portalMesh = null;
            portalPos = null;
        }

        function addPlatform(x, y, z, w, h, d, color = 0x3b82f6, options = {}) {
            const mat = new THREE.MeshStandardMaterial({
                color,
                roughness: options.roughness ?? 0.45,
                metalness: options.metalness ?? 0.08
            });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            levelGroup.add(mesh);

            const plat = {
                mesh,
                x, y, z, w, h, d,
                baseX: x, baseY: y, baseZ: z,
                moveAxis: options.moveAxis || null,
                moveAmp: options.moveAmp || 0,
                moveSpeed: options.moveSpeed || 1.5,
                phase: options.phase || 0,
                dx: 0, dy: 0, dz: 0
            };
            platforms.push(plat);
            return plat;
        }

        function addLadder(x, bottomY, z, height, width = 2.2) {
            const group = new THREE.Group();
            group.position.set(x, bottomY, z);

            const railMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
            const rungMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.35 });

            const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.16, height, 0.16), railMat);
            leftRail.position.set(-width * 0.45, height * 0.5, 0);
            const rightRail = new THREE.Mesh(new THREE.BoxGeometry(0.16, height, 0.16), railMat);
            rightRail.position.set(width * 0.45, height * 0.5, 0);
            group.add(leftRail, rightRail);

            const rungCount = Math.max(3, Math.floor(height / 0.65));
            for (let i = 1; i < rungCount; i++) {
                const ry = (i / rungCount) * height;
                const rung = new THREE.Mesh(new THREE.BoxGeometry(width * 0.9, 0.12, 0.14), rungMat);
                rung.position.set(0, ry, 0);
                group.add(rung);
            }

            levelGroup.add(group);
            ladders.push({
                x,
                minY: bottomY,
                maxY: bottomY + height,
                z,
                halfW: width * 0.55 + 0.45,
                halfD: 0.75
            });
        }

        function addLavaBlock(x, y, z, w, h, d) {

        function addSpinner(x, y, z, armLength, speed, thickness = 0.45) {

        function buildCircuitWall(minX, maxX, minZ, maxZ, floorY) {
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                transparent: true,
                opacity: 0.22,
                roughness: 0.6
            });
            const wallHeight = 24;
            const thickness = 1.2;
            const centerY = floorY + wallHeight * 0.5 - 2;
            const spanX = maxX - minX;
            const spanZ = maxZ - minZ;

            const north = new THREE.Mesh(new THREE.BoxGeometry(spanX + thickness * 2, wallHeight, thickness), wallMat);
            north.position.set((minX + maxX) * 0.5, centerY, minZ - thickness * 0.5);

            const south = new THREE.Mesh(new THREE.BoxGeometry(spanX + thickness * 2, wallHeight, thickness), wallMat);
            south.position.set((minX + maxX) * 0.5, centerY, maxZ + thickness * 0.5);

            const west = new THREE.Mesh(new THREE.BoxGeometry(thickness, wallHeight, spanZ + thickness * 2), wallMat);
            west.position.set(minX - thickness * 0.5, centerY, (minZ + maxZ) * 0.5);

            const east = new THREE.Mesh(new THREE.BoxGeometry(thickness, wallHeight, spanZ + thickness * 2), wallMat);
            east.position.set(maxX + thickness * 0.5, centerY, (minZ + maxZ) * 0.5);

            wallGroup.add(north, south, west, east);
            wallMeshes.push(north, south, west, east);
        }

        function seededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return () => {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        function buildLevel(levelNum) {
            clearLevel();

            const clamped = Math.min(TOTAL_LEVELS, Math.max(1, levelNum));
            state.currentLevel = clamped;
            saveState();

            const rng = seededRandom(clamped * 7919 + 104729);
            const stageCount = 12 + ((clamped - 1) % 5);
            const diff = (clamped - 1) / (TOTAL_LEVELS - 1);

            const palette = [
                0x3b82f6, 0x10b981, 0x8b5cf6, 0xf59e0b, 0x06b6d4, 0xec4899
            ];
            const themeColor = palette[(clamped - 1) % palette.length];

            let cx = 0;
            let cy = 0;
            let cz = 0;
            let coinCounter = 0;
            let checkpointCounter = 0;

            let minX = -10, maxX = 10, minZ = -10, maxZ = 10;

            const trackBounds = (px, pz, pw, pd) => {
                minX = Math.min(minX, px - pw * 0.5 - 6);
                maxX = Math.max(maxX, px + pw * 0.5 + 6);
                minZ = Math.min(minZ, pz - pd * 0.5 - 6);
                maxZ = Math.max(maxZ, pz + pd * 0.5 + 6);
            };

            addPlatform(cx, cy - 0.5, cz, 8, 1, 8, 0x2563eb);
            trackBounds(cx, cz, 8, 8);
            player.spawn.set(cx, cy + 0.1, cz);
            player.pos.copy(player.spawn);
            player.vel.set(0, 0, 0);
            player.yaw = 0;
            camCtrl.yaw = 0;
            camCtrl.pitch = 0.34;

            for (let step = 1; step <= stageCount; step++) {
                const patternIndex = (clamped + step) % 5;
                const stepLen = 10.6 + diff * 3.2;
                const turnOffset = (rng() - 0.5) * 6.8;

                if (patternIndex === 0) {
                    // Puente móvil lateral o angosto con mayor separación
                    const bridgeLen = stepLen + 4.2;
                    const bridgeW = Math.max(1.75, 2.55 - diff * 0.8);
                    const midZ = cz - bridgeLen * 0.5 - 3.3;
                    const midX = cx + turnOffset * 0.6;
                    const isMovingBridge = (step + clamped) % 2 === 0;
                    addPlatform(midX, cy - 0.35, midZ, bridgeW, 0.7, bridgeLen, themeColor, {
                        moveAxis: isMovingBridge ? 'x' : null,
                        moveAmp: isMovingBridge ? 2.1 + diff * 1.1 : 0,
                        moveSpeed: 1.8 + diff * 1.4,
                        phase: step * 1.1
                    });
                    trackBounds(midX + 3.5, midZ, bridgeW, bridgeLen);
                    addCoin(midX, cy + 1.15, midZ, coinCounter++);

                    cz = midZ - bridgeLen * 0.5 - 3.3;
                    cx = midX + turnOffset * 0.7;
                    const nextIsMover = step % 3 === 0;
                    addPlatform(cx, cy - 0.5, cz, 4.6, 1, 4.6, themeColor, {
                        moveAxis: nextIsMover ? 'y' : null,
                        moveAmp: nextIsMover ? 1.2 + diff * 0.7 : 0,
                        moveSpeed: 2.0 + diff * 1.2,
                        phase: step * 0.8
                    });
                    trackBounds(cx, cz, 4.6, 4.6);
                } else if (patternIndex === 1) {
                    // Escalera de 6 peldaños más altos y desviados
                    const stairCount = 6;
                    for (let s = 1; s <= stairCount; s++) {
                        cz -= 3.95;
                        cy += 1.22;
                        cx += (s % 2 === 0 ? 1 : -1) * (1.4 + diff * 0.9);
                        addPlatform(cx, cy - 0.4, cz, 3.2, 0.8, 2.7, 0x0ea5e9);
                        trackBounds(cx, cz, 3.2, 2.7);
                        if (s === 3 || s === 5) addCoin(cx, cy + 1.1, cz, coinCounter++);
                    }
                } else if (patternIndex === 2) {
                    // Pasillo estrecho con bloques de lava alternados
                    const laneW = 6.6;
                    const laneL = 13.5;
                    const laneZ = cz - laneL * 0.5 - 3.2;
                    addPlatform(cx, cy - 0.5, laneZ, laneW, 1, laneL, 0x475569);
                    trackBounds(cx, laneZ, laneW, laneL);

                    addLavaBlock(cx - 1.6, cy + 0.18, laneZ - 3.6, 3.1, 0.48, 2.6);
                    addLavaBlock(cx + 1.6, cy + 0.18, laneZ - 0.4, 3.1, 0.48, 2.6);
                    addLavaBlock(cx - 1.4, cy + 0.18, laneZ + 2.8, 3.2, 0.48, 2.6);
                    addCoin(cx, cy + 1.3, laneZ - 4.8, coinCounter++);

                    cz = laneZ - laneL * 0.5 - 3.2;
                    addPlatform(cx, cy - 0.5, cz, 4.8, 1, 4.8, themeColor);
                    trackBounds(cx, cz, 4.8, 4.8);
                } else if (patternIndex === 3) {
                    // Plataforma con barras giratorias dobles y más rápidas
                    const platW = 7.6;
                    const platL = 8.4;
                    const platZ = cz - 7.2;
                    addPlatform(cx, cy - 0.5, platZ, platW, 1, platL, 0x6366f1);
                    trackBounds(cx, platZ, platW, platL);

                    const armLen = Math.min(3.9, 3.1 + diff * 0.8);
                    const spinSpeed = (2.6 + diff * 2.2) * (step % 2 === 0 ? 1 : -1);
                    addSpinner(cx, cy + 0.65, platZ - 1.6, armLen, spinSpeed, 0.48);
                    addSpinner(cx, cy + 0.65, platZ + 1.8, armLen * 0.9, -spinSpeed * 1.15, 0.48);
                    addCoin(cx + 2.4, cy + 1.2, platZ, coinCounter++);

                    cz = platZ - 6.4;
                    addPlatform(cx, cy - 0.5, cz, 4.6, 1, 4.6, themeColor);
                    trackBounds(cx, cz, 4.6, 4.6);
                } else {
                    // Torre alta con escalera vertical y salto exigente
                    const towerZ = cz - 6.4;
                    const towerH = 8.4;
                    addPlatform(cx, cy + towerH * 0.5 - 0.5, towerZ, 4.8, towerH, 4.6, 0x334155);
                    trackBounds(cx, towerZ, 4.8, 4.6);
                    addLadder(cx, cy, towerZ + 2.45, towerH + 0.4, 1.9);
                    addCoin(cx, cy + towerH + 1.2, towerZ, coinCounter++);

                    cy += towerH;
                    cz = towerZ - 6.0;
                    addPlatform(cx, cy - 0.5, cz, 4.6, 1, 4.6, themeColor);
                    trackBounds(cx, cz, 4.6, 4.6);
                }

                // Checkpoints intermedios (player.spawn solo cambia al tocarlos)
                if (step === Math.floor(stageCount / 2) || step === stageCount - 2) {
                    addCheckpoint(cx, cy, cz, ++checkpointCounter);
                }
            }

            // Plataforma final y portal de meta
            cz -= 7.2;
            addPlatform(cx, cy - 0.5, cz, 8.0, 1, 8.0, 0x059669);
            trackBounds(cx, cz, 8.0, 8.0);
            addPortal(cx, cy, cz - 1.5);

            // Mar de lava 3D animado con relieve y base volcánica
            const lavaFloorY = -9.5;
            const floorW = (maxX - minX) + 44;
            const floorD = (maxZ - minZ) + 44;
            const lavaTex = createLavaTexture();

            const lavaGeo = new THREE.PlaneGeometry(floorW, floorD, 64, 64);
            const posAttr = lavaGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                const wave = Math.sin(vx * 0.25) * Math.cos(vy * 0.25) * 0.85;
                posAttr.setZ(i, wave);
            }
            lavaGeo.computeVertexNormals();

            const lavaFloorMat = new THREE.MeshStandardMaterial({
                map: lavaTex,
                emissive: 0xff3b00,
                emissiveMap: lavaTex,
                emissiveIntensity: 0.85,
                roughness: 0.25,
                metalness: 0.1
            });
            lavaFloorMesh = new THREE.Mesh(lavaGeo, lavaFloorMat);
            lavaFloorMesh.rotation.x = -Math.PI / 2;
            lavaFloorMesh.position.set((minX + maxX) * 0.5, lavaFloorY, (minZ + maxZ) * 0.5);
            levelGroup.add(lavaFloorMesh);

            const crustMat = new THREE.MeshStandardMaterial({
                color: 0x1c0606,
                roughness: 0.9,
                metalness: 0.1
            });
            lavaCrustMesh = new THREE.Mesh(new THREE.BoxGeometry(floorW, 4, floorD), crustMat);
            lavaCrustMesh.position.set((minX + maxX) * 0.5, lavaFloorY - 2.6, (minZ + maxZ) * 0.5);
            levelGroup.add(lavaCrustMesh);

            buildCircuitWall(minX, maxX, minZ, maxZ, lavaFloorY);
            updateHud();
            showToast(`Nivel ${clamped} (${stageCount} etapas) — ¡Llegada al portal!`, 2400);
        }

        function respawnPlayer(reasonMsg = '¡Caíste en la lava!') {
            sfxLava();
            showToast(reasonMsg, 1500);
            player.pos.copy(player.spawn);
            player.vel.set(0, 0, 0);
            player.onGround = false;
        }

        function completeLevel() {
            sfxPortal();
            const finishedLevel = state.currentLevel;
            state.coins += 15;

            if (finishedLevel >= state.unlockedLevel && finishedLevel < TOTAL_LEVELS) {
                state.unlockedLevel = finishedLevel + 1;
            }
            if (finishedLevel < TOTAL_LEVELS) {
                state.currentLevel = finishedLevel + 1;
            } else {
                state.currentLevel = 1;
            }
            saveState();
            updateHud();

            if (finishedLevel < TOTAL_LEVELS) {
                showToast(`¡Nivel ${finishedLevel} completado! +15 monedas`, 2200);
                buildLevel(state.currentLevel);
            } else {
                showToast('¡Completaste los 30 niveles del Obby 3D! +15 monedas', 3200);
                buildLevel(1);
            }
        }

        // =========================================================================
        // CONTROLES (TECLADO, JOYSTICK VIRTUAL TÁCTIL Y CÁMARA EN TERCERA PERSONA)
        // =========================================================================
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
            space: false
        };

        const joyInput = {
            active: false,
            pointerId: null,
            x: 0,
            y: 0,
            maxRadius: 42
        };

        let jumpPressed = false;
        let camTouchId = null;
        let lastCamX = 0;
        let lastCamY = 0;

        function triggerJump() {
            if (state.mode !== 'playing') return;
            if (player.onGround) {
                player.vel.y = 12.6;
                player.onGround = false;
                sfxJump();
            }
        }

        function resetJoystickKnob() {
            joyInput.active = false;
            joyInput.pointerId = null;
            joyInput.x = 0;
            joyInput.y = 0;
            const knob = document.getElementById('joystick-knob');
            if (knob) {
                knob.style.transform = 'translate(0px, 0px)';
            }
        }

        function updateJoystickFromClient(clientX, clientY) {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            if (!zone || !knob) return;
            const rect = zone.getBoundingClientRect();
            const cx = rect.left + rect.width * 0.5;
            const cy = rect.top + rect.height * 0.5;

            let dx = clientX - cx;
            let dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            if (dist > joyInput.maxRadius) {
                dx = (dx / dist) * joyInput.maxRadius;
                dy = (dy / dist) * joyInput.maxRadius;
            }

            joyInput.x = dx / joyInput.maxRadius;
            joyInput.y = dy / joyInput.maxRadius;
            knob.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        }

        function bindControls() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    keys.space = true;
                    jumpPressed = true;
                    if (state.mode === 'playing') e.preventDefault();
                } else if (e.key in keys) {
                    keys[e.key] = true;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    keys.space = false;
                    jumpPressed = false;
                } else if (e.key in keys) {
                    keys[e.key] = false;
                }
            });

            const joyZone = document.getElementById('joystick-zone');
            if (joyZone) {
                joyZone.addEventListener('pointerdown', (e) => {
                    if (state.mode !== 'playing') return;
                    e.stopPropagation();
                    joyZone.setPointerCapture(e.pointerId);
                    joyInput.active = true;
                    joyInput.pointerId = e.pointerId;
                    updateJoystickFromClient(e.clientX, e.clientY);
                });

                joyZone.addEventListener('pointermove', (e) => {
                    if (!joyInput.active || e.pointerId !== joyInput.pointerId) return;
                    e.stopPropagation();
                    updateJoystickFromClient(e.clientX, e.clientY);
                });

                const endJoy = (e) => {
                    if (e.pointerId === joyInput.pointerId) {
                        e.stopPropagation();
                        resetJoystickKnob();
                    }
                };
                joyZone.addEventListener('pointerup', endJoy);
                joyZone.addEventListener('pointercancel', endJoy);
            }

            const jumpBtn = document.getElementById('jump-btn');
            if (jumpBtn) {
                jumpBtn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    jumpPressed = true;
                    triggerJump();
                });
                const releaseJump = (e) => {
                    e.stopPropagation();
                    jumpPressed = false;
                };
                jumpBtn.addEventListener('pointerup', releaseJump);
                jumpBtn.addEventListener('pointercancel', releaseJump);
            }

            const canvas = document.getElementById('game-canvas');
            if (canvas) {
                canvas.addEventListener('pointerdown', (e) => {
                    if (state.mode !== 'playing') return;
                    if (camTouchId === null && e.pointerId !== joyInput.pointerId) {
                        camTouchId = e.pointerId;
                        lastCamX = e.clientX;
                        lastCamY = e.clientY;
                    }
                });

                canvas.addEventListener('pointermove', (e) => {
                    if (state.mode !== 'playing' || e.pointerId !== camTouchId) return;
                    const dx = e.clientX - lastCamX;
                    const dy = e.clientY - lastCamY;
                    lastCamX = e.clientX;
                    lastCamY = e.clientY;

                    camCtrl.yaw -= dx * 0.0065;
                    camCtrl.pitch = Math.min(1.15, Math.max(0.08, camCtrl.pitch + dy * 0.0055));
                });

                const releaseCam = (e) => {
                    if (e.pointerId === camTouchId) {
                        camTouchId = null;
                    }
                };
                canvas.addEventListener('pointerup', releaseCam);
                canvas.addEventListener('pointercancel', releaseCam);

                canvas.addEventListener('wheel', (e) => {
                    if (state.mode !== 'playing') return;
                    camCtrl.distance = Math.min(camCtrl.maxDist, Math.max(camCtrl.minDist, camCtrl.distance + e.deltaY * 0.005));
                }, { passive: true });
            }
        }

        // =========================================================================
        // ACTUALIZACIÓN FÍSICA, OBSTÁCULOS Y CÁMARA
        // =========================================================================
        function updatePlatforms(elapsed) {
            for (const p of platforms) {
                const prevX = p.mesh.position.x;
                const prevY = p.mesh.position.y;
                const prevZ = p.mesh.position.z;

                let nx = p.baseX;
                let ny = p.baseY;
                let nz = p.baseZ;

                if (p.moveAxis === 'x') {
                    nx = p.baseX + Math.sin(elapsed * p.moveSpeed + p.phase) * p.moveAmp;
                } else if (p.moveAxis === 'y') {
                    ny = p.baseY + Math.sin(elapsed * p.moveSpeed + p.phase) * p.moveAmp;
                } else if (p.moveAxis === 'z') {
                    nz = p.baseZ + Math.sin(elapsed * p.moveSpeed + p.phase) * p.moveAmp;
                }

                p.mesh.position.set(nx, ny, nz);
                p.x = nx;
                p.y = ny;
                p.z = nz;
                p.dx = nx - prevX;
                p.dy = ny - prevY;
                p.dz = nz - prevZ;
            }
        }

        function updateHazardsAndPickups(dt, elapsed) {
            if (lavaFloorMesh && lavaFloorMesh.geometry && lavaFloorMesh.geometry.attributes.position) {
                const posAttr = lavaFloorMesh.geometry.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const vx = posAttr.getX(i);
                    const vy = posAttr.getY(i);
                    const wave = Math.sin(vx * 0.25 + elapsed * 2.2) * Math.cos(vy * 0.25 + elapsed * 1.8) * 0.95;
                    posAttr.setZ(i, wave);
                }
                posAttr.needsUpdate = true;
                lavaFloorMesh.geometry.computeVertexNormals();
            }

            if (lavaFloorMesh && lavaFloorMesh.material && lavaFloorMesh.material.map) {
                lavaFloorMesh.material.map.offset.x = (elapsed * 0.05) % 1;
                lavaFloorMesh.material.map.offset.y = (elapsed * 0.04) % 1;
            }

            if (portalMesh) {
                portalMesh.rotation.y = elapsed * 1.4;
            }

            for (const sp of spinners) {
                sp.pivot.rotation.y += sp.speed * dt;
                const angle = sp.pivot.rotation.y;
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);

                const relX = player.pos.x - sp.x;
                const relZ = player.pos.z - sp.z;
                const localX = relX * cosA + relZ * sinA;
                const localZ = -relX * sinA + relZ * cosA;

                const playerCenterY = player.pos.y + player.height * 0.5;
                if (
                    Math.abs(localX) <= sp.armLength + player.radius * 0.7 &&
                    Math.abs(localZ) <= sp.thickness * 0.5 + player.radius * 0.7 &&
                    Math.abs(playerCenterY - sp.y) <= sp.thickness * 0.5 + 0.65
                ) {
                    respawnPlayer('¡Te golpeó el rodillo giratorio!');
                    return;
                }
            }

            for (const lz of lavaZones) {
                const halfW = lz.w * 0.5 + player.radius * 0.5;
                const halfD = lz.d * 0.5 + player.radius * 0.5;
                const topY = lz.y + lz.h * 0.5;
                const botY = lz.y - lz.h * 0.5;
                if (
                    Math.abs(player.pos.x - lz.x) <= halfW &&
                    Math.abs(player.pos.z - lz.z) <= halfD &&
                    player.pos.y <= topY + 0.15 &&
                    player.pos.y + 0.8 >= botY
                ) {
                    respawnPlayer('¡Pisaste lava!');
                    return;
                }
            }

            for (const c of coins) {
                if (c.collected) continue;
                c.mesh.rotation.z = elapsed * 2.6;
                c.mesh.position.y = c.y + Math.sin(elapsed * 3.2 + c.id) * 0.14;

                const dx = player.pos.x - c.x;
                const dy = (player.pos.y + 0.9) - c.mesh.position.y;
                const dz = player.pos.z - c.z;
                if (dx * dx + dy * dy + dz * dz <= 1.25 * 1.25) {
                    c.collected = true;
                    c.mesh.visible = false;
                    state.coins += 1;
                    saveState();
                    sfxCoin();
                    updateHud();
                }
            }

            for (const cp of checkpoints) {
                if (cp.reached) continue;
                const dx = Math.abs(player.pos.x - cp.x);
                const dz = Math.abs(player.pos.z - cp.z);
                const dy = Math.abs(player.pos.y - cp.y);
                if (dx <= 1.8 && dz <= 1.8 && dy <= 1.6) {
                    cp.reached = true;
                    cp.flagMat.color.setHex(0x22c55e);
                    cp.flagMat.emissive.setHex(0x14532d);
                    player.spawn.set(cp.x, cp.y + 0.1, cp.z);
                    sfxCheckpoint();
                    showToast(`¡Checkpoint ${cp.index} guardado!`, 1500);
                }
            }

            if (portalPos) {
                const dx = player.pos.x - portalPos.x;
                const dy = (player.pos.y + 0.9) - portalPos.y;
                const dz = player.pos.z - portalPos.z;
                if (dx * dx + dy * dy + dz * dz <= 2.15 * 2.15) {
                    completeLevel();
                }
            }
        }

        function updatePlayer(dt, elapsed) {
            if (!player || !player.pos || !player.vel || !player.spawn) return;
            if (state.mode !== 'playing') return;

            updatePlatforms(elapsed);

            let moveX = joyInput.x;
            let moveZ = joyInput.y;

            if (keys.a || keys.ArrowLeft) moveX -= 1;
            if (keys.d || keys.ArrowRight) moveX += 1;
            if (keys.w || keys.ArrowUp) moveZ -= 1;
            if (keys.s || keys.ArrowDown) moveZ += 1;

            const mag = Math.hypot(moveX, moveZ);
            if (mag > 1) {
                moveX /= mag;
                moveZ /= mag;
            }

            const forwardX = -Math.sin(camCtrl.yaw);
            const forwardZ = -Math.cos(camCtrl.yaw);
            const rightX = Math.cos(camCtrl.yaw);
            const rightZ = -Math.sin(camCtrl.yaw);

            const wishX = forwardX * (-moveZ) + rightX * moveX;
            const wishZ = forwardZ * (-moveZ) + rightZ * moveX;

            const moveSpeed = 8.4;
            player.vel.x = wishX * moveSpeed;
            player.vel.z = wishZ * moveSpeed;

            let onLadder = false;
            for (const ld of ladders) {
                if (
                    Math.abs(player.pos.x - ld.x) <= ld.halfW &&
                    Math.abs(player.pos.z - ld.z) <= ld.halfD &&
                    player.pos.y + player.height >= ld.minY &&
                    player.pos.y <= ld.maxY
                ) {
                    onLadder = true;
                    break;
                }
            }

            if (onLadder && (mag > 0.1 || keys.space || jumpPressed)) {
                player.vel.y = 7.2;
                player.onGround = true;
            } else {
                if ((keys.space || jumpPressed) && player.onGround) {
                    triggerJump();
                }
                player.vel.y -= 28.0 * dt;
            }

            const prevY = player.pos.y;
            player.pos.x += player.vel.x * dt;
            player.pos.y += player.vel.y * dt;
            player.pos.z += player.vel.z * dt;

            let groundedNow = false;
            for (const p of platforms) {
                const topY = p.y + p.h * 0.5;
                const botY = p.y - p.h * 0.5;
                const halfW = p.w * 0.5 + player.radius * 0.75;
                const halfD = p.d * 0.5 + player.radius * 0.75;

                const withinX = Math.abs(player.pos.x - p.x) <= halfW;
                const withinZ = Math.abs(player.pos.z - p.z) <= halfD;

                if (withinX && withinZ && player.vel.y <= 0 && prevY >= topY - 0.35 && player.pos.y <= topY + 0.05) {
                    player.pos.y = topY;
                    player.vel.y = 0;
                    groundedNow = true;
                    player.pos.x += p.dx;
                    player.pos.z += p.dz;
                } else if (withinX && withinZ && player.pos.y < topY - 0.1 && player.pos.y + player.height > botY) {
                    const overlapX = halfW - Math.abs(player.pos.x - p.x);
                    const overlapZ = halfD - Math.abs(player.pos.z - p.z);
                    if (overlapX < overlapZ) {
                        player.pos.x += player.pos.x >= p.x ? overlapX : -overlapX;
                    } else {
                        player.pos.z += player.pos.z >= p.z ? overlapZ : -overlapZ;
                    }
                }
            }

            player.onGround = groundedNow;

            if (mag > 0.08) {
                const targetYaw = Math.atan2(wishX, wishZ);
                let diffYaw = targetYaw - player.yaw;
                while (diffYaw > Math.PI) diffYaw -= Math.PI * 2;
                while (diffYaw < -Math.PI) diffYaw += Math.PI * 2;
                player.yaw += diffYaw * Math.min(1, dt * 14);
                player.walkCycle += dt * 11;
            } else {
                player.walkCycle = 0;
            }

            if (playerGroup) {
                playerGroup.position.copy(player.pos);
                playerGroup.rotation.y = player.yaw;

                const swing = player.onGround ? Math.sin(player.walkCycle) * 0.65 : 0.35;
                if (leftLegPivot) leftLegPivot.rotation.x = swing;
                if (rightLegPivot) rightLegPivot.rotation.x = -swing;
                if (leftArmPivot) leftArmPivot.rotation.x = -swing * 0.8;
                if (rightArmPivot) rightArmPivot.rotation.x = swing * 0.8;
            }

            if (player.pos.y < -8.2) {
                respawnPlayer('¡Caíste a la lava!');
                return;
            }

            updateHazardsAndPickups(dt, elapsed);
            updateHudDistance();
        }

        function updateCamera() {
            if (!camera || !player || !player.pos) return;
            const targetX = player.pos.x;
            const targetY = player.pos.y + 1.65;
            const targetZ = player.pos.z;

            const horizDist = Math.cos(camCtrl.pitch) * camCtrl.distance;
            const vertDist = Math.sin(camCtrl.pitch) * camCtrl.distance;

            const camX = targetX + Math.sin(camCtrl.yaw) * horizDist;
            const camY = targetY + vertDist;
            const camZ = targetZ + Math.cos(camCtrl.yaw) * horizDist;

            camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.22);
            camera.lookAt(targetX, targetY, targetZ);
        }

        // =========================================================================
        // INTERFAZ DE USUARIO, LOBBY Y SELECTOR DE 30 NIVELES
        // =========================================================================
        function updateHudDistance() {
            const el = document.getElementById('hud-distance');
            if (!el || !portalPos || !player || !player.pos) return;
            const dist = Math.max(0, Math.round(Math.hypot(portalPos.x - player.pos.x, portalPos.z - player.pos.z)));
            el.textContent = `${dist}m`;
        }

        function updateHud() {
            const hudLevel = document.getElementById('hud-level');
            const hudCoins = document.getElementById('hud-coins');
            const lobbyUnlocked = document.getElementById('lobby-unlocked');
            const lobbyCoins = document.getElementById('lobby-coins');
            const soundBtnLobby = document.getElementById('btn-toggle-sound');
            const soundBtnHud = document.getElementById('btn-hud-sound');

            if (hudLevel) hudLevel.textContent = `${state.currentLevel} / ${TOTAL_LEVELS}`;
            if (hudCoins) hudCoins.textContent = `${state.coins}`;
            if (lobbyUnlocked) lobbyUnlocked.textContent = `${state.currentLevel} / ${TOTAL_LEVELS}`;
            if (lobbyCoins) lobbyCoins.textContent = `🪙 ${state.coins}`;

            if (soundBtnLobby) {
                soundBtnLobby.textContent = state.soundEnabled
                    ? '🔊 Sonido y Música: Activado'
                    : '🔇 Sonido y Música: Silenciado';
            }
            if (soundBtnHud) {
                soundBtnHud.textContent = state.soundEnabled ? '🔊' : '🔇';
            }
        }

        function renderLevelsModal() {
            const grid = document.getElementById('levels-grid');
            if (!grid) return;
            grid.innerHTML = '';

            for (let lvl = 1; lvl <= TOTAL_LEVELS; lvl++) {
                const isUnlocked = lvl <= state.unlockedLevel;
                const isCurrent = lvl === state.currentLevel;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.disabled = !isUnlocked;
                btn.textContent = isUnlocked ? `${lvl}` : `🔒 ${lvl}`;
                btn.className = [
                    'py-2.5 rounded-xl font-black text-xs sm:text-sm border transition',
                    !isUnlocked
                        ? 'bg-slate-900/70 text-slate-500 border-white/5 cursor-not-allowed opacity-60'
                        : isCurrent
                            ? 'bg-emerald-500 text-slate-950 border-emerald-200 shadow-md active:scale-95'
                            : 'bg-slate-800 hover:bg-slate-700 text-white border-white/10 active:scale-95'
                ].join(' ');

                if (isUnlocked) {
                    btn.addEventListener('click', () => {
                        state.currentLevel = lvl;
                        saveState();
                        closeLevelsModal();
                        setMode('playing');
                        buildLevel(lvl);
                    });
                }
                grid.appendChild(btn);
            }
        }

        function openLevelsModal() {
            renderLevelsModal();
            const modal = document.getElementById('level-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeLevelsModal() {
            const modal = document.getElementById('level-modal');
            if (modal) modal.classList.add('hidden');
        }

        function setMode(newMode) {
            state.mode = newMode;
            const lobby = document.getElementById('lobby-screen');
            const hud = document.getElementById('game-hud');
            const joy = document.getElementById('joystick-zone');
            const jump = document.getElementById('jump-btn');

            if (newMode === 'playing') {
                if (lobby) lobby.classList.add('hidden');
                if (hud) hud.classList.remove('hidden');
                if (joy) joy.classList.remove('hidden');
                if (jump) jump.classList.remove('hidden');
                if (state.soundEnabled) startBgm();
            } else {
                resetJoystickKnob();
                jumpPressed = false;
                if (lobby) lobby.classList.remove('hidden');
                if (hud) hud.classList.add('hidden');
                if (joy) joy.classList.add('hidden');
                if (jump) jump.classList.add('hidden');
            }
            updateHud();
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            saveState();
            if (state.soundEnabled) {
                getAudioCtx();
                startBgm();
                showToast('Sonido y música activados', 1400);
            } else {
                showToast('Sonido silenciado', 1400);
            }
            updateHud();
        }

        function bindMenuEvents() {
            const btnPlay = document.getElementById('btn-play');
            const btnSelect = document.getElementById('btn-select-level');
            const btnToggleSound = document.getElementById('btn-toggle-sound');
            const btnCloseLevels = document.getElementById('btn-close-levels');
            const btnHudBack = document.getElementById('btn-hud-back');
            const btnHudLevels = document.getElementById('btn-hud-levels');
            const btnHudSound = document.getElementById('btn-hud-sound');
            const btnHudLobby = document.getElementById('btn-hud-lobby');

            if (btnPlay) {
                btnPlay.addEventListener('click', () => {
                    setMode('playing');
                    buildLevel(state.currentLevel);
                });
            }
            if (btnSelect) btnSelect.addEventListener('click', openLevelsModal);
            if (btnToggleSound) btnToggleSound.addEventListener('click', toggleSound);
            if (btnCloseLevels) btnCloseLevels.addEventListener('click', closeLevelsModal);
            if (btnHudBack) btnHudBack.addEventListener('click', () => setMode('lobby'));
            if (btnHudLevels) btnHudLevels.addEventListener('click', openLevelsModal);
            if (btnHudSound) btnHudSound.addEventListener('click', toggleSound);
            if (btnHudLobby) btnHudLobby.addEventListener('click', () => setMode('lobby'));
        }

        // =========================================================================
        // BUCLE PRINCIPAL DE ANIMACIÓN Y ARRANQUE SEGURO
        // =========================================================================
        let lastTime = performance.now();
        const startTime = lastTime;

        function animate(now) {
            requestAnimationFrame(animate);
            const currentNow = typeof now === 'number' ? now : performance.now();
            const dt = Math.min((currentNow - lastTime) / 1000, 0.05);
            const elapsed = (currentNow - startTime) / 1000;
            lastTime = currentNow;

            updatePlayer(dt, elapsed);
            updateCamera();

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function bootApp() {
            loadState();
            updateHud();
            bindMenuEvents();
            bindControls();

            const startEngine = () => {
                try {
                    if (!initThree()) {
                        setTimeout(startEngine, 120);
                        return;
                    }
                    buildLevel(state.currentLevel);
                    setMode('lobby');
                    requestAnimationFrame(animate);
                } catch (err) {
                    console.error('Error al iniciar Obby 3D:', err);
                    setMode('lobby');
                }
            };

            startEngine();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootApp);
        } else {
            bootApp();
        }
    </script>
</body>
