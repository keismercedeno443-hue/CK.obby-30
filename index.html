<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Obby 3D Estilo Roblox — Amy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud-top {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    }

    .stage-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .stage-sub {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    #toast {
      position: fixed;
      top: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 20;
      text-align: center;
      max-width: 90vw;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #jump-btn {
      position: fixed;
      right: 22px;
      bottom: 26px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.9), rgba(2, 132, 199, 0.85));
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.6px;
      box-shadow: 0 10px 26px rgba(2, 132, 199, 0.45);
      z-index: 15;
      touch-action: none;
    }

    #jump-btn:active, #jump-btn.active {
      transform: scale(0.93);
      filter: brightness(1.12);
    }

    #joystick-base {
      position: fixed;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      border: 2px solid rgba(255, 255, 255, 0.24);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      z-index: 14;
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%);
    }

    .help-hint {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      background: rgba(15, 23, 42, 0.55);
      padding: 6px 10px;
      border-radius: 10px;
      pointer-events: none;
      z-index: 10;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #1e293b, #090d16);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 50;
      gap: 14px;
      transition: opacity 0.35s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text" style="font-weight:700;font-size:15px;">Cargando Obby de Amy y Lava...</div>
  </div>

  <div class="hud-top">
    <div class="panel">
      <div class="stage-title" id="stage-title">Etapa 1 / 100</div>
      <div class="stage-sub" id="stage-sub">Inicio &amp; Calentamiento</div>
    </div>
    <div class="stats-row">
      <div class="badge" id="coin-badge">🪙 0</div>
      <div class="badge" id="checkpoint-badge">🏁 CP: 1</div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <button id="jump-btn" type="button">SALTAR</button>

  <div class="help-hint">
    Toca y arrastra en pantalla para moverte · Arrastra arriba/derecha para girar cámara · Botón SALTAR
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const SAVE_KEY = 'obby_amy_100_save_v1';
    const TOTAL_STAGES = 100;
    const LAVA_BASE_Y = -5.5;

    const STAGE_THEMES = [
      { name: 'Cielo Soleado', skyTop: 0x38bdf8, skyBottom: 0xe0f2fe, fog: 0xbae6fd, accent: 0x22c55e },
      { name: 'Atardecer Neón', skyTop: 0x312e81, skyBottom: 0xf472b6, fog: 0xc084fc, accent: 0x38bdf8 },
      { name: 'Volcán Esmeralda', skyTop: 0x064e3b, skyBottom: 0x6ee7b7, fog: 0x34d399, accent: 0xf59e0b },
      { name: 'Noche Estelar', skyTop: 0x090d16, skyBottom: 0x1e293b, fog: 0x0f172a, accent: 0xa855f7 },
      { name: 'Dunas Doradas', skyTop: 0xd97706, skyBottom: 0xfde68a, fog: 0xfcd34d, accent: 0xef4444 }
    ];

    const STAGE_SUBTITLES = [
      'Inicio & Calentamiento',
      'Saltos Cortos',
      'Pasarela Estrecha',
      'Escalones Ascendentes',
      'Islas Flotantes',
      'Ritmo de Precisión',
      'Puente Suspendido',
      'Torre de Salto',
      'Sendero del Viento',
      'Cumbre del Sector'
    ];

    function loadSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return { checkpoint: 1, coins: 0, collected: [] };
        const parsed = JSON.parse(raw);
        return {
          checkpoint: Math.min(TOTAL_STAGES, Math.max(1, Number(parsed.checkpoint) || 1)),
          coins: Math.max(0, Number(parsed.coins) || 0),
          collected: Array.isArray(parsed.collected) ? parsed.collected : []
        };
      } catch {
        return { checkpoint: 1, coins: 0, collected: [] };
      }
    }

    function writeSave() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
      } catch {}
    }

    const saveData = loadSave();
    const collectedSet = new Set(saveData.collected);

    let toastTimeout = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.remove('show'), 2100);
    }

    function updateHUD(stageNum) {
      const clamped = Math.min(TOTAL_STAGES, Math.max(1, stageNum));
      const subIndex = (clamped - 1) % STAGE_SUBTITLES.length;
      document.getElementById('stage-title').textContent = `Etapa ${clamped} / ${TOTAL_STAGES}`;
      document.getElementById('stage-sub').textContent = STAGE_SUBTITLES[subIndex];
      document.getElementById('coin-badge').textContent = `🪙 ${saveData.coins}`;
      document.getElementById('checkpoint-badge').textContent = `🏁 CP: ${saveData.checkpoint}`;
    }

    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const scene = new THREE.Scene();
    const fog = new THREE.FogExp2(0xbae6fd, 0.0042);
    scene.fog = fog;

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 450);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 1.05);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.45);
    dirLight.position.set(24, 42, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 140;
    const d = 34;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);
    scene.add(dirLight.target);

    const lavaGlowLight = new THREE.PointLight(0xff5500, 1.8, 45);
    scene.add(lavaGlowLight);

    const skyGeo = new THREE.SphereGeometry(320, 24, 16);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x38bdf8) },
        bottomColor: { value: new THREE.Color(0xe0f2fe) }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + vec3(0.0, 40.0, 0.0)).y;
          float t = clamp(pow(max(h, 0.0), 0.65), 0.0, 1.0);
          gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyDome);

    // ==================== LAVA (lava_floor.glb + MAR DE LAVA ANIMADO) ====================
    const lavaGroup = new THREE.Group();
    scene.add(lavaGroup);

    const fallbackLavaMat = new THREE.MeshStandardMaterial({
      color: 0xff3b00,
      emissive: new THREE.Color(0xff2a00),
      emissiveIntensity: 0.9,
      roughness: 0.35,
      metalness: 0.1
    });

    const lavaSeaMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1600, 1600, 48, 48),
      new THREE.MeshStandardMaterial({
        color: 0xea380c,
        emissive: new THREE.Color(0xff3c00),
        emissiveIntensity: 0.75,
        roughness: 0.4,
        metalness: 0.05
      })
    );
    lavaSeaMesh.rotation.x = -Math.PI / 2;
    lavaSeaMesh.position.y = LAVA_BASE_Y;
    lavaGroup.add(lavaSeaMesh);

    const lavaBasePositions = lavaSeaMesh.geometry.attributes.position.array.slice();
    const lavaEmissiveMeshes = [];

    const gltfLoader = new GLTFLoader();

    gltfLoader.load(
      './lava_floor.glb',
      (gltf) => {
        const lavaModel = gltf.scene;
        lavaModel.scale.set(720, 40, 720);
        lavaModel.position.set(0, LAVA_BASE_Y - 1.2, -160);
        lavaModel.traverse((child) => {
          if (child.isMesh) {
            child.receiveShadow = false;
            child.castShadow = false;
            if (child.material) {
              child.material = child.material.clone();
              if ('emissive' in child.material && child.material.emissive) {
                child.material.emissive.setHex(0xff3b00);
                child.material.emissiveIntensity = Math.max(child.material.emissiveIntensity || 0.7, 0.85);
                lavaEmissiveMeshes.push(child.material);
              }
              child.material.needsUpdate = true;
            } else {
              child.material = fallbackLavaMat;
            }
          }
        });
        lavaGroup.add(lavaModel);
      },
      undefined,
      () => {
        // Si no carga lava_floor.glb, el mar de lava ya cubre toda la escena
      }
    );

    // Chispas / partículas sobre la lava
    const emberCount = 140;
    const emberGeo = new THREE.BufferGeometry();
    const emberPos = new Float32Array(emberCount * 3);
    const emberSpeeds = new Float32Array(emberCount);
    for (let i = 0; i < emberCount; i++) {
      emberPos[i * 3] = (Math.random() - 0.5) * 140;
      emberPos[i * 3 + 1] = LAVA_BASE_Y + Math.random() * 14;
      emberPos[i * 3 + 2] = -Math.random() * 460;
      emberSpeeds[i] = 1.5 + Math.random() * 3.2;
    }
    emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
    const emberMat = new THREE.PointsMaterial({
      color: 0xffb703,
      size: 0.45,
      transparent: true,
      opacity: 0.85
    });
    const emberPoints = new THREE.Points(emberGeo, emberMat);
    scene.add(emberPoints);

    // ==================== CONSTRUCCIÓN DE LAS 100 ETAPAS ====================
    const platforms = [];
    const checkpoints = [];
    const coins = [];
    const movingPlatforms = [];
    const airEnemies = [];

    const stageAnchors = new Map();

    const platformMatCache = new Map();
    function getPlatformMaterial(colorHex) {
      if (!platformMatCache.has(colorHex)) {
        platformMatCache.set(
          colorHex,
          new THREE.MeshStandardMaterial({
            color: colorHex,
            roughness: 0.55,
            metalness: 0.08
          })
        );
      }
      return platformMatCache.get(colorHex);
    }

    function addPlatform({ x, y, z, w, h, d, color, stage, isCheckpoint = false, moveAxis = null, moveRange = 0, moveSpeed = 1.5, movePhase = 0 }) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, getPlatformMaterial(color));
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const entry = {
        mesh,
        x,
        y,
        z,
        w,
        h,
        d,
        stage,
        topY: y + h / 2,
        baseX: x,
        baseY: y,
        baseZ: z,
        moveAxis,
        moveRange,
        moveSpeed,
        movePhase,
        deltaX: 0,
        deltaY: 0,
        deltaZ: 0
      };
      platforms.push(entry);

      if (moveAxis && moveRange > 0) {
        movingPlatforms.push(entry);
      }

      if (isCheckpoint) {
        const pad = new THREE.Mesh(
          new THREE.CylinderGeometry(Math.min(w, d) * 0.34, Math.min(w, d) * 0.38, 0.22, 20),
          new THREE.MeshStandardMaterial({
            color: stage <= saveData.checkpoint ? 0x22c55e : 0xfacc15,
            emissive: stage <= saveData.checkpoint ? 0x16a34a : 0xca8a04,
            emissiveIntensity: 0.45,
            roughness: 0.3
          })
        );
        pad.position.set(x, y + h / 2 + 0.11, z);
        scene.add(pad);

        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.08, 0.08, 2.4, 10),
          new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.6, roughness: 0.3 })
        );
        pole.position.set(x - w * 0.28, y + h / 2 + 1.2, z - d * 0.28);
        pole.castShadow = true;
        scene.add(pole);

        const flag = new THREE.Mesh(
          new THREE.BoxGeometry(0.9, 0.52, 0.08),
          new THREE.MeshStandardMaterial({
            color: stage <= saveData.checkpoint ? 0x22c55e : 0xef4444,
            emissive: stage <= saveData.checkpoint ? 0x15803d : 0xb91c1c,
            emissiveIntensity: 0.35
          })
        );
        flag.position.set(x - w * 0.28 + 0.45, y + h / 2 + 2.1, z - d * 0.28);
        scene.add(flag);

        checkpoints.push({
          stage,
          x,
          y: y + h / 2,
          z,
          padMat: pad.material,
          flagMat: flag.material,
          reached: stage <= saveData.checkpoint
        });
      }

      return entry;
    }

    const coinGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.16, 18);
    coinGeo.rotateX(Math.PI / 2);
    const coinMat = new THREE.MeshStandardMaterial({
      color: 0xfbbf24,
      emissive: 0xd97706,
      emissiveIntensity: 0.45,
      metalness: 0.75,
      roughness: 0.22
    });

    function addCoin(id, x, y, z) {
      if (collectedSet.has(id)) return;
      const mesh = new THREE.Mesh(coinGeo, coinMat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      scene.add(mesh);
      coins.push({ id, mesh, baseY: y, phase: Math.random() * Math.PI * 2, collected: false });
    }

    function addAirEnemy(x, y, z, rangeX, rangeZ, speed, phase) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      const body = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.75, 1),
        new THREE.MeshStandardMaterial({
          color: 0xef4444,
          emissive: 0x991b1b,
          emissiveIntensity: 0.45,
          roughness: 0.35
        })
      );
      body.castShadow = true;
      group.add(body);

      const wingGeo = new THREE.BoxGeometry(1.5, 0.12, 0.45);
      const wingMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
      const leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-1.0, 0.15, 0);
      const rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(1.0, 0.15, 0);
      group.add(leftWing, rightWing);

      scene.add(group);
      airEnemies.push({
        group,
        leftWing,
        rightWing,
        baseX: x,
        baseY: y,
        baseZ: z,
        rangeX,
        rangeZ,
        speed,
        phase
      });
    }

    let cursorX = 0;
    let cursorY = 1.0;
    let cursorZ = 0;

    for (let stage = 1; stage <= TOTAL_STAGES; stage++) {
      const theme = STAGE_THEMES[Math.floor((stage - 1) / 20) % STAGE_THEMES.length];
      const isMilestone = stage % 10 === 0;
      const startW = isMilestone ? 9.5 : 7.2;
      const startD = isMilestone ? 9.5 : 7.2;

      addPlatform({
        x: cursorX,
        y: cursorY - 0.6,
        z: cursorZ,
        w: startW,
        h: 1.2,
        d: startD,
        color: isMilestone ? 0xf59e0b : theme.accent,
        stage,
        isCheckpoint: true
      });

      stageAnchors.set(stage, {
        x: cursorX,
        y: cursorY,
        z: cursorZ
      });

      addCoin(`c_${stage}_start`, cursorX, cursorY + 1.35, cursorZ);

      const stepsInStage = stage <= 10 ? 3 : stage <= 40 ? 4 : 5;
      for (let s = 1; s <= stepsInStage; s++) {
        const difficulty = stage / TOTAL_STAGES;
        const stepGapZ = 5.4 + difficulty * 2.4;
        const stepDeltaY = ((s + stage) % 3 === 0 ? 0.85 : (s + stage) % 4 === 0 ? -0.55 : 0.35);
        const swayX = Math.sin(stage * 0.85 + s * 1.2) * (1.6 + difficulty * 2.2);

        cursorZ -= stepGapZ;
        cursorY = Math.max(0.5, cursorY + stepDeltaY);
        const nextX = cursorX + swayX;

        const platW = Math.max(3.1, 5.4 - difficulty * 1.8 - (s % 2 === 0 ? 0.45 : 0));
        const platD = Math.max(3.1, 5.2 - difficulty * 1.5);

        const shouldMove = stage >= 6 && (s === 2 || (stage >= 25 && s === 3));
        const moveAxis = shouldMove ? (s % 2 === 0 ? 'x' : 'y') : null;
        const moveRange = shouldMove ? (moveAxis === 'x' ? 2.4 + difficulty * 1.4 : 1.1) : 0;

        const platColor = s % 2 === 0 ? 0xffffff : theme.accent;

        addPlatform({
          x: nextX,
          y: cursorY - 0.5,
          z: cursorZ,
          w: platW,
          h: 1.0,
          d: platD,
          color: platColor,
          stage,
          isCheckpoint: false,
          moveAxis,
          moveRange,
          moveSpeed: 1.35 + difficulty * 0.9,
          movePhase: stage * 0.7 + s
        });

        addCoin(`c_${stage}_${s}`, nextX, cursorY + 1.25, cursorZ);

        if (stage >= 8 && s === stepsInStage - 1 && stage % 2 === 0) {
          addAirEnemy(
            nextX,
            cursorY + 2.35,
            cursorZ - 2.2,
            2.6,
            1.4,
            1.6 + difficulty * 1.2,
            stage * 0.9 + s
          );
        }

        cursorX = nextX;
      }

      cursorZ -= 5.8;
      cursorY = Math.max(0.5, cursorY + 0.4);
    }

    // ==================== JUGADOR (AMY + ANIMACIONES) ====================
    const playerRoot = new THREE.Group();
    const initialAnchor = stageAnchors.get(saveData.checkpoint) || { x: 0, y: 1.0, z: 0 };
    playerRoot.position.set(initialAnchor.x, initialAnchor.y, initialAnchor.z);
    scene.add(playerRoot);

    const amyContainer = new THREE.Group();
    playerRoot.add(amyContainer);

    function createFallbackAmy() {
      const g = new THREE.Group();
      const torso = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.42, 0.75, 8, 14),
        new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.45 })
      );
      torso.position.y = 1.1;
      torso.castShadow = true;

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.38, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.5 })
      );
      head.position.y = 1.88;
      head.castShadow = true;

      g.add(torso, head);
      return g;
    }

    let amyModel = null;
    let mixer = null;
    const actions = {
      idle: null,
      run: null,
      jump: null
    };
    let activeAnimName = 'idle';

    function sanitizeAnimationClipForModel(clip, model) {
      const validNames = new Set();
      model.traverse((obj) => {
        if (obj.name) validNames.add(obj.name);
      });

      const filteredTracks = clip.tracks.filter((track) => {
        const dotIdx = track.name.indexOf('.');
        const nodeName = dotIdx >= 0 ? track.name.slice(0, dotIdx) : track.name;
        const propName = dotIdx >= 0 ? track.name.slice(dotIdx + 1) : '';
        if (!validNames.has(nodeName)) return false;
        if (propName === 'scale') return false;
        if (propName === 'position' && /hip|pelvis|root|armature/i.test(nodeName)) return false;
        return true;
      });

      return new THREE.AnimationClip(clip.name, clip.duration, filteredTracks);
    }

    function playAnimation(name, fadeDuration = 0.16) {
      if (!mixer) return;
      const nextAction = actions[name];
      if (!nextAction) return;

      if (activeAnimName === name && nextAction.isRunning()) return;

      const prevAction = actions[activeAnimName];
      nextAction.reset();
      nextAction.setEffectiveTimeScale(1);
      nextAction.setEffectiveWeight(1);
      nextAction.play();

      if (prevAction && prevAction !== nextAction) {
        prevAction.crossFadeTo(nextAction, fadeDuration, false);
      }

      activeAnimName = name;
    }

    function updatePlayerAnimationState(isGrounded, horizSpeed, dt) {
      if (mixer) {
        mixer.update(dt);
      }

      const moving = horizSpeed > 0.35;

      if (!isGrounded) {
        if (actions.jump) {
          playAnimation('jump', 0.12);
        } else if (actions.run && moving) {
          playAnimation('run', 0.15);
        } else if (actions.idle) {
          playAnimation('idle', 0.18);
        }
      } else if (moving) {
        if (actions.run) {
          playAnimation('run', 0.14);
        }
      } else {
        if (actions.idle) {
          playAnimation('idle', 0.2);
        }
      }

      // Respiración / balanceo suave procedural en Idle para que siempre se vea viva
      if (amyModel && isGrounded && !moving && (!actions.idle || !mixer)) {
        const t = performance.now() * 0.003;
        amyModel.position.y = Math.sin(t * 1.8) * 0.035;
        amyModel.rotation.x = Math.sin(t * 1.4) * 0.025;
      } else if (amyModel) {
        amyModel.position.y = THREE.MathUtils.lerp(amyModel.position.y, 0, Math.min(1, dt * 12));
        amyModel.rotation.x = THREE.MathUtils.lerp(amyModel.rotation.x, 0, Math.min(1, dt * 12));
      }
    }

    function loadOptionalIdleClip() {
      gltfLoader.load(
        './Idle.glb',
        (idleGltf) => {
          if (!amyModel || !mixer || !idleGltf.animations || idleGltf.animations.length === 0) return;
          const cleanIdle = sanitizeAnimationClipForModel(idleGltf.animations[0], amyModel);
          if (cleanIdle.tracks.length > 0) {
            const idleAct = mixer.clipAction(cleanIdle);
            idleAct.setLoop(THREE.LoopRepeat, Infinity);
            actions.idle = idleAct;
            if (!player.moving && player.grounded) {
              playAnimation('idle', 0.15);
            }
          }
        },
        undefined,
        () => {}
      );
    }

    function loadJumpClip() {
      gltfLoader.load(
        './Jump.glb',
        (jumpGltf) => {
          if (!amyModel || !mixer || !jumpGltf.animations || jumpGltf.animations.length === 0) return;
          const cleanJump = sanitizeAnimationClipForModel(jumpGltf.animations[0], amyModel);
          if (cleanJump.tracks.length > 0) {
            const jumpAct = mixer.clipAction(cleanJump);
            jumpAct.setLoop(THREE.LoopOnce, 1);
            jumpAct.clampWhenFinished = true;
            actions.jump = jumpAct;
          }
        },
        undefined,
        () => {}
      );
    }

    function loadRunningClip() {
      gltfLoader.load(
        './Running-Amy.glb',
        (runGltf) => {
          if (!amyModel || !mixer || !runGltf.animations || runGltf.animations.length === 0) return;
          const cleanRun = sanitizeAnimationClipForModel(runGltf.animations[0], amyModel);
          if (cleanRun.tracks.length > 0) {
            const runAct = mixer.clipAction(cleanRun);
            runAct.setLoop(THREE.LoopRepeat, Infinity);
            actions.run = runAct;
          }
        },
        undefined,
        () => {}
      );
    }

    gltfLoader.load(
      './Amy.glb',
      (gltf) => {
        amyModel = gltf.scene;
        amyModel.scale.setScalar(1.35);
        amyModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        amyContainer.add(amyModel);
        mixer = new THREE.AnimationMixer(amyModel);

        if (gltf.animations && gltf.animations.length > 0) {
          const idleClip =
            gltf.animations.find((c) => /idle|breath|stand|wait/i.test(c.name)) ||
            gltf.animations[0];
          const cleanClip = sanitizeAnimationClipForModel(idleClip, amyModel);
          if (cleanClip.tracks.length > 0) {
            const act = mixer.clipAction(cleanClip);
            act.setLoop(THREE.LoopRepeat, Infinity);
            actions.idle = act;
            act.play();
          }
        }

        loadOptionalIdleClip();
        loadRunningClip();
        loadJumpClip();
        document.getElementById('loading-screen').classList.add('hidden');
      },
      undefined,
      () => {
        amyModel = createFallbackAmy();
        amyContainer.add(amyModel);
        document.getElementById('loading-screen').classList.add('hidden');
      }
    );

    // ==================== CONTROLES TÁCTILES + TECLADO ====================
    const player = {
      x: initialAnchor.x,
      y: initialAnchor.y,
      z: initialAnchor.z,
      vx: 0,
      vy: 0,
      vz: 0,
      yaw: 0,
      grounded: false,
      moving: false,
      currentStage: saveData.checkpoint,
      respawnLock: 0
    };

    let camYaw = 0;
    let camPitch = 0.34;
    const camDistance = 8.2;

    const keys = new Set();
    window.addEventListener('keydown', (e) => {
      keys.add(e.code);
      if (e.code === 'Space') {
        e.preventDefault();
        triggerJump();
      }
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    const jumpBtn = document.getElementById('jump-btn');

    let moveTouchId = null;
    let moveOrigin = { x: 0, y: 0 };
    let moveVec = { x: 0, y: 0 };

    let lookTouchId = null;
    let lastLookPos = { x: 0, y: 0 };

    const MAX_JOYSTICK_RADIUS = 44;

    function setJoystickVisual(active, cx, cy, dx = 0, dy = 0) {
      if (!active) {
        joystickBase.style.display = 'none';
        joystickKnob.style.transform = 'translate(-50%, -50%)';
        return;
      }
      joystickBase.style.display = 'block';
      joystickBase.style.left = `${cx}px`;
      joystickBase.style.top = `${cy}px`;
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    canvas.addEventListener('touchstart', (e) => {
      for (const touch of e.changedTouches) {
        const isLeftHalf = touch.clientX < window.innerWidth * 0.56;
        if (isLeftHalf && moveTouchId === null) {
          moveTouchId = touch.identifier;
          moveOrigin = { x: touch.clientX, y: touch.clientY };
          moveVec = { x: 0, y: 0 };
          setJoystickVisual(true, moveOrigin.x, moveOrigin.y, 0, 0);
        } else if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastLookPos = { x: touch.clientX, y: touch.clientY };
        }
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === moveTouchId) {
          let dx = touch.clientX - moveOrigin.x;
          let dy = touch.clientY - moveOrigin.y;
          const dist = Math.hypot(dx, dy);
          if (dist > MAX_JOYSTICK_RADIUS) {
            dx = (dx / dist) * MAX_JOYSTICK_RADIUS;
            dy = (dy / dist) * MAX_JOYSTICK_RADIUS;
          }
          moveVec.x = dx / MAX_JOYSTICK_RADIUS;
          moveVec.y = dy / MAX_JOYSTICK_RADIUS;
          setJoystickVisual(true, moveOrigin.x, moveOrigin.y, dx, dy);
        } else if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lastLookPos.x;
          const dy = touch.clientY - lastLookPos.y;
          lastLookPos = { x: touch.clientX, y: touch.clientY };
          camYaw -= dx * 0.0068;
          camPitch = THREE.MathUtils.clamp(camPitch + dy * 0.0052, 0.08, 1.05);
        }
      }
    }, { passive: true });

    function handleTouchEnd(e) {
      for (const touch of e.changedTouches) {
        if (touch.identifier === moveTouchId) {
          moveTouchId = null;
          moveVec = { x: 0, y: 0 };
          setJoystickVisual(false, 0, 0, 0, 0);
        } else if (touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    }
    canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: true });

    function triggerJump() {
      if (player.grounded && player.respawnLock <= 0) {
        player.vy = 11.4;
        player.grounded = false;
        if (actions.jump) {
          playAnimation('jump', 0.08);
        }
      }
    }

    jumpBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jumpBtn.classList.add('active');
      triggerJump();
    }, { passive: false });

    jumpBtn.addEventListener('touchend', () => {
      jumpBtn.classList.remove('active');
    });
    jumpBtn.addEventListener('mousedown', () => {
      jumpBtn.classList.add('active');
      triggerJump();
    });
    window.addEventListener('mouseup', () => jumpBtn.classList.remove('active'));

    // ==================== RESPAWN Y COLISIONES ====================
    function respawnPlayer(reasonToast) {
      if (player.respawnLock > 0) return;
      player.respawnLock = 0.45;
      const anchor = stageAnchors.get(saveData.checkpoint) || { x: 0, y: 1.0, z: 0 };
      player.x = anchor.x;
      player.y = anchor.y + 0.35;
      player.z = anchor.z;
      player.vx = 0;
      player.vy = 0;
      player.vz = 0;
      player.grounded = false;
      playerRoot.position.set(player.x, player.y, player.z);
      if (reasonToast) showToast(reasonToast);
    }

    function findFloorAt(x, z, prevY) {
      let bestTop = -Infinity;
      let carrier = null;
      const pad = 0.28;

      for (const p of platforms) {
        const halfW = p.w * 0.5 + pad;
        const halfD = p.d * 0.5 + pad;
        if (Math.abs(x - p.x) <= halfW && Math.abs(z - p.z) <= halfD) {
          const top = p.topY;
          if (top <= prevY + 1.45 && top > bestTop) {
            bestTop = top;
            carrier = p;
          }
        }
      }
      return { topY: bestTop, carrier };
    }

    // ==================== BUCLE PRINCIPAL ====================
    let lastTime = performance.now();
    let lastThemeIndex = -1;

    function updateEnvironment(stageNum, elapsed) {
      const themeIdx = Math.floor((stageNum - 1) / 20) % STAGE_THEMES.length;
      if (themeIdx !== lastThemeIndex) {
        lastThemeIndex = themeIdx;
        const th = STAGE_THEMES[themeIdx];
        skyMat.uniforms.topColor.value.setHex(th.skyTop);
        skyMat.uniforms.bottomColor.value.setHex(th.skyBottom);
        fog.color.setHex(th.fog);
      }

      skyDome.position.set(player.x, player.y, player.z);

      // Movimiento ondulatorio del mar de lava + resplandor
      const lavaPulse = 0.78 + Math.sin(elapsed * 2.4) * 0.18;
      lavaSeaMesh.material.emissiveIntensity = lavaPulse;
      lavaGlowLight.position.set(player.x, LAVA_BASE_Y + 3.2, player.z - 4);
      lavaGlowLight.intensity = 1.6 + Math.sin(elapsed * 3.1) * 0.35;

      for (const emMat of lavaEmissiveMeshes) {
        emMat.emissiveIntensity = 0.8 + Math.sin(elapsed * 2.2) * 0.2;
      }

      const posAttr = lavaSeaMesh.geometry.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const bx = lavaBasePositions[i * 3];
        const by = lavaBasePositions[i * 3 + 1];
        const wave = Math.sin(bx * 0.04 + elapsed * 1.4) * 0.28 + Math.cos(by * 0.04 + elapsed * 1.1) * 0.22;
        posAttr.setZ(i, wave);
      }
      posAttr.needsUpdate = true;

      // Chispas ascendentes sobre la lava
      const ePos = emberPoints.geometry.attributes.position;
      for (let i = 0; i < emberCount; i++) {
        let ey = ePos.getY(i) + emberSpeeds[i] * 0.016;
        if (ey > LAVA_BASE_Y + 14) {
          ey = LAVA_BASE_Y + 0.3;
          ePos.setX(i, player.x + (Math.random() - 0.5) * 90);
          ePos.setZ(i, player.z + (Math.random() - 0.5) * 90);
        }
        ePos.setY(i, ey);
      }
      ePos.needsUpdate = true;
    }

    function updatePlatforms(elapsed) {
      for (const p of movingPlatforms) {
        const prevX = p.mesh.position.x;
        const prevY = p.mesh.position.y;
        const prevZ = p.mesh.position.z;

        const offset = Math.sin(elapsed * p.moveSpeed + p.movePhase) * p.moveRange;
        let nx = p.baseX;
        let ny = p.baseY;
        let nz = p.baseZ;

        if (p.moveAxis === 'x') nx = p.baseX + offset;
        if (p.moveAxis === 'y') ny = p.baseY + offset;
        if (p.moveAxis === 'z') nz = p.baseZ + offset;

        p.mesh.position.set(nx, ny, nz);
        p.x = nx;
        p.y = ny;
        p.z = nz;
        p.topY = ny + p.h / 2;

        p.deltaX = nx - prevX;
        p.deltaY = ny - prevY;
        p.deltaZ = nz - prevZ;
      }
    }

    function updatePlayer(dt, elapsed) {
      if (player.respawnLock > 0) {
        player.respawnLock = Math.max(0, player.respawnLock - dt);
      }

      if (keys.has('ArrowLeft')) camYaw += 2.1 * dt;
      if (keys.has('ArrowRight')) camYaw -= 2.1 * dt;

      let inputX = moveVec.x;
      let inputZ = moveVec.y;

      if (keys.has('KeyA')) inputX -= 1;
      if (keys.has('KeyD')) inputX += 1;
      if (keys.has('KeyW')) inputZ -= 1;
      if (keys.has('KeyS')) inputZ += 1;

      const inputLen = Math.hypot(inputX, inputZ);
      if (inputLen > 1) {
        inputX /= inputLen;
        inputZ /= inputLen;
      }

      const forwardX = -Math.sin(camYaw);
      const forwardZ = -Math.cos(camYaw);
      const rightX = Math.cos(camYaw);
      const rightZ = -Math.sin(camYaw);

      let wishX = rightX * inputX - forwardX * inputZ;
      let wishZ = rightZ * inputX - forwardZ * inputZ;
      const wishLen = Math.hypot(wishX, wishZ);
      if (wishLen > 0.001) {
        wishX /= wishLen;
        wishZ /= wishLen;
      }

      const moveSpeed = 7.6;
      const accel = player.grounded ? 18.0 : 9.5;
      const targetVx = wishX * moveSpeed;
      const targetVz = wishZ * moveSpeed;

      player.vx = THREE.MathUtils.lerp(player.vx, targetVx, Math.min(1, accel * dt));
      player.vz = THREE.MathUtils.lerp(player.vz, targetVz, Math.min(1, accel * dt));

      const prevY = player.y;
      player.vy -= 26.5 * dt;

      const nextX = player.x + player.vx * dt;
      const nextZ = player.z + player.vz * dt;
      const nextY = player.y + player.vy * dt;

      const floor = findFloorAt(nextX, nextZ, prevY);
      player.grounded = false;

      if (player.vy <= 0 && floor.topY > -Infinity && nextY <= floor.topY + 0.08 && prevY >= floor.topY - 0.55) {
        player.y = floor.topY;
        player.vy = 0;
        player.grounded = true;

        if (floor.carrier && floor.carrier.moveAxis) {
          player.x = nextX + floor.carrier.deltaX;
          player.z = nextZ + floor.carrier.deltaZ;
        } else {
          player.x = nextX;
          player.z = nextZ;
        }
      } else {
        player.x = nextX;
        player.y = nextY;
        player.z = nextZ;
      }

      if (wishLen > 0.08) {
        const targetYaw = Math.atan2(wishX, wishZ);
        let diff = targetYaw - player.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.yaw += diff * Math.min(1, 14 * dt);
      }

      playerRoot.position.set(player.x, player.y, player.z);
      amyContainer.rotation.y = player.yaw;

      const horizSpeed = Math.hypot(player.vx, player.vz);
      player.moving = horizSpeed > 0.35;
      updatePlayerAnimationState(player.grounded, horizSpeed, dt);

      // Checkpoints
      for (const cp of checkpoints) {
        const dist = Math.hypot(player.x - cp.x, player.z - cp.z);
        if (dist < 2.6 && Math.abs(player.y - cp.y) < 2.2) {
          if (cp.stage > player.currentStage) {
            player.currentStage = cp.stage;
          }
          if (cp.stage > saveData.checkpoint) {
            saveData.checkpoint = cp.stage;
            cp.reached = true;
            cp.padMat.color.setHex(0x22c55e);
            cp.padMat.emissive.setHex(0x16a34a);
            cp.flagMat.color.setHex(0x22c55e);
            cp.flagMat.emissive.setHex(0x15803d);
            writeSave();
            updateHUD(cp.stage);
            showToast(`🏁 ¡Checkpoint Etapa ${cp.stage} guardado!`);
          } else {
            updateHUD(cp.stage);
          }
        }
      }

      // Monedas
      for (const c of coins) {
        if (c.collected) continue;
        c.mesh.rotation.y += 2.6 * dt;
        c.mesh.position.y = c.baseY + Math.sin(elapsed * 3 + c.phase) * 0.14;
        const dCoin = Math.hypot(player.x - c.mesh.position.x, (player.y + 1.0) - c.mesh.position.y, player.z - c.mesh.position.z);
        if (dCoin < 1.35) {
          c.collected = true;
          c.mesh.visible = false;
          collectedSet.add(c.id);
          saveData.collected = Array.from(collectedSet);
          saveData.coins += 1;
          writeSave();
          updateHUD(player.currentStage);
        }
      }

      // Enemigos aéreos
      for (const e of airEnemies) {
        const ex = e.baseX + Math.sin(elapsed * e.speed + e.phase) * e.rangeX;
        const ez = e.baseZ + Math.cos(elapsed * e.speed * 0.8 + e.phase) * e.rangeZ;
        const ey = e.baseY + Math.sin(elapsed * 3.2 + e.phase) * 0.35;
        e.group.position.set(ex, ey, ez);
        e.group.rotation.y += 2.2 * dt;
        const flap = Math.sin(elapsed * 14 + e.phase) * 0.45;
        e.leftWing.rotation.z = flap;
        e.rightWing.rotation.z = -flap;

        const dEnemy = Math.hypot(player.x - ex, (player.y + 1.0) - ey, player.z - ez);
        if (dEnemy < 1.35) {
          respawnPlayer('💥 ¡Te golpeó un enemigo aéreo!');
          return;
        }
      }

      // Caída a la lava o fuera del mapa
      const lavaWaveAtPlayer = LAVA_BASE_Y + Math.sin(player.x * 0.04 + elapsed * 1.4) * 0.28 + Math.cos(player.z * 0.04 + elapsed * 1.1) * 0.22;
      if (player.y <= lavaWaveAtPlayer + 0.55 || player.y < -18) {
        respawnPlayer('🔥 ¡Caíste en la lava! Regresaste al punto seguro');
      }
    }

    function updateCamera() {
      const targetX = player.x;
      const targetY = player.y + 1.65;
      const targetZ = player.z;

      const horizDist = Math.cos(camPitch) * camDistance;
      const vertDist = Math.sin(camPitch) * camDistance;

      const desiredX = targetX + Math.sin(camYaw) * horizDist;
      const desiredY = targetY + vertDist;
      const desiredZ = targetZ + Math.cos(camYaw) * horizDist;

      camera.position.lerp(new THREE.Vector3(desiredX, desiredY, desiredZ), 0.16);
      camera.lookAt(targetX, targetY, targetZ);

      dirLight.position.set(player.x + 22, player.y + 38, player.z + 18);
      dirLight.target.position.set(player.x, player.y, player.z);
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const elapsed = now * 0.001;

      updatePlatforms(elapsed);
      updatePlayer(dt, elapsed);
      updateEnvironment(player.currentStage, elapsed);
      updateCamera();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateHUD(saveData.checkpoint);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
